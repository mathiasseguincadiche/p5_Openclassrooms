# =============================================
# TEMPLATE : Fichier d'inventaire Ansible (format INI)
# =============================================
# Ce fichier permet de définir les serveurs à configurer avec Ansible.
# Il peut être au format INI (comme ci-dessous) ou YAML.
#
# Pour utiliser ce template :
# 1. Copiez ce fichier dans votre projet sous le nom "inventory.ini".
# 2. Personnalisez-le avec vos serveurs.
# 3. Utilisez-le avec un playbook : ansible-playbook -i inventory.ini playbook.yml

# =============================================
# GROUPES : Définition des groupes de serveurs
# =============================================

# Groupe 1 : Serveurs web
[webservers]
# Format : nom_du_serveur ansible_host=IP_ou_NOM_D_HOTE ansible_user=UTILISATEUR ansible_ssh_private_key_file=CHEMIN_VERS_CLE
server1 ansible_host=192.168.1.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa
server2 ansible_host=192.168.1.11 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

# Groupe 2 : Serveurs de base de données
[dbservers]
db-server ansible_host=192.168.1.12 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

# Groupe 3 : Serveurs de cache (Redis)
[cache_servers]
redis-server ansible_host=192.168.1.13 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

# =============================================
# GROUPES DE GROUPES : Regrouper plusieurs groupes
# =============================================

# Groupe parent : Tous les serveurs de production
[production:children]
webservers
dbservers
cache_servers

# Groupe parent : Tous les serveurs
[all:children]
production

# =============================================
# VARIABLES : Définition des variables pour les groupes
# =============================================

# Variables pour le groupe webservers
[webservers:vars]
# Variables d'environnement
nginx_version="1.18.*"
server_name="mon-serveur-web"

# Variables pour le groupe dbservers
[dbservers:vars]
postgres_version="13"
db_name="mydb"
db_user="postgres"

# Variables pour tous les serveurs (all)
[all:vars]
# Options SSH globales
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

# =============================================
# EXEMPLES D'UTILISATION :
# =============================================
# 1. Cibler tous les serveurs :
#    ansible -i inventory.ini all -m ping
#
# 2. Cibler uniquement les serveurs web :
#    ansible -i inventory.ini webservers -m ping
#
# 3. Cibler un serveur spécifique :
#    ansible -i inventory.ini server1 -m ping
#
# 4. Exécuter un playbook sur tous les serveurs :
#    ansible-playbook -i inventory.ini playbook.yml
#
# 5. Exécuter un playbook sur les serveurs web :
#    ansible-playbook -i inventory.ini playbook.yml --limit webservers
# =============================================

# =============================================
# EXPLICATIONS :
# =============================================
# - [webservers] : Nom du groupe.
# - server1 : Nom du serveur dans le groupe.
# - ansible_host : Adresse IP ou nom d'hôte du serveur.
# - ansible_user : Utilisateur SSH pour se connecter au serveur.
# - ansible_ssh_private_key_file : Chemin vers la clé SSH privée.
# - ansible_password : Mot de passe SSH (à éviter en production !).
# - ansible_port : Port SSH (par défaut : 22).
# - [group:children] : Regroupe plusieurs groupes sous un nom parent.
# - [group:vars] : Variables spécifiques à un groupe.
# - [all:vars] : Variables pour tous les serveurs.
# - ansible_ssh_common_args : Options SSH supplémentaires.
# =============================================

# =============================================
# EXEMPLE AVEC DES CONTENEURS DOCKER (pour les tests locaux) :
# =============================================
# Si vous n'avez pas de serveurs distants, vous pouvez utiliser des conteneurs Docker
# comme serveurs de test. Voici un exemple de configuration :

# [webservers]
# ansible-node-1 ansible_host=localhost ansible_port=2221 ansible_user=ansible ansible_ssh_private_key_file=~/.ssh/test-key
# ansible-node-2 ansible_host=localhost ansible_port=2222 ansible_user=ansible ansible_ssh_private_key_file=~/.ssh/test-key
#
# Pour lancer les conteneurs Docker :
#   for i in {1..2}; do
#     docker run -d --name ansible-node-$i -p 222$i:22 ubuntu:latest tail -f /dev/null
#     docker exec ansible-node-$i apt-get update && apt-get install -y openssh-server sudo
#     docker exec ansible-node-$i echo 'root:password' | chpasswd
#     docker exec ansible-node-$i mkdir /var/run/sshd
#     docker exec ansible-node-$i /usr/sbin/sshd -D &
#   done
# =============================================

# =============================================
# SÉCURITÉ :
# =============================================
# 1. Évitez de stocker des mots de passe en clair dans l'inventaire.
#    Utilisez plutôt des clés SSH ou Ansible Vault.
#
# 2. Pour utiliser Ansible Vault :
#    - Chiffrez un fichier : ansible-vault encrypt secrets.yml
#    - Éditez un fichier chiffré : ansible-vault edit secrets.yml
#    - Exécutez un playbook avec un fichier chiffré :
#      ansible-playbook playbook.yml --ask-vault-pass
#
# 3. Limitez les permissions des utilisateurs SSH.
# =============================================
