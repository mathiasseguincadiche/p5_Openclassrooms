# =============================================
# TEMPLATE : Playbook Ansible pour configurer un serveur
# =============================================
# Ce playbook permet de configurer un serveur avec des tâches courantes :
# - Mise à jour des paquets.
# - Installation de logiciels (Nginx, Docker, etc.).
# - Configuration de services.
# - Gestion de fichiers et de templates.
#
# Pour utiliser ce template :
# 1. Copiez ce fichier dans votre projet.
# 2. Personnalisez-le selon vos besoins.
# 3. Créez un fichier d'inventaire (ex: inventory.ini).
# 4. Exécutez le playbook : ansible-playbook -i inventory.ini playbook.yml

---
# Définition du playbook
- name: Configurer un serveur et déployer une application
  # Cible : tous les serveurs dans le fichier d'inventaire (inventory.ini)
  hosts: all
  # Exécute les tâches en tant que root (nécessaire pour installer des paquets)
  become: true

  # Variables globales pour ce playbook
  vars:
    # Version de Nginx à installer
    nginx_version: "1.18.*"
    # Nom du serveur
    server_name: "mon-serveur"
    # Message personnalisé pour la page web
    custom_message: "Bienvenue sur mon serveur configuré avec Ansible !"

  # Liste des tâches à exécuter
  tasks:
    # --- Tâche 1 : Mettre à jour les paquets APT ---
    - name: Mettre à jour les paquets APT
      apt:
        update_cache: true
        upgrade: dist
      # Cette tâche ne s'exécute que sur les systèmes Debian/Ubuntu
      when: ansible_os_family == "Debian"
      # Explication :
      # - update_cache: yes : Met à jour le cache APT.
      # - upgrade: dist : Met à jour tous les paquets.
      # - when : Condition pour exécuter la tâche (ici, seulement sur Debian/Ubuntu).

    # --- Tâche 2 : Installer des paquets utiles ---
    - name: Installer des paquets utiles
      apt:
        name:
          - curl
          - wget
          - git
          - vim
          - htop
        state: present
      when: ansible_os_family == "Debian"

    # --- Tâche 3 : Installer Nginx ---
    - name: Installer Nginx
      apt:
        name: "nginx={{ nginx_version }}"
        state: present
      when: ansible_os_family == "Debian"
      # Explication :
      # - name : Nom du paquet à installer (avec variable).
      # - state: present : Installe le paquet s'il n'est pas déjà installé.

    # --- Tâche 4 : Démarrer et activer Nginx ---
    - name: Démarrer et activer Nginx
      service:
        name: nginx
        state: started
        enabled: true
      # Explication :
      # - name : Nom du service.
      # - state: started : Démarre le service.
      # - enabled: yes : Active le démarrage automatique au boot.

    # --- Tâche 5 : Créer un répertoire pour les fichiers de configuration ---
    - name: Créer un répertoire pour les fichiers de configuration
      file:
        path: /etc/nginx/conf.d
        state: directory
        mode: '0755'
      # Explication :
      # - path : Chemin du répertoire à créer.
      # - state: directory : Crée un répertoire.
      # - mode: '0755' : Permissions du répertoire (rwxr-xr-x).

    # --- Tâche 6 : Copier un fichier de configuration pour Nginx ---
    - name: Copier un fichier de configuration pour Nginx
      copy:
        dest: /etc/nginx/conf.d/custom.conf
        content: |
          server {
            listen 80;
            server_name {{ server_name }};

            location / {
              return 200 "{{ custom_message }}";
              add_header Content-Type text/plain;
            }
          }
      notify: Redémarrer Nginx
      # Explication :
      # - dest : Chemin de destination sur le serveur.
      # - content : Contenu du fichier (ici, une configuration Nginx).
      # - | : Permet de définir un contenu multi-lignes (YAML).
      # - notify : Déclenche un handler (tâche spéciale) si cette tâche change quelque chose.

    # --- Tâche 7 : Installer Docker ---
    - name: Installer Docker
      apt:
        name:
          - docker.io
          - docker-compose
        state: present
      when: ansible_os_family == "Debian"

    # --- Tâche 8 : Ajouter l'utilisateur au groupe Docker ---
    - name: Ajouter l'utilisateur au groupe Docker
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
      # Explication :
      # - name : Nom de l'utilisateur (utilise la variable ansible_user).
      # - groups: docker : Ajoute l'utilisateur au groupe docker.
      # - append: yes : Ajoute au groupe sans supprimer les autres groupes.

    # --- Tâche 9 : Installer Docker Compose ---
    - name: Installer Docker Compose
      get_url:
        url: https://github.com/docker/compose/releases/latest/download/docker-compose-Linux-x86_64
        dest: /usr/local/bin/docker-compose
        mode: '0755'
      when: ansible_os_family == "Debian"
      # Explication :
      # - url : URL du fichier à télécharger.
      # - dest : Chemin de destination.
      # - mode: '0755' : Permissions du fichier (rwxr-xr-x).

  # --- Handlers : Tâches déclenchées par des notifications ---
  handlers:
    - name: Redémarrer Nginx
      service:
        name: nginx
        state: restarted
      # Explication :
      # - Les handlers ne s'exécutent qu'une seule fois, même s'ils sont notifiés plusieurs fois.
      # - Ici, Nginx sera redémarré si le fichier de configuration est modifié.

# =============================================
# PERSONNALISATION :
# =============================================
# 1. Changez les variables globales :
#    vars:
#      nginx_version: "1.20.*"
#      server_name: "mon-autre-serveur"
#      custom_message: "Un autre message"
#
# 2. Ajoutez des tâches supplémentaires :
#    - name: Installer Apache
#      apt:
#        name: apache2
#        state: present
#      when: ansible_os_family == "Debian"
#
# 3. Utilisez des templates au lieu de fichiers statiques :
#    - name: Copier un template de configuration
#      template:
#        src: templates/nginx.conf.j2
#        dest: /etc/nginx/conf.d/default.conf
#      notify: Redémarrer Nginx
#
# 4. Ajoutez des conditions pour des systèmes spécifiques :
#    - name: Installer un paquet pour CentOS
#      yum:
#        name: httpd
#        state: present
#      when: ansible_os_family == "RedHat"
# =============================================

# =============================================
# EXÉCUTION :
# =============================================
# 1. Créez un fichier d'inventaire (ex: inventory.ini) :
#    [webservers]
#    server1 ansible_host=192.168.1.10 ansible_user=ubuntu
#    server2 ansible_host=192.168.1.11 ansible_user=ubuntu
#
# 2. Exécutez le playbook :
#    ansible-playbook -i inventory.ini playbook.yml
#
# 3. Exécutez le playbook en mode check (simulation) :
#    ansible-playbook -i inventory.ini playbook.yml --check
#
# 4. Exécutez seulement certaines tâches avec des tags :
#    ansible-playbook -i inventory.ini playbook.yml --tags "install"
# =============================================

# =============================================
# BONNES PRATIQUES :
# =============================================
# 1. Utilisez des rôles pour organiser votre code (ex: roles/nginx/tasks/main.yml).
# 2. Utilisez des variables pour éviter de hardcoder des valeurs.
# 3. Utilisez des templates pour générer des fichiers de configuration dynamiques.
# 4. Utilisez des handlers pour redémarrer des services après une modification.
# 5. Utilisez des tags pour exécuter seulement certaines tâches.
# 6. Vérifiez toujours avec --check avant d'appliquer les changements.
# 7. Documentez chaque tâche avec un nom clair.
# =============================================
