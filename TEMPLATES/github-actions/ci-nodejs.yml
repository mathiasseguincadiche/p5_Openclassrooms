# =============================================
# BONNES PRATIQUES :
# =============================================
# 1. Utilisez toujours `npm ci` au lieu de `npm install` pour une installation déterministe.
# 2. Cachez les dépendances pour accélérer les builds.
# 3. Exécutez les tests et le linting dans le même job pour éviter de dupliquer le code.
# 4. Utilisez des secrets pour les informations sensibles (ex: tokens, clés API).
# 5. Documentez chaque étape avec un nom clair.
