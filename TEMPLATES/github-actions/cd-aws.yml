# =============================================

# =============================================
# SECRETS NÉCESSAIRES :
# =============================================
# Pour utiliser ce workflow, vous devez configurer les secrets suivants dans GitHub :
# 1. DOCKER_USERNAME : Votre nom d'utilisateur Docker Hub.
# 2. DOCKER_PASSWORD : Votre mot de passe ou token Docker Hub.
# 3. AWS_ACCESS_KEY_ID : Votre clé d'accès AWS.
# 4. AWS_SECRET_ACCESS_KEY : Votre clé secrète AWS.
#
# Pour configurer les secrets :
# 1. Allez dans votre dépôt GitHub.
# 2. Cliquez sur Settings > Secrets and variables > Actions.
# 3. Cliquez sur New repository secret.
# 4. Ajoutez chaque secret avec son nom et sa valeur.
# =============================================

# =============================================
# BONNES PRATIQUES :
# =============================================
# 1. Utilisez toujours des tags immuables (ex: SHA du commit) pour une traçabilité unique.
# 2. Ne stockez jamais de secrets dans le code ou les fichiers de workflow.
# 3. Utilisez des jobs séparés pour la CI et la CD pour une meilleure isolation.
# 4. Ajoutez des notifications en cas d'échec (Slack, email, etc.).
# 5. Testez toujours le workflow en local avant de le pousser vers GitHub.
# =============================================
