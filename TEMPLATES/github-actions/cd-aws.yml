# =============================================
# TEMPLATE : Workflow CD pour AWS (GitHub Actions)
# =============================================
# Ce workflow s'exécute après un push réussi sur la branche `main`.
# Il permet de :
# 1. Construire une image Docker.
# 2. Pousser l'image vers Docker Hub ou AWS ECR.
# 3. Déployer l'application sur AWS (ECS, EKS, EC2).
#
# Pour utiliser ce template :
# 1. Copiez ce fichier dans .github/workflows/cd-aws.yml
# 2. Configurez les secrets GitHub (DOCKER_USERNAME, DOCKER_PASSWORD, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY).
# 3. Personnalisez-le selon vos besoins.
# 4. Commitez et poussez vers GitHub.

# Nom du workflow (affiché dans l'onglet Actions de GitHub)
name: CD - AWS

# Déclencheur : après un push réussi sur main
on:
  push:
    branches: [ "main" ]

# Jobs à exécuter
jobs:
  # Job 1 : Construire et pousser l'image Docker
  build-and-push:
    # Ce job dépend du succès du workflow CI (si vous en avez un)
    # needs: test-and-lint  # Décommentez si vous avez un job CI
    runs-on: ubuntu-latest

    steps:
      # --- Étape 1 : Checkout du code ---
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Étape 2 : Configuration de Docker Buildx ---
      # Docker Buildx permet de construire des images multi-architectures.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # --- Étape 3 : Connexion à Docker Hub ---
      # Utilise les secrets DOCKER_USERNAME et DOCKER_PASSWORD.
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        # Explication : Les secrets sont stockés dans GitHub et ne sont pas exposés dans le code.

      # --- Étape 4 : Construire et pousser l'image Docker ---
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          # Contexte de build (répertoire courant)
          context: .
          
          # Fichier Dockerfile à utiliser (par défaut : Dockerfile)
          file: ./Dockerfile
          
          # Construire et pousser l'image
          push: true
          
          # Tags pour l'image (nom:tag)
          # Utilisez votre nom d'utilisateur Docker Hub et le SHA du commit pour une traçabilité unique.
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mon-app:latest
            ${{ secrets.DOCKER_USERNAME }}/mon-app:${{ github.sha }}

  # Job 2 : Déployer sur AWS ECS (optionnel)
  deploy-to-ecs:
    # Ce job dépend du succès du job build-and-push
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # --- Étape 1 : Checkout du code ---
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Étape 2 : Configuration de AWS CLI ---
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  # Changez pour votre région

      # --- Étape 3 : Connexion à AWS ECR ---
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # --- Étape 4 : Construire, tagger et pousser l'image vers ECR ---
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: mon-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Construire l'image
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          
          # Tagger l'image avec latest
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          # Pousser l'image vers ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # --- Étape 5 : Déployer sur AWS ECS ---
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: .aws/task-definition.json  # Fichier de définition de tâche ECS
          service: mon-app-service
          cluster: mon-app-cluster
          wait-for-service-stability: true

