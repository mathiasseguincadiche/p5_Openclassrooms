# =============================================
# TEMPLATE : docker-compose.yml pour une application multi-conteneurs
# =============================================
# Ce fichier permet de définir et gérer des applications multi-conteneurs
# avec Docker Compose. Chaque service est expliqué ci-dessous.

# Version du schéma Docker Compose (3.x est recommandée)
version: "3.8"

# =============================================
# SERVICES : Liste des services (conteneurs) à lancer
# =============================================

services:
  # --- Service 1 : Application Backend (Node.js) ---
  backend:
    # Construire l'image à partir du Dockerfile dans le répertoire courant
    build: .
    
    # Nom du conteneur (optionnel)
    container_name: p5-backend
    
    # Mapper le port 3000 du conteneur au port 3000 de l'hôte
    ports:
      - "3000:3000"
    
    # Variables d'environnement
    environment:
      - NODE_ENV=production
      - DB_HOST=db  # Nom du service de la base de données (Docker Compose gère le DNS)
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=mydb
    
    # Dépendre du service de base de données (attendre que la DB soit prête)
    depends_on:
      - db
    
    # Volumes pour persister des données ou monter des fichiers
    volumes:
      - ./logs:/app/logs  # Monte le dossier ./logs local dans /app/logs dans le conteneur
    
    # Redémarrer automatiquement en cas d'erreur
    restart: unless-stopped

  # --- Service 2 : Base de données PostgreSQL ---
  db:
    # Utiliser une image PostgreSQL officielle
    image: postgres:13
    
    # Nom du conteneur (optionnel)
    container_name: p5-db
    
    # Variables d'environnement pour PostgreSQL
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mydb
    
    # Persister les données dans un volume nommé
    volumes:
      - db_data:/var/lib/postgresql/data
    
    # Mapper le port 5432 du conteneur au port 5432 de l'hôte (optionnel)
    ports:
      - "5432:5432"
    
    # Redémarrer automatiquement en cas d'erreur
    restart: unless-stopped

  # --- Service 3 : Cache Redis ---
  redis:
    # Utiliser une image Redis officielle
    image: redis:alpine
    
    # Nom du conteneur (optionnel)
    container_name: p5-redis
    
    # Persister les données Redis dans un volume nommé
    volumes:
      - redis_data:/data
    
    # Mapper le port 6379 du conteneur au port 6379 de l'hôte (optionnel)
    ports:
      - "6379:6379"
    
    # Redémarrer automatiquement en cas d'erreur
    restart: unless-stopped

  # --- Service 4 : Application Frontend (React, Vue, Angular) ---
  frontend:
    # Construire l'image à partir du Dockerfile dans le dossier ./frontend
    build: ./frontend
    
    # Nom du conteneur (optionnel)
    container_name: p5-frontend
    
    # Mapper le port 80 du conteneur au port 8080 de l'hôte
    ports:
      - "8080:80"
    
    # Dépendre du service backend
    depends_on:
      - backend
    
    # Redémarrer automatiquement en cas d'erreur
    restart: unless-stopped

# =============================================
# VOLUMES : Définition des volumes nommés (pour persister des données)
# =============================================

volumes:
  # Volume pour les données PostgreSQL
  db_data:
    # Driver de stockage (par défaut : local)
    driver: local

  # Volume pour les données Redis
  redis_data:
    driver: local

# =============================================
# RÉSEAUX : Définition des réseaux (optionnel)
# =============================================
# Par défaut, Docker Compose crée un réseau nommé "p5_default" pour tous les services.
# Vous pouvez définir des réseaux personnalisés si nécessaire.

# networks:
#   p5_network:
#     driver: bridge

# =============================================
# EXPLICATIONS SUPPLÉMENTAIRES :
# =============================================
# 1. version : Version du schéma Docker Compose (3.x est recommandée).
#
# 2. services : Liste des services (conteneurs) à lancer.
#    - build : Construire une image à partir d'un Dockerfile.
#    - image : Utiliser une image existante.
#    - container_name : Nom du conteneur (optionnel).
#    - ports : Mapper les ports (format : "hôte:conteneur").
#    - environment : Variables d'environnement.
#    - depends_on : Attendre que d'autres services soient prêts.
#    - volumes : Persister des données ou monter des fichiers.
#    - restart : Politique de redémarrage (no, always, on-failure, unless-stopped).
#
# 3. volumes : Définition des volumes nommés.
#    - Les volumes permettent de persister des données même après la suppression d'un conteneur.
#
# 4. networks : Définition des réseaux (optionnel).
#    - Par défaut, Docker Compose crée un réseau pour tous les services.
#    - Les services peuvent communiquer entre eux via leur nom (ex: db, redis).
#
# 5. Variables d'environnement :
#    - Vous pouvez utiliser des fichiers .env pour stocker des variables.
#    - Exemple : env_file: .env
# =============================================

# =============================================
# UTILISATION :
# 1. Copiez ce fichier dans votre projet et personnalisez-le.
# 2. Placez vos Dockerfiles dans les dossiers appropriés (ex: ./frontend/Dockerfile).
# 3. Démarrez les services :
#    docker-compose up -d
# 4. Arrêtez les services :
#    docker-compose down
# 5. Voir les logs :
#    docker-compose logs -f
# 6. Exécuter une commande dans un service :
#    docker-compose exec backend npm test
# =============================================
