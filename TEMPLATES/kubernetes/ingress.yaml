# =============================================
# TEMPLATE : Ingress Kubernetes
# =============================================
# Ce fichier permet de configurer un Ingress pour accéder à votre application
# via HTTP/HTTPS. Un Ingress agit comme un reverse proxy et peut router le trafic
# vers différents services en fonction du chemin ou du nom d'hôte.
#
# ⚠️ ATTENTION : Un Ingress nécessite un Ingress Controller pour fonctionner.
# Exemples d'Ingress Controllers :
# - NGINX Ingress Controller (recommandé)
# - Traefik
# - AWS ALB Ingress Controller
# - GCP Ingress Controller
#
# Pour utiliser ce template :
# 1. Installez un Ingress Controller (ex: minikube addons enable ingress).
# 2. Copiez ce fichier dans votre projet sous le nom "ingress.yaml".
# 3. Personnalisez-le selon vos besoins (hôte, chemins, etc.).
# 4. Appliquez l'Ingress : kubectl apply -f ingress.yaml

apiVersion: networking.k8s.io/v1  # Version de l'API Kubernetes pour les Ingress
kind: Ingress
metadata:
  # Nom de l'Ingress
  name: mon-app-ingress

  # Labels pour identifier l'Ingress
  labels:
    app: mon-app
    environment: production

  # Annotations pour configurer l'Ingress Controller
  annotations:
    # Annotation pour NGINX Ingress Controller : réécrire l'URL
    nginx.ingress.kubernetes.io/rewrite-target: /

    # Annotation pour activer le SSL (si vous utilisez des certificats)
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"

    # Annotation pour spécifier le certificat TLS
    # nginx.ingress.kubernetes.io/ssl-cert: "mon-namespace/mon-certificat-tls"

    # Annotation pour limiter la taille des requêtes
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

    # Annotation pour activer CORS (si nécessaire)
    # nginx.ingress.kubernetes.io/enable-cors: "true"
    # nginx.ingress.kubernetes.io/cors-allow-origin: "*"

spec:
  # Règles de routage
  rules:
    # Règle 1 : Router le trafic vers mon-app-service pour le chemin /
    - host: mon-app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mon-app-service
                port:
                  number: 80

  # Règle 2 : Router le trafic vers un autre service pour le chemin /api
  # - host: api.example.com
  #   http:
  #     paths:
  #     - path: /api
  #       pathType: Prefix
  #       backend:
  #         service:
  #           name: mon-api-service
  #           port:
  #             number: 8080

  # Règle 3 : Router le trafic vers un service pour un chemin exact
  # - http:
  #     paths:
  #     - path: /healthz
  #       pathType: Exact
  #       backend:
  #         service:
  #           name: mon-app-service
  #           port:
  #             number: 80

  # Configuration TLS (optionnelle, pour HTTPS)
  # tls:
  # - hosts:
  #   - mon-app.example.com
  #   secretName: mon-certificat-tls  # Nom du Secret contenant le certificat TLS

# =============================================
# EXPLICATIONS :
# =============================================
# 1. apiVersion : Version de l'API Kubernetes pour les Ingress (networking.k8s.io/v1).
#
# 2. kind : Type de ressource (Ingress).
#
# 3. metadata : Métadonnées (nom, labels, annotations).
#    - name : Nom de l'Ingress.
#    - labels : Labels pour identifier l'Ingress.
#    - annotations : Annotations pour configurer l'Ingress Controller.
#      - Les annotations dépendent de l'Ingress Controller utilisé.
#      - Exemple pour NGINX : nginx.ingress.kubernetes.io/rewrite-target
#
# 4. spec : Spécification de l'Ingress.
#    - rules : Liste des règles de routage.
#      - host : Nom d'hôte (optionnel, * pour tous les hôtes).
#      - http : Règles pour le trafic HTTP.
#        - paths : Liste des chemins à router.
#          - path : Chemin URL (ex: /, /api, /healthz).
#          - pathType : Type de correspondance.
#            - Prefix : Correspond à tous les chemins commençant par le path (ex: /api correspond à /api/foo, /api/bar).
#            - Exact : Correspond exactement au path (ex: /api correspond uniquement à /api).
#            - ImplementationSpecific : Dépend de l'Ingress Controller.
#          - backend : Service backend vers lequel router le trafic.
#            - service : Nom du service Kubernetes.
#            - port : Port du service.
#    - tls : Configuration TLS pour HTTPS.
#      - hosts : Liste des noms d'hôte pour lesquels le certificat est valide.
#      - secretName : Nom du Secret contenant le certificat TLS.
#
# 5. Ingress Controller :
#    - Un Ingress Controller est nécessaire pour que l'Ingress fonctionne.
#    - Exemples :
#      - NGINX Ingress Controller : https://kubernetes.github.io/ingress-nginx/
#      - Traefik : https://doc.traefik.io/traefik/providers/kubernetes-ingress/
#      - AWS ALB Ingress Controller : https://kubernetes-sigs.github.io/aws-load-balancer-controller/
#
# 6. Certificats TLS :
#    - Pour utiliser HTTPS, vous devez créer un Secret contenant un certificat TLS.
#    - Exemple pour créer un Secret avec cert-manager :
#      apiVersion: cert-manager.io/v1
#      kind: Certificate
#      metadata:
#        name: mon-certificat
#      spec:
#        secretName: mon-certificat-tls
#        dnsNames:
#        - mon-app.example.com
#        issuerRef:
#          name: letsencrypt-prod
#          kind: ClusterIssuer
# =============================================

# =============================================
# PERSONNALISATION :
# =============================================
# 1. Changez le nom de l'Ingress :
#    metadata:
#      name: mon-autre-ingress
#
# 2. Changez le nom d'hôte :
#    spec:
#      rules:
#      - host: mon-autre-app.example.com
#
# 3. Ajoutez des règles de routage supplémentaires :
#    spec:
#      rules:
#      - host: mon-app.example.com
#        http:
#          paths:
#          - path: /
#            pathType: Prefix
#            backend:
#              service:
#                name: mon-app-service
#                port:
#                  number: 80
#          - path: /api
#            pathType: Prefix
#            backend:
#              service:
#                name: mon-api-service
#                port:
#                  number: 8080
#
# 4. Ajoutez une configuration TLS :
#    spec:
#      tls:
#      - hosts:
#        - mon-app.example.com
#        secretName: mon-certificat-tls
#
# 5. Ajoutez des annotations spécifiques à votre Ingress Controller :
#    metadata:
#      annotations:
#        nginx.ingress.kubernetes.io/ssl-redirect: "true"
#        nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
# =============================================

# =============================================
# EXEMPLES D'INGRESS CONTROLLERS :
# =============================================
# 1. NGINX Ingress Controller (recommandé) :
#    - Installation avec Helm :
#      helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
#      helm repo update
#      helm install ingress-nginx ingress-nginx/ingress-nginx
#    - Installation avec Minikube :
#      minikube addons enable ingress
#
# 2. Traefik Ingress Controller :
#    - Installation avec Helm :
#      helm repo add traefik https://traefik.github.io/charts
#      helm repo update
#      helm install traefik traefik/traefik
#
# 3. AWS ALB Ingress Controller :
#    - Installation :
#      helm repo add eks https://aws.github.io/eks-charts
#      helm repo update
#      helm install aws-load-balancer-controller eks/aws-load-balancer-controller \
#        --set clusterName=mon-cluster \
#        --set serviceAccount.create=true \
#        --set serviceAccount.name=aws-load-balancer-controller
# =============================================

# =============================================
# COMMANDES UTILES :
# =============================================
# 1. Appliquer l'Ingress :
#    kubectl apply -f ingress.yaml
#
# 2. Voir les Ingress :
#    kubectl get ingress
#
# 3. Voir les détails de l'Ingress :
#    kubectl describe ingress mon-app-ingress
#
# 4. Voir les pods de l'Ingress Controller :
#    kubectl get pods -n ingress-nginx
#
# 5. Voir les services de l'Ingress Controller :
#    kubectl get svc -n ingress-nginx
#
# 6. Récupérer l'IP de l'Ingress :
#    kubectl get ingress mon-app-ingress -o jsonpath='{.spec.rules[0].host}'
#    kubectl get ingress mon-app-ingress -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
#
# 7. Supprimer l'Ingress :
#    kubectl delete ingress mon-app-ingress
# =============================================

# =============================================
# BONNES PRATIQUES :
# =============================================
# 1. Utilisez des noms d'hôte explicites (évitez * si possible).
# 2. Utilisez des pathTypes appropriés (Prefix pour les APIs, Exact pour les endpoints spécifiques).
# 3. Utilisez des annotations pour configurer l'Ingress Controller.
# 4. Activez HTTPS avec des certificats TLS (ex: Let's Encrypt).
# 5. Limitez la taille des requêtes pour éviter les attaques DoS.
# 6. Configurez CORS si nécessaire.
# 7. Utilisez des Ingress multiples pour des applications complexes.
# 8. Documentez vos Ingress avec des commentaires.
# =============================================
