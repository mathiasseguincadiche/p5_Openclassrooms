# =============================================
# TEMPLATE : ConfigMap Kubernetes
# =============================================
# Ce fichier permet de stocker des configurations non sensibles avec un ConfigMap.
# Un ConfigMap peut contenir :
# - Des variables d'environnement.
# - Des fichiers de configuration.
# - Des paires clé-valeur.
#
# Pour utiliser ce template :
# 1. Copiez ce fichier dans votre projet sous le nom "configmap.yaml".
# 2. Personnalisez-le selon vos besoins (variables, fichiers, etc.).
# 3. Appliquez le ConfigMap : kubectl apply -f configmap.yaml
# 4. Utilisez le ConfigMap dans un déploiement.

apiVersion: v1
kind: ConfigMap
metadata:
  # Nom du ConfigMap
  name: mon-app-config
  
  # Labels pour identifier le ConfigMap
  labels:
    app: mon-app
    environment: production

# Données du ConfigMap (paires clé-valeur)
data:
  # --- Variables d'environnement ---
  # Ces variables peuvent être utilisées dans un déploiement avec envFrom.
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  PORT: "8080"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "mydb"
  
  # --- Fichiers de configuration ---
  # Ces fichiers peuvent être montés comme volumes dans un conteneur.
  # Utilisez | pour définir un contenu multi-lignes (YAML).
  nginx.conf: |
    server {
      listen 8080;
      server_name localhost;
      
      location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
      
      location /healthz {
        return 200 "OK";
        add_header Content-Type text/plain;
      }
    }
  
  # Exemple de fichier de configuration pour une application Node.js
  app.config.json: |
    {
      "environment": "production",
      "port": 3000,
      "database": {
        "host": "postgres",
        "port": 5432,
        "name": "mydb"
      },
      "logging": {
        "level": "info",
        "file": "/var/log/app.log"
      }
    }
  
  # Exemple de fichier .env (pour les applications qui lisent depuis un fichier .env)
  dotenv: |
    ENVIRONMENT=production
    PORT=3000
    DB_HOST=postgres
    DB_PORT=5432
    DB_NAME=mydb

# =============================================
# EXPLICATIONS :
# =============================================
# 1. apiVersion : Version de l'API Kubernetes (v1 pour les ConfigMaps).
#
# 2. kind : Type de ressource (ConfigMap).
#
# 3. metadata : Métadonnées (nom, labels, annotations).
#    - name : Nom du ConfigMap.
#    - labels : Labels pour identifier le ConfigMap.
#
# 4. data : Données du ConfigMap.
#    - Les clés sont des chaînes de caractères.
#    - Les valeurs peuvent être des chaînes de caractères ou des fichiers.
#    - Utilisez | pour définir un contenu multi-lignes (YAML).
#
# 5. Utilisation dans un déploiement :
#    - Comme variables d'environnement :
#      envFrom:
#      - configMapRef:
#          name: mon-app-config
#    - Comme fichier monté :
#      volumes:
#      - name: config-volume
#        configMap:
#          name: mon-app-config
#      volumeMounts:
#      - name: config-volume
#        mountPath: /etc/config
# =============================================

# =============================================
# PERSONNALISATION :
# =============================================
# 1. Changez le nom du ConfigMap :
#    metadata:
#      name: mon-autre-config
#
# 2. Ajoutez des variables d'environnement :
#    data:
#      NEW_VARIABLE: "valeur"
#
# 3. Ajoutez des fichiers de configuration :
#    data:
#      nouveau-fichier.conf: |
#        configuration = valeur
#        autre_configuration = autre_valeur
#
# 4. Utilisez des variables dans les fichiers :
#    data:
#      nginx.conf: |
#        server {
#          listen ${{ PORT }};
#          server_name ${{ SERVER_NAME }};
#        }
#    ⚠️ Note : Les ConfigMaps ne supportent pas les variables dynamiques.
#    Utilisez des templates Helm ou Kustomize pour cela.
# =============================================

# =============================================
# EXEMPLES D'UTILISATION :
# =============================================
# 1. Utiliser le ConfigMap comme variables d'environnement :
#    apiVersion: apps/v1
#    kind: Deployment
#    metadata:
#      name: mon-app
#    spec:
#      template:
#        spec:
#          containers:
#          - name: mon-app
#            image: mon-app:v1.0.0
#            envFrom:
#            - configMapRef:
#                name: mon-app-config
#
# 2. Utiliser le ConfigMap comme fichier monté :
#    apiVersion: apps/v1
#    kind: Deployment
#    metadata:
#      name: mon-app
#    spec:
#      template:
#        spec:
#          containers:
#          - name: mon-app
#            image: mon-app:v1.0.0
#            volumeMounts:
#            - name: config-volume
#              mountPath: /etc/nginx/conf.d/default.conf
#              subPath: nginx.conf
#          volumes:
#          - name: config-volume
#            configMap:
#              name: mon-app-config
#
# 3. Utiliser une clé spécifique du ConfigMap :
#    apiVersion: apps/v1
#    kind: Deployment
#    metadata:
#      name: mon-app
#    spec:
#      template:
#        spec:
#          containers:
#          - name: mon-app
#            image: mon-app:v1.0.0
#            env:
#            - name: PORT
#              valueFrom:
#                configMapKeyRef:
#                  name: mon-app-config
#                  key: PORT
# =============================================

# =============================================
# COMMANDES UTILES :
# =============================================
# 1. Appliquer le ConfigMap :
#    kubectl apply -f configmap.yaml
#
# 2. Voir les ConfigMaps :
#    kubectl get configmaps
#
# 3. Voir les détails du ConfigMap :
#    kubectl describe configmap mon-app-config
#
# 4. Voir le contenu du ConfigMap :
#    kubectl get configmap mon-app-config -o yaml
#
# 5. Supprimer le ConfigMap :
#    kubectl delete configmap mon-app-config
# =============================================

# =============================================
# BONNES PRATIQUES :
# =============================================
# 1. Utilisez des ConfigMaps pour les configurations non sensibles.
# 2. Utilisez des Secrets pour les données sensibles (mots de passe, clés API).
# 3. Utilisez des noms de ConfigMaps clairs et descriptifs.
# 4. Organisez vos ConfigMaps par application ou environnement.
# 5. Évitez de stocker des fichiers binaires dans des ConfigMaps.
# 6. Limitez la taille des ConfigMaps (1 Mo maximum par défaut).
# 7. Documentez vos ConfigMaps avec des commentaires.
# 8. Utilisez des outils comme Helm ou Kustomize pour gérer des ConfigMaps complexes.
# =============================================
