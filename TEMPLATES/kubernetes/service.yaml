# =============================================
# TEMPLATE : Service Kubernetes
# =============================================
# Ce fichier permet d'exposer une application avec un Service.
# Un Service permet de :
# - Exposer une application en interne ou en externe.
# - Équilibrer la charge entre plusieurs pods.
# - Stabiliser les adresses IP et les ports.
#
# Pour utiliser ce template :
# 1. Copiez ce fichier dans votre projet sous le nom "service.yaml".
# 2. Personnalisez-le selon vos besoins (type, ports, etc.).
# 3. Appliquez le service : kubectl apply -f service.yaml

apiVersion: v1
kind: Service
metadata:
  # Nom du service
  name: mon-app-service

  # Labels pour identifier le service
  labels:
    app: mon-app
    environment: production

spec:
  # Sélecteur pour trouver les pods à exposer
  selector:
    app: mon-app  # Doit correspondre aux labels des pods à exposer

  # Ports à exposer
  ports:
    - name: http  # Nom du port (optionnel)
      protocol: TCP
      port: 80        # Port du service (utilisé pour accéder au service)
      targetPort: 80 # Port du conteneur (doit correspondre au port du conteneur)

    # Exemple pour un second port (ex: HTTPS)
    # - name: https
    #   protocol: TCP
    #   port: 443
    #   targetPort: 443

  # Type de service (ClusterIP, NodePort, LoadBalancer)
  type: ClusterIP

  # Pour un service de type LoadBalancer (cloud), vous pouvez spécifier une IP statique
  # loadBalancerIP: "192.0.2.100"

# =============================================
# EXPLICATIONS :
# =============================================
# 1. apiVersion : Version de l'API Kubernetes (v1 pour les services).
#
# 2. kind : Type de ressource (Service).
#
# 3. metadata : Métadonnées (nom, labels, annotations).
#    - name : Nom du service.
#    - labels : Labels pour identifier le service.
#
# 4. spec : Spécification du service.
#    - selector : Sélecteur pour trouver les pods à exposer.
#      - Doit correspondre aux labels des pods à exposer.
#    - ports : Liste des ports à exposer.
#      - name : Nom du port (optionnel).
#      - protocol : Protocole (TCP, UDP).
#      - port : Port du service (utilisé pour accéder au service).
#      - targetPort : Port du conteneur (doit correspondre au port du conteneur).
#        - Peut être un numéro de port ou un nom de port.
#    - type : Type de service.
#      - ClusterIP : Service interne (accessible uniquement dans le cluster).
#        - C'est le type par défaut.
#        - Le service est accessible via une IP interne (ex: 10.96.123.456).
#      - NodePort : Service accessible via un port sur chaque nœud.
#        - Le service est accessible via l'IP du nœud et un port aléatoire (30000-32767).
#        - Exemple : http://<IP_DU_NOEUD>:<NODE_PORT>
#      - LoadBalancer : Service accessible via un load balancer externe (cloud).
#        - Le service est accessible via une IP publique ou un DNS fourni par le cloud.
#        - Exemple : http://<LOAD_BALANCER_IP>
#      - ExternalName : Service qui pointe vers un nom DNS externe.
#        - Exemple : CNAME vers un service externe.
#
# 5. loadBalancerIP :
#    - Spécifie une IP statique pour un service de type LoadBalancer.
#    - Utile pour réserver une IP publique.
# =============================================

# =============================================
# PERSONNALISATION :
# =============================================
# 1. Changez le nom du service :
#    metadata:
#      name: mon-autre-service
#
# 2. Changez le sélecteur :
#    spec:
#      selector:
#        app: mon-autre-app
#
# 3. Changez le type de service :
#    spec:
#      type: NodePort  # Pour exposer le service sur un port du nœud
#    ou
#      type: LoadBalancer  # Pour exposer le service via un load balancer (cloud)
#
# 4. Ajoutez des ports supplémentaires :
#    spec:
#      ports:
#      - name: http
#        protocol: TCP
#        port: 80
#        targetPort: 80
#      - name: https
#        protocol: TCP
#        port: 443
#        targetPort: 443
#
# 5. Spécifiez une IP statique pour un LoadBalancer :
#    spec:
#      type: LoadBalancer
#      loadBalancerIP: "192.0.2.100"
# =============================================

# =============================================
# EXEMPLES D'UTILISATION :
# =============================================
# 1. Service ClusterIP (interne) :
#    - Accessible uniquement depuis le cluster.
#    - Exemple : Communication entre microservices.
#
# 2. Service NodePort (accès via le nœud) :
#    - Accessible via l'IP du nœud et un port aléatoire.
#    - Exemple : Développement local avec Minikube.
#    - Commande pour récupérer le NodePort :
#      kubectl get svc mon-app-service -o jsonpath='{.spec.ports[0].nodePort}'
#
# 3. Service LoadBalancer (accès via un load balancer cloud) :
#    - Accessible via une IP publique ou un DNS fourni par le cloud.
#    - Exemple : Production sur AWS, GCP, Azure.
#    - Commande pour récupérer l'IP du LoadBalancer :
#      kubectl get svc mon-app-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
#
# 4. Service ExternalName (alias DNS) :
#    - Pointe vers un nom DNS externe.
#    - Exemple : Alias vers un service externe (ex: base de données managée).
#    - Configuration :
#      spec:
#        type: ExternalName
#        externalName: mon-service-externe.example.com
# =============================================

# =============================================
# COMMANDES UTILES :
# =============================================
# 1. Appliquer le service :
#    kubectl apply -f service.yaml
#
# 2. Voir les services :
#    kubectl get services
#
# 3. Voir les détails du service :
#    kubectl describe service mon-app-service
#
# 4. Récupérer l'IP du service (ClusterIP) :
#    kubectl get svc mon-app-service -o jsonpath='{.spec.clusterIP}'
#
# 5. Récupérer le NodePort :
#    kubectl get svc mon-app-service -o jsonpath='{.spec.ports[0].nodePort}'
#
# 6. Récupérer l'IP du LoadBalancer :
#    kubectl get svc mon-app-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
#
# 7. Supprimer le service :
#    kubectl delete service mon-app-service
# =============================================

# =============================================
# BONNES PRATIQUES :
# =============================================
# 1. Utilisez des labels pour identifier vos services.
# 2. Utilisez des noms de ports clairs (ex: http, https, postgres).
# 3. Utilisez ClusterIP pour les communications internes.
# 4. Utilisez NodePort pour le développement local.
# 5. Utilisez LoadBalancer pour la production (cloud).
# 6. Évitez d'exposer des services en LoadBalancer sans restriction d'accès.
# 7. Utilisez des Ingress pour router le trafic HTTP/HTTPS.
# 8. Documentez vos services avec des commentaires.
# =============================================
