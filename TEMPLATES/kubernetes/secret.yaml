# =============================================
# TEMPLATE : Secret Kubernetes
# =============================================
# Ce fichier permet de stocker des données sensibles avec un Secret.
# Un Secret peut contenir :
# - Des mots de passe.
# - Des clés API.
# - Des certificats TLS/SSL.
# - Des tokens.
#
# ⚠️ ATTENTION :
# - Les Secrets ne sont PAS chiffrés par défaut dans Kubernetes.
# - Ils sont encodés en base64, mais peuvent être décodés facilement.
# - Pour une sécurité maximale, utilisez des outils comme :
#   - HashiCorp Vault
#   - AWS Secrets Manager
#   - Azure Key Vault
#   - Sealed Secrets (https://github.com/bitnami-labs/sealed-secrets)
#
# Pour utiliser ce template :
# 1. Copiez ce fichier dans votre projet sous le nom "secret.yaml".
# 2. Encodez vos données sensibles en base64 :
#    echo -n "valeur" | base64
# 3. Remplacez les valeurs dans le fichier par les valeurs encodées.
# 4. Appliquez le Secret : kubectl apply -f secret.yaml
# 5. Utilisez le Secret dans un déploiement.

apiVersion: v1
kind: Secret
metadata:
  # Nom du Secret
  name: mon-app-secrets
  
  # Labels pour identifier le Secret
  labels:
    app: mon-app
    environment: production

# Type de Secret (Opaque = données génériques)
type: Opaque

# Données du Secret (doivent être encodées en base64)
# Pour encoder une valeur : echo -n "valeur" | base64
# Pour décoder une valeur : echo "valeur_base64" | base64 --decode
data:
  # Mots de passe
  DB_PASSWORD: bW9uLW1vdC1kZS1wYXNzZQ==  # Encodage de "mon-mot-de-passe"
  ADMIN_PASSWORD: YWRtaW4xMjM=          # Encodage de "admin123"
  
  # Clés API
  API_KEY: c2VjcmV0LWtleQ==            # Encodage de "secret-key"
  STRIPE_SECRET_KEY: c3RyaXBlLXNlY3JldC1rZXk=  # Encodage de "stripe-secret-key"
  
  # Tokens
  JWT_SECRET: amF2YS1zZWNyZXQ=          # Encodage de "java-secret"
  GITHUB_TOKEN: Z2l0aHViLXRva2Vu        # Encodage de "github-token"
  
  # Configuration de la base de données
  DB_USER: cG9zdGdyZXM=               # Encodage de "postgres"
  DB_HOST: bG9jYWxob3N0               # Encodage de "localhost"

# =============================================
# EXPLICATIONS :
# =============================================
# 1. apiVersion : Version de l'API Kubernetes (v1 pour les Secrets).
#
# 2. kind : Type de ressource (Secret).
#
# 3. metadata : Métadonnées (nom, labels, annotations).
#    - name : Nom du Secret.
#    - labels : Labels pour identifier le Secret.
#
# 4. type : Type de Secret.
#    - Opaque : Données génériques (clé-valeur).
#    - kubernetes.io/tls : Certificat TLS.
#    - kubernetes.io/dockerconfigjson : Configuration Docker.
#    - bootstrap.kubernetes.io/token : Token de bootstrap.
#
# 5. data : Données du Secret.
#    - Les clés et les valeurs doivent être encodées en base64.
#    - Pour encoder : echo -n "valeur" | base64
#    - Pour décoder : echo "valeur_base64" | base64 --decode
#
# 6. Utilisation dans un déploiement :
#    - Comme variables d'environnement :
#      env:
#      - name: DB_PASSWORD
#        valueFrom:
#          secretKeyRef:
#            name: mon-app-secrets
#            key: DB_PASSWORD
#    - Comme fichier monté :
#      volumes:
#      - name: secret-volume
#        secret:
#          secretName: mon-app-secrets
#      volumeMounts:
#      - name: secret-volume
#        mountPath: /etc/secrets
# =============================================

# =============================================
# PERSONNALISATION :
# =============================================
# 1. Changez le nom du Secret :
#    metadata:
#      name: mon-autre-secret
#
# 2. Ajoutez des données sensibles :
#    data:
#      NEW_SECRET: base64_encoded_value
#
# 3. Changez le type de Secret (ex: pour un certificat TLS) :
#    type: kubernetes.io/tls
#    data:
#      tls.crt: base64_encoded_certificate
#      tls.key: base64_encoded_private_key
#
# 4. Utilisez des Secrets pour les images Docker :
#    type: kubernetes.io/dockerconfigjson
#    data:
#      .dockerconfigjson: base64_encoded_docker_config
# =============================================

# =============================================
# EXEMPLES D'UTILISATION :
# =============================================
# 1. Utiliser le Secret comme variable d'environnement :
#    apiVersion: apps/v1
#    kind: Deployment
#    metadata:
#      name: mon-app
#    spec:
#      template:
#        spec:
#          containers:
#          - name: mon-app
#            image: mon-app:v1.0.0
#            env:
#            - name: DB_PASSWORD
#              valueFrom:
#                secretKeyRef:
#                  name: mon-app-secrets
#                  key: DB_PASSWORD
#            - name: API_KEY
#              valueFrom:
#                secretKeyRef:
#                  name: mon-app-secrets
#                  key: API_KEY
#
# 2. Utiliser le Secret comme fichier monté :
#    apiVersion: apps/v1
#    kind: Deployment
#    metadata:
#      name: mon-app
#    spec:
#      template:
#        spec:
#          containers:
#          - name: mon-app
#            image: mon-app:v1.0.0
#            volumeMounts:
#            - name: secret-volume
#              mountPath: /etc/secrets
#              readOnly: true
#          volumes:
#          - name: secret-volume
#            secret:
#              secretName: mon-app-secrets
#
# 3. Utiliser un Secret de type TLS :
#    apiVersion: v1
#    kind: Secret
#    metadata:
#      name: mon-certificat-tls
#    type: kubernetes.io/tls
#    data:
#      tls.crt: base64_encoded_certificate
#      tls.key: base64_encoded_private_key
#
#    # Utilisation dans un Ingress :
#    apiVersion: networking.k8s.io/v1
#    kind: Ingress
#    metadata:
#      name: mon-ingress
#    spec:
#      tls:
#      - hosts:
#        - mon-app.example.com
#        secretName: mon-certificat-tls
# =============================================

# =============================================
# COMMANDES UTILES :
# =============================================
# 1. Appliquer le Secret :
#    kubectl apply -f secret.yaml
#
# 2. Voir les Secrets :
#    kubectl get secrets
#
# 3. Voir les détails du Secret (les valeurs sont masquées) :
#    kubectl describe secret mon-app-secrets
#
# 4. Voir le contenu du Secret (les valeurs sont encodées en base64) :
#    kubectl get secret mon-app-secrets -o yaml
#
# 5. Décoder une valeur du Secret :
#    kubectl get secret mon-app-secrets -o jsonpath='{.data.DB_PASSWORD}' | base64 --decode
#
# 6. Supprimer le Secret :
#    kubectl delete secret mon-app-secrets
# =============================================

# =============================================
# BONNES PRATIQUES :
# =============================================
# 1. Utilisez des Secrets pour les données sensibles (mots de passe, clés API, etc.).
# 2. Utilisez des ConfigMaps pour les configurations non sensibles.
# 3. Ne stockez jamais de Secrets dans le code ou dans Git.
# 4. Utilisez des outils comme Sealed Secrets pour chiffrer les Secrets dans Git.
# 5. Limitez l'accès aux Secrets avec des RBAC (Role-Based Access Control).
# 6. Utilisez des noms de Secrets clairs et descriptifs.
# 7. Évitez de monter des Secrets en tant que fichiers si possible (préférez les variables d'environnement).
# 8. Documentez vos Secrets avec des commentaires (sans inclure les valeurs sensibles).
# =============================================

# =============================================
# OUTILS POUR AMÉLIORER LA SÉCURITÉ :
# =============================================
# 1. Sealed Secrets :
#    - Permet de chiffrer les Secrets pour les stocker dans Git.
#    - Installation : kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.22.0/controller.yaml
#    - Chiffrer un Secret :
#      kubeseal --format yaml < secret.yaml > sealed-secret.yaml
#    - Appliquer le Secret chiffré : kubectl apply -f sealed-secret.yaml
#    - Site web : https://github.com/bitnami-labs/sealed-secrets
#
# 2. HashiCorp Vault :
#    - Gestion centralisée des secrets.
#    - Intégration avec Kubernetes via Vault Agent Injector.
#    - Site web : https://www.vaultproject.io/
#
# 3. AWS Secrets Manager :
#    - Gestion des secrets dans AWS.
#    - Intégration avec Kubernetes via External Secrets Operator.
#    - Site web : https://aws.amazon.com/secrets-manager/
#
# 4. Azure Key Vault :
#    - Gestion des secrets dans Azure.
#    - Intégration avec Kubernetes via Azure Key Vault Provider.
#    - Site web : https://azure.microsoft.com/en-us/services/key-vault/
# =============================================
