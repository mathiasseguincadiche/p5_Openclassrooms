---
# =============================================================================
# EXERCICE 2 : Rôle Logstash - Tâches principales
# =============================================================================

- name: Install required packages
  ansible.builtin.yum:
    name:
      - java-openjdk11
      - wget
      - tar
    state: present
    update_cache: yes
  
  tags:
    - dependencies

- name: Create Logstash user
  ansible.builtin.user:
    name: logstash
    comment: "Logstash user"
    shell: /bin/bash
    home: /usr/share/logstash
    create_home: yes
    system: yes
  
  tags:
    - user

- name: Create Logstash directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: logstash
    group: logstash
    mode: '0755'
  loop:
    - "/usr/share/logstash"
    - "/etc/logstash"
    - "/var/lib/logstash"
    - "/var/log/logstash"
    - "/etc/logstash/conf.d"
  
  tags:
    - directories

- name: Download Logstash
  ansible.builtin.get_url:
    url: "https://artifacts.elastic.co/downloads/logstash/logstash-{{ logstash_version }}-linux-x86_64.tar.gz"
    dest: "/tmp/logstash-{{ logstash_version }}-linux-x86_64.tar.gz"
    mode: '0755'
  
  tags:
    - download

- name: Extract Logstash
  ansible.builtin.unarchive:
    src: "/tmp/logstash-{{ logstash_version }}-linux-x86_64.tar.gz"
    dest: "/usr/share/"
    remote_src: yes
    owner: logstash
    group: logstash
  
  tags:
    - extract

- name: Create symlink for Logstash
  ansible.builtin.file:
    src: "/usr/share/logstash-{{ logstash_version }}"
    dest: "/usr/share/logstash"
    state: link
    owner: logstash
    group: logstash
  
  tags:
    - symlink

- name: Deploy Logstash configuration
  ansible.builtin.template:
    src: logstash.conf.j2
    dest: /etc/logstash/conf.d/logstash.conf
    owner: logstash
    group: logstash
    mode: '0644'
  
  notify: restart logstash
  
  tags:
    - configuration

- name: Deploy Logstash pipeline configuration
  ansible.builtin.template:
    src: pipelines.yml.j2
    dest: /etc/logstash/pipelines.yml
    owner: logstash
    group: logstash
    mode: '0644'
  
  notify: restart logstash
  
  tags:
    - configuration

- name: Deploy Logstash JVM options
  ansible.builtin.template:
    src: jvm.options.j2
    dest: /etc/logstash/jvm.options
    owner: logstash
    group: logstash
    mode: '0644'
  
  notify: restart logstash
  
  tags:
    - configuration

- name: Deploy Logstash systemd service
  ansible.builtin.template:
    src: logstash.service.j2
    dest: /etc/systemd/system/logstash.service
    mode: '0644'
  
  notify: restart logstash
  
  tags:
    - service

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: yes
  
  tags:
    - service

- name: Enable and start Logstash
  ansible.builtin.service:
    name: logstash
    state: started
    enabled: yes
  
  tags:
    - service
