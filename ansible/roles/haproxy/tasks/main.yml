---
# =============================================================================
# EXERCICE 3 : Rôle HAProxy - Tâches principales
# =============================================================================

- name: Install HAProxy
  ansible.builtin.yum:
    name: haproxy
    state: present
    update_cache: yes
  
  tags:
    - install

- name: Deploy HAProxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: '0644'
  
  notify: restart haproxy
  
  tags:
    - configuration

- name: Enable and start HAProxy
  ansible.builtin.service:
    name: haproxy
    state: started
    enabled: yes
  
  tags:
    - service
