---
# =============================================================================
# EXERCICE 2 : Rôle Filebeat - Tâches principales
# =============================================================================

- name: Install required packages
  ansible.builtin.yum:
    name:
      - wget
      - tar
      - gzip
    state: present
    update_cache: yes
  
  tags:
    - dependencies

- name: Download Filebeat
  ansible.builtin.get_url:
    url: "https://artifacts.elastic.co/downloads/beats/filebeat/filebeat-{{ filebeat_version }}-x86_64.rpm"
    dest: "/tmp/filebeat-{{ filebeat_version }}-x86_64.rpm"
    mode: '0755'
  
  tags:
    - download

- name: Install Filebeat
  ansible.builtin.yum:
    name: "/tmp/filebeat-{{ filebeat_version }}-x86_64.rpm"
    state: present
  
  tags:
    - install

- name: Deploy Filebeat configuration
  ansible.builtin.template:
    src: filebeat.yml.j2
    dest: /etc/filebeat/filebeat.yml
    owner: root
    group: root
    mode: '0644'
  
  notify: restart filebeat
  
  tags:
    - configuration

- name: Enable NGINX module
  ansible.builtin.command: filebeat modules enable nginx
  register: enable_nginx_module
  changed_when: enable_nginx_module.rc == 0
  
  tags:
    - modules

- name: Deploy NGINX module configuration
  ansible.builtin.template:
    src: nginx.yml.j2
    dest: /etc/filebeat/modules.d/nginx.yml
    owner: root
    group: root
    mode: '0644'
  
  notify: restart filebeat
  
  tags:
    - modules

- name: Enable and start Filebeat
  ansible.builtin.service:
    name: filebeat
    state: started
    enabled: yes
  
  tags:
    - service
