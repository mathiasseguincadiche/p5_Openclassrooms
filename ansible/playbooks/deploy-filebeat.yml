---
# =============================================================================
# EXERCICE 2 : Playbook Ansible - Déploiement Filebeat
# Fichier : playbooks/deploy-filebeat.yml
# =============================================================================

- name: Deploy Filebeat on NGINX servers
  hosts: nginx_servers
  become: true
  
  vars:
    filebeat_version: "8.11.1"
    logstash_host: "{{ groups['opensearch_servers'][0] }}"
    logstash_port: 5044
  
  roles:
    - filebeat
  
  post_tasks:
    - name: Display Filebeat status
      command: systemctl status filebeat
      register: filebeat_status
      changed_when: false
      
    - name: Show Filebeat status
      debug:
        msg: "Filebeat status: {{ filebeat_status.stdout }}"
