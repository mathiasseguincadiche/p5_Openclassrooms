---
- name: Deploy p5_Openclassrooms infrastructure
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    project_name: "p5_Openclassrooms"
    user: "appuser"
    group: "appgroup"

  tasks:
    - name: Ensure required packages are installed
      ansible.builtin.package:
        name:
          - git
          - curl
          - wget
          - unzip
          - python3
          - python3-pip
        state: present

    - name: Create application directory
      ansible.builtin.file:
        path: "/opt/{{ project_name }}"
        state: directory
        owner: "{{ user }}"
        group: "{{ group }}"
        mode: '0755'

    - name: Ensure application user exists
      ansible.builtin.user:
        name: "{{ user }}"
        group: "{{ group }}"
        shell: /bin/bash
        system: yes
        create_home: yes

    - name: Deploy application files
      ansible.builtin.copy:
        src: files/
        dest: "/opt/{{ project_name }}/"
        owner: "{{ user }}"
        group: "{{ group }}"
        mode: '0644'
      when: false  # Désactivé par défaut, à activer si tu as des fichiers à déployer
