---
# =============================================================================
# EXERCICE 3 : Playbook Ansible - Déploiement HAProxy
# Fichier : playbooks/deploy-haproxy.yml
# =============================================================================

- name: Deploy and configure HAProxy
  hosts: haproxy_servers
  become: true
  
  vars:
    haproxy_version: "2.6"
    nginx_1_private_ip: "{{ groups['nginx_servers'][0] }}"
    nginx_2_private_ip: "{{ groups['nginx_servers'][1] }}"
  
  roles:
    - haproxy
  
  post_tasks:
    - name: Display HAProxy status
      command: systemctl status haproxy
      register: haproxy_status
      changed_when: false
      
    - name: Show HAProxy status
      debug:
        msg: "HAProxy status: {{ haproxy_status.stdout }}"
