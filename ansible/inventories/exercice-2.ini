# =============================================================================
# EXERCICE 2 : Inventaire Ansible
# Fichier : inventories/exercice-2.ini
# Description : Liste des serveurs pour OpenSearch et Filebeat
# =============================================================================

# 📌 Après avoir exécuté Terraform, générez l'inventaire avec :
# ./scripts/generate-inventory.sh exercice-2

[opensearch_servers]
# Instance OpenSearch
opensearch ansible_host=1.2.3.4 ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/p5-key

[nginx_servers]
# Instances NGINX (de l'Exercice 1)
nginx-1 ansible_host=5.6.7.8 ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/p5-key
nginx-2 ansible_host=9.10.11.12 ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/p5-key

[all_servers:children]
opensearch_servers
nginx_servers

[all_servers:vars]
ansible_python_interpreter=/usr/bin/python3

# Variables spécifiques à OpenSearch
[opensearch_servers:vars]
opensearch_version=2.11.1
opensearch_home=/usr/share/opensearch
opensearch_data_dir=/var/lib/opensearch
opensearch_logs_dir=/var/log/opensearch

# Variables spécifiques à Logstash
[opensearch_servers:vars]
logstash_version=8.11.1

# Variables spécifiques à Filebeat
[nginx_servers:vars]
filebeat_version=8.11.1
logstash_host={{ groups['opensearch_servers'][0] }}
logstash_port=5044
