# =============================================================================
# EXERCICE 3 : Inventaire Ansible
# Fichier : inventories/exercice-3.ini
# Description : Liste des serveurs HAProxy et NGINX
# =============================================================================

[haproxy_servers]
# Remplacez l'IP par celle de votre instance HAProxy
haproxy ansible_host=1.2.3.4 ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/p5-key

[nginx_servers]
# Remplacez les IPs par celles de vos instances NGINX (de l'Exercice 1)
nginx-1 ansible_host=5.6.7.8 ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/p5-key
nginx-2 ansible_host=9.10.11.12 ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/p5-key

[all_servers:children]
haproxy_servers
nginx_servers

[all_servers:vars]
ansible_python_interpreter=/usr/bin/python3
