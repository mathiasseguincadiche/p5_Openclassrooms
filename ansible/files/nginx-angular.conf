server {
    listen 80;
    server_name _;

    # Dossier racine pour l'application Angular
    root /var/www/html;
    index index.html;

    # Gérer les routes Angular (pour le routage côté client)
    # Sans cette règle, les routes comme /products ou /about retourneront 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Désactiver le logging pour les fichiers statiques (optionnel, réduit les logs)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        access_log off;
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Activer la compression Gzip pour améliorer les performances
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied any;
    gzip_vary on;

    # Sécurité : Désactiver la signature de version de NGINX
    server_tokens off;

    # Sécurité : Empêcher l'accès aux fichiers cachés (ex: .htaccess, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
