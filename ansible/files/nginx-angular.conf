# =============================================================================
# CONFIGURATION NGINX POUR L'APPLICATION ANGULAR
# Projet P5 OpenClassrooms - Exercice 1
# =============================================================================

# Configuration du serveur par défaut
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    # Nom du serveur
    server_name _;
    
    # Racine du site
    root /var/www/html;
    index index.html;
    
    # Encodage
    charset utf-8;
    
    # Gestion des erreurs
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    # Configuration pour Angular (SPA - Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Fichiers statiques
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    
    # Fichiers de l'application Angular
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Désactiver le logging pour les fichiers statiques
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        access_log off;
        log_not_found off;
    }
    
    # Configuration pour les API (si nécessaire)
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
    
    # Redirection HTTP vers HTTPS (si HTTPS est configuré)
    # if ($scheme != "https") {
    #     return 301 https://$host$request_uri;
    # }
    
    # En-têtes de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # CORS pour les applications web
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
    
    # Compression Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    
    # Timeout
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    
    # Keepalive
    keepalive_timeout 75s;
    keepalive_requests 100;
}

# Configuration pour les erreurs personnalisées
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    
    server_name _;
    
    ssl_certificate /etc/ssl/certs/selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/selfsigned.key;
    
    root /var/www/html;
    index index.html;
    
    location / {
        try_files $uri $uri/ /index.html;
    }
}
