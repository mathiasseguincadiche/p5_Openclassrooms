---
extends: default

ignore: |
  **/.terraform/**
  **/node_modules/**
  **/dist/**

rules:
  document-start: disable
  line-length: disable
  truthy:
    allowed-values:
      - "true"
      - "false"
      - "on"
      - "off"
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
