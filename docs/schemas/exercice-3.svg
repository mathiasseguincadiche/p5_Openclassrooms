<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
<title id="title">Exercice 3 — HAProxy, round-robin et failover</title>
<desc id="desc">Topologie client HAProxy deux backends, puis chronologie de l’état normal, de la panne et de la reprise.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.8" refY="5" orient="auto">
    <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
  </marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8.8" refY="5" orient="auto">
    <path d="M0 0L10 5L0 10Z" fill="#059669"/>
  </marker>
</defs>

<style>
  text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .h{font-size:22px;font-weight:750;fill:#0f172a}
  .k{font-size:12px;font-weight:800;letter-spacing:1.3px;fill:#64748b}
  .t{font-size:16px;font-weight:750;fill:#0f172a}
  .b{font-size:14px;font-weight:600;fill:#334155}
  .s{font-size:12.5px;font-weight:500;fill:#475569}
  .m{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:12px;font-weight:650;fill:#334155}
  .arrow{fill:none;stroke:#64748b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
  .flow{fill:none;stroke:#94a3b8;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
  .chip{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}
</style>
<rect width="1200" height="390" rx="22" fill="#f8fafc"/>
<text x="42" y="48" class="k" text-anchor="start">EXERCICE 3 · HAUTE DISPONIBILITÉ</text>
<text x="42" y="78" class="h" text-anchor="start">Prouver la répartition, la continuité et la reprise.</text>
<rect x="42" y="108" width="1116" height="154" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/><text x="64" y="136" class="k" text-anchor="start">TOPOLOGIE</text>
<rect x="88" y="164" width="154" height="64" rx="13" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="165" y="190" class="t" text-anchor="middle">CLIENT HTTP</text>
<text x="165" y="212" class="s" text-anchor="middle">requêtes répétées</text>
<path d="M242 196H388" class="arrow"/><rect x="398" y="154" width="190" height="84" rx="42" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/><text x="493" y="187" class="t" text-anchor="middle" fill="#6d28d9">HAProxy</text>
<text x="493" y="210" class="s" text-anchor="middle">round-robin · health checks</text>
<path d="M588 196H676V166H734" class="arrow"/><path d="M588 196H676V226H734" class="arrow"/><rect x="744" y="142" width="232" height="48" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="762" y="171" class="b" text-anchor="start">p5-hello-1</text>
<rect x="901" y="151" width="58" height="30" rx="15" fill="#059669" stroke="#059669"/><text x="930.0" y="171" class="s" text-anchor="middle" fill="#fff">UP</text>
<rect x="744" y="202" width="232" height="48" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="762" y="231" class="b" text-anchor="start">p5-hello-2</text>
<rect x="901" y="211" width="58" height="30" rx="15" fill="#059669" stroke="#059669"/><text x="930.0" y="231" class="s" text-anchor="middle" fill="#fff">UP</text>
<rect x="1010" y="154" width="112" height="84" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="1.7"/><text x="1066" y="185" class="k" text-anchor="middle" fill="#047857">SERVICE</text>
<text x="1066" y="211" class="b" text-anchor="middle" fill="#047857">DISPONIBLE</text>
<text x="42" y="302" class="k" text-anchor="start">SCÉNARIO DE TEST</text>
<line x1="130" y1="342" x2="1070" y2="342" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/><circle cx="220" cy="342" r="13" fill="#059669" stroke="#fff" stroke-width="4"/><rect x="94" y="282" width="252" height="48" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/><text x="220" y="303" class="b" text-anchor="middle" fill="#059669">1 · ÉTAT NORMAL</text>
<text x="220" y="322" class="s" text-anchor="middle" fill="#059669">2 backends UP</text>
<text x="220" y="375" class="s" text-anchor="middle">les deux noms alternent</text>
<circle cx="600" cy="342" r="13" fill="#dc2626" stroke="#fff" stroke-width="4"/><rect x="474" y="282" width="252" height="48" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/><text x="600" y="303" class="b" text-anchor="middle" fill="#dc2626">2 · PANNE CONTRÔLÉE</text>
<text x="600" y="322" class="s" text-anchor="middle" fill="#dc2626">1 backend DOWN</text>
<text x="600" y="375" class="s" text-anchor="middle">HTTP reste disponible</text>
<circle cx="980" cy="342" r="13" fill="#059669" stroke="#fff" stroke-width="4"/><rect x="854" y="282" width="252" height="48" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/><text x="980" y="303" class="b" text-anchor="middle" fill="#059669">3 · REPRISE</text>
<text x="980" y="322" class="s" text-anchor="middle" fill="#059669">2 backends UP</text>
<text x="980" y="375" class="s" text-anchor="middle">backend réintégré</text>
</svg>
