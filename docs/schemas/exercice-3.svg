<text x="439" y="184" class="t" text-anchor="middle">HAProxy EC2</text><text x="439" y="209" class="s" text-anchor="middle">round-robin · health checks</text><text x="439" y="231" class="s" text-anchor="middle">SG public :80 · SSH /32</text>
