<text x="482" y="391" class="s" text-anchor="middle">t3.micro · Docker · nginx hello</text>
<text x="482" y="413" class="s" text-anchor="middle">HTTP 80 uniquement depuis SG HAProxy</text>

<rect x="730" y="165" width="385" height="285" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="755" y="195" class="ey">SUBNET PUBLIC 2 · DEUXIÈME AZ</text>
<rect x="765" y="278" width="315" height="100" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="1.7"/>
