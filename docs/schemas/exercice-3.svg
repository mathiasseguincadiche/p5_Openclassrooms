<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
<title id="title">Exercice 3 : HAProxy et reprise après panne</title>
<desc id="desc">HAProxy répartit les requêtes entre deux backends EC2 et retire automatiquement un serveur en panne.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
<rect width="960" height="280" rx="12" fill="#f8fafc"/>
<text x="32" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">Exercice 3 · répartir la charge et maintenir le service</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="32" y="94" width="160" height="100" rx="10" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="112" y="133" font-size="16" font-weight="700" fill="#0f172a">Client HTTP</text><text x="112" y="160" font-size="13" fill="#475569">rafraîchissements</text>
<rect x="270" y="78" width="210" height="132" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="375" y="115" font-size="16" font-weight="700" fill="#0f172a">HAProxy EC2</text><text x="375" y="142" font-size="13" fill="#475569">roundrobin · health checks</text><text x="375" y="164" font-size="13" fill="#475569">retire un backend DOWN</text>
<rect x="610" y="58" width="220" height="82" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="720" y="91" font-size="16" font-weight="700" fill="#065f46">Backend EC2 1</text><text x="720" y="116" font-size="13" fill="#065f46">nginxdemos/hello · UP/DOWN</text>
<rect x="610" y="158" width="220" height="82" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="720" y="191" font-size="16" font-weight="700" fill="#065f46">Backend EC2 2</text><text x="720" y="216" font-size="13" fill="#065f46">nginxdemos/hello · UP/DOWN</text>
</g>
<g stroke="#475569" stroke-width="2" marker-end="url(#a)"><line x1="192" y1="144" x2="262" y2="144"/><line x1="480" y1="124" x2="602" y2="99"/><line x1="480" y1="164" x2="602" y2="199"/></g>
<path d="M846 99C910 99 910 199 846 199" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/>
<text x="882" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#991b1b" transform="rotate(90 882 154)">panne puis retour</text>
<text x="32" y="258" font-family="Arial,sans-serif" font-size="14" fill="#475569">Preuves : alternance · panne sans interruption · réintégration automatique.</text>
</svg>
