<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
<title id="title">Exercice 3 : HAProxy et reprise après panne</title>
<desc id="desc">Le client contacte HAProxy, qui contrôle deux backends EC2, écarte celui en panne et le réintègre après son retour.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
  <style>
    .title{font:700 22px Arial,sans-serif;fill:#0f172a}.card-title{font:700 16px Arial,sans-serif;fill:#0f172a}.label{font:13px Arial,sans-serif;fill:#475569}.small{font:12px Arial,sans-serif;fill:#475569}.ok-title{font:700 16px Arial,sans-serif;fill:#065f46}.ok-label{font:13px Arial,sans-serif;fill:#065f46}.line{fill:none;stroke:#475569;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="960" height="300" rx="12" fill="#f8fafc"/>
<text x="32" y="38" class="title">Exercice 3 · répartir, détecter la panne et maintenir le service</text>

<g text-anchor="middle">
  <rect x="28" y="72" width="154" height="134" rx="10" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <g transform="translate(79 89)" class="line">
    <rect x="0" y="0" width="52" height="34" rx="4"/><line x1="0" y1="8" x2="52" y2="8"/>
    <circle cx="7" cy="4" r="1.5" fill="#64748b" stroke="none"/><circle cx="12" cy="4" r="1.5" fill="#64748b" stroke="none"/>
    <path d="M9 24h34M14 17h24"/>
  </g>
  <text x="105" y="139" class="card-title">Client HTTP</text>
  <text x="105" y="164" class="small">requêtes HTTP</text>
  <text x="105" y="185" class="small">rafraîchir pour tester</text>

  <rect x="222" y="72" width="202" height="134" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <g transform="translate(297 87)" class="line" stroke="#7c3aed">
    <circle cx="26" cy="18" r="10"/><path d="M16 18H2M36 18h14M26 8V0M26 28v8"/>
    <path d="M7 14l-5 4 5 4M45 14l5 4-5 4M22 5l4-5 4 5M22 31l4 5 4-5"/>
  </g>
  <text x="323" y="139" class="card-title">HAProxy EC2</text>
  <text x="323" y="164" class="label">roundrobin · health checks</text>
  <text x="323" y="185" class="label">retire un backend DOWN</text>

  <rect x="500" y="62" width="250" height="154" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="625" y="88" class="card-title">Pool de backends EC2</text>

  <rect x="522" y="101" width="206" height="42" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <g transform="translate(536 110)" class="line" stroke="#059669"><rect x="0" y="0" width="20" height="24" rx="2"/><line x1="5" y1="7" x2="15" y2="7"/><line x1="5" y1="13" x2="15" y2="13"/><circle cx="14" cy="19" r="1.5" fill="#059669" stroke="none"/></g>
  <text x="565" y="127" text-anchor="start" font-family="Arial,sans-serif" font-size="12" fill="#065f46">backend 1 · hello · UP</text>

  <rect x="522" y="157" width="206" height="42" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <g transform="translate(536 166)" class="line" stroke="#059669"><rect x="0" y="0" width="20" height="24" rx="2"/><line x1="5" y1="7" x2="15" y2="7"/><line x1="5" y1="13" x2="15" y2="13"/><circle cx="14" cy="19" r="1.5" fill="#059669" stroke="none"/></g>
  <text x="565" y="183" text-anchor="start" font-family="Arial,sans-serif" font-size="12" fill="#065f46">backend 2 · hello · UP</text>

  <rect x="790" y="72" width="142" height="134" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <g transform="translate(841 84) scale(.8)" class="line" stroke="#059669">
    <path d="M24 0l20 8v14c0 12-8 21-20 27C12 43 4 34 4 22V8Z"/>
    <path d="M14 23l7 7 14-17"/>
  </g>
  <text x="861" y="145" class="ok-title">Service disponible</text>
  <text x="861" y="172" class="ok-label">même avec 1 panne</text>
  <text x="861" y="193" class="ok-label">retour automatique</text>
</g>

<g class="line" marker-end="url(#arrow)">
  <line x1="182" y1="139" x2="214" y2="139"/>
  <path d="M424 139H462V122H492"/>
  <path d="M424 139H462V178H492"/>
  <line x1="750" y1="139" x2="782" y2="139"/>
</g>

<rect x="28" y="232" width="904" height="40" rx="8" fill="#e2e8f0"/>
<g font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">
  <circle cx="184" cy="252" r="6" fill="#059669"/><text x="270" y="257" fill="#334155">Normal : 2 backends UP</text>
  <circle cx="444" cy="252" r="6" fill="#dc2626"/><text x="542" y="257" fill="#334155">Panne : 1 DOWN, service OK</text>
  <circle cx="732" cy="252" r="6" fill="#059669"/><text x="824" y="257" fill="#334155">Reprise : 2 backends UP</text>
</g>
</svg>
