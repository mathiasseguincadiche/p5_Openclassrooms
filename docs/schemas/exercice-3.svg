<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">Exercice 3 — HAProxy dans le réseau réutilisé de l'exercice 1</title>
<desc id="desc">Dans le VPC et les subnets publics créés par l'exercice 1, le trafic public atteint HAProxy sur le port 80. HAProxy répartit ensuite le trafic privé vers deux backends et utilise des health checks pour retirer puis réintégrer un backend lors du scénario de panne contrôlée.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.h{font-size:22px;font-weight:750;fill:#0f172a}.k{font-size:12px;font-weight:800;letter-spacing:1px;fill:#64748b}.t{font-size:16px;font-weight:750;fill:#0f172a}.s{font-size:13px;font-weight:550;fill:#334155}.ar{fill:none;stroke:#64748b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}</style>
<rect width="1200" height="410" rx="22" fill="#f8fafc"/>
<text x="42" y="45" class="k">EXERCICE 3 · HAUTE DISPONIBILITÉ</text><text x="42" y="76" class="h">Prouver la répartition, la continuité de service et la réintégration.</text>
