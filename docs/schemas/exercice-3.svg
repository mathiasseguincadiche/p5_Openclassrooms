<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Exercice 3 : topologie HAProxy et cycle panne reprise</title>
<desc id="desc">Topologie réseau d’un client vers HAProxy et deux backends, complétée par une chronologie des états normal, panne et reprise.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
  <style>
  .title{font:700 28px Inter,Arial,sans-serif;fill:#0f172a}
  .subtitle{font:15px Inter,Arial,sans-serif;fill:#475569}
  .section{font:700 16px Inter,Arial,sans-serif;fill:#0f172a}
  .label{font:14px Inter,Arial,sans-serif;fill:#334155}
  .small{font:12px Inter,Arial,sans-serif;fill:#475569}
  .tiny{font:11px Inter,Arial,sans-serif;fill:#64748b}
  .mono{font:600 12px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#334155}
  .line{fill:none;stroke:#475569;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .soft{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
  .panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
</style>
</defs>
<rect width="1200" height="620" rx="18" fill="#f8fafc"/>
<text x="40" y="48" class="title">Exercice 3 · observer la haute disponibilité en action</text>
<text x="40" y="76" class="subtitle">La partie haute montre la topologie ; la partie basse montre le comportement dans le temps.</text>
<rect x="40" y="108" width="1120" height="300" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="66" y="140" class="section">TOPOLOGIE RÉSEAU</text>
<g>
  <rect x="86" y="202" width="172" height="92" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <rect x="119" y="222" width="106" height="54" rx="6" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <line x1="119" y1="235" x2="225" y2="235" stroke="#64748b"/>
  <text x="172" y="322" text-anchor="middle" class="section">Client HTTP</text>
  <text x="172" y="345" text-anchor="middle" class="small">requêtes répétées</text>
</g>
<path d="M258 248H390" class="line" marker-end="url(#arrow)"/>
<text x="324" y="237" text-anchor="middle" class="tiny">HTTP</text>
<g>
  <circle cx="480" cy="248" r="68" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <circle cx="480" cy="248" r="25" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <path d="M455 248h-28M505 248h28M480 223v-28M480 273v28" class="line" stroke="#7c3aed"/>
  <text x="480" y="253" text-anchor="middle" class="small" fill="#6d28d9">HAProxy</text>
  <text x="480" y="337" text-anchor="middle" class="label">round-robin + health checks</text>
</g>
<path d="M548 248H635V188H708" class="line" marker-end="url(#arrow)"/>
<path d="M548 248H635V308H708" class="line" marker-end="url(#arrow)"/>
<g>
  <rect x="718" y="146" width="294" height="84" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <rect x="742" y="166" width="46" height="46" rx="5" fill="#fff" stroke="#059669" stroke-width="2"/>
  <line x1="752" y1="178" x2="778" y2="178" stroke="#059669"/><line x1="752" y1="190" x2="778" y2="190" stroke="#059669"/>
  <text x="812" y="178" class="section">backend 1 · p5-hello-1</text>
  <text x="812" y="204" class="small">répond avec son propre nom</text>
  <circle cx="980" cy="188" r="10" fill="#059669"/><text x="980" y="193" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#fff">UP</text>
  <rect x="718" y="266" width="294" height="84" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <rect x="742" y="286" width="46" height="46" rx="5" fill="#fff" stroke="#059669" stroke-width="2"/>
  <line x1="752" y1="298" x2="778" y2="298" stroke="#059669"/><line x1="752" y1="310" x2="778" y2="310" stroke="#059669"/>
  <text x="812" y="298" class="section">backend 2 · p5-hello-2</text>
  <text x="812" y="324" class="small">répond avec son propre nom</text>
  <circle cx="980" cy="308" r="10" fill="#059669"/><text x="980" y="313" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#fff">UP</text>
</g>
<rect x="1035" y="181" width="92" height="134" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<path d="M1081 204l26 10v20c0 16-10 29-26 37-16-8-26-21-26-37v-20Z" fill="#fff" stroke="#059669" stroke-width="2"/>
<path d="M1068 235l9 9 18-21" fill="none" stroke="#059669" stroke-width="3"/>
<text x="1081" y="340" text-anchor="middle" class="small" fill="#047857">service</text>
<text x="1081" y="358" text-anchor="middle" class="small" fill="#047857">disponible</text>
<text x="40" y="452" class="section">SCÉNARIO DE TEST</text>
<line x1="128" y1="524" x2="1072" y2="524" stroke="#94a3b8" stroke-width="4"/>
<circle cx="220" cy="524" r="18" fill="#059669"/>
<circle cx="600" cy="524" r="18" fill="#dc2626"/>
<circle cx="980" cy="524" r="18" fill="#059669"/>
<rect x="96" y="468" width="248" height="44" rx="12" fill="#ecfdf5" stroke="#059669"/>
<text x="220" y="487" text-anchor="middle" class="section" fill="#047857">1 · ÉTAT NORMAL</text>
<text x="220" y="505" text-anchor="middle" class="tiny">les deux noms alternent</text>
<rect x="476" y="468" width="248" height="44" rx="12" fill="#fef2f2" stroke="#dc2626"/>
<text x="600" y="487" text-anchor="middle" class="section" fill="#b91c1c">2 · PANNE CONTRÔLÉE</text>
<text x="600" y="505" text-anchor="middle" class="tiny">1 backend DOWN, HTTP reste OK</text>
<rect x="856" y="468" width="248" height="44" rx="12" fill="#ecfdf5" stroke="#059669"/>
<text x="980" y="487" text-anchor="middle" class="section" fill="#047857">3 · REPRISE</text>
<text x="980" y="505" text-anchor="middle" class="tiny">backend redémarré puis réintégré</text>
<text x="220" y="570" text-anchor="middle" class="mono">roundrobin.sh</text>
<text x="600" y="570" text-anchor="middle" class="mono">failover.sh --apply</text>
<text x="980" y="570" text-anchor="middle" class="mono">2 backends UP</text>
</svg>
