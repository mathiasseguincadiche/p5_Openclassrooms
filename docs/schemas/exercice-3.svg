<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Exercice 3 : HAProxy</title>
<desc id="desc">Une instance EC2 HAProxy envoie les requêtes vers deux backends EC2 et retire automatiquement un backend en panne.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#5f5a73"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.14"/>
  </filter>
</defs>
<rect width="100%" height="100%" rx="24" fill="#f7f7fb"/>
<text x="60" y="65" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#242038">Exercice 3 · Répartir la charge et résister à une panne</text>
<text x="60" y="96" font-family="Arial, sans-serif" font-size="17" fill="#5f5a73">Sur AWS, HAProxy contrôle la santé des deux instances EC2 nginxdemos/hello.</text>
<g filter="url(#shadow)"><rect x="55" y="220" width="210" height="190" rx="18" fill="#ffffff" stroke="#2d7dd2" stroke-width="3"/></g>
<rect x="55" y="220" width="210" height="10" rx="5" fill="#2d7dd2"/>
<text x="79" y="265" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#242038">Utilisateur</text>
<text x="79" y="298" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">Requêtes HTTP</text>
<text x="79" y="323" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">rafraîchissements</text><g filter="url(#shadow)"><rect x="355" y="175" width="270" height="280" rx="18" fill="#ffffff" stroke="#7451eb" stroke-width="3"/></g>
<rect x="355" y="175" width="270" height="10" rx="5" fill="#7451eb"/>
<text x="379" y="220" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#242038">HAProxy EC2</text>
<text x="379" y="253" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">frontend :80</text>
<text x="379" y="278" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">balance roundrobin</text>
<text x="379" y="303" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">option httpchk</text>
<text x="379" y="328" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">timeouts</text><g filter="url(#shadow)"><rect x="745" y="125" width="350" height="170" rx="18" fill="#ffffff" stroke="#2f9e6f" stroke-width="3"/></g>
<rect x="745" y="125" width="350" height="10" rx="5" fill="#2f9e6f"/>
<text x="769" y="170" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#242038">Backend EC2 1</text>
<text x="769" y="203" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">nginxdemos/hello</text>
<text x="769" y="228" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">état UP ou DOWN</text><g filter="url(#shadow)"><rect x="745" y="345" width="350" height="170" rx="18" fill="#ffffff" stroke="#2f9e6f" stroke-width="3"/></g>
<rect x="745" y="345" width="350" height="10" rx="5" fill="#2f9e6f"/>
<text x="769" y="390" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#242038">Backend EC2 2</text>
<text x="769" y="423" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">nginxdemos/hello</text>
<text x="769" y="448" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">état UP ou DOWN</text><line x1="265" y1="315" x2="355" y2="315" stroke="#5f5a73" stroke-width="3" marker-end="url(#arrow)"/>
<text x="310.0" y="305.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#5f5a73">requête</text><line x1="625" y1="275" x2="745" y2="210" stroke="#5f5a73" stroke-width="3" marker-end="url(#arrow)"/>
<text x="685.0" y="232.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#5f5a73">check + trafic</text><line x1="625" y1="355" x2="745" y2="430" stroke="#5f5a73" stroke-width="3" marker-end="url(#arrow)"/>
<text x="685.0" y="382.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#5f5a73">check + trafic</text><path d="M1100 210 C1160 210,1160 430,1100 430" fill="none" stroke="#d65353" stroke-width="3" stroke-dasharray="8 7"/><text x="1130" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#d65353" transform="rotate(90 1130 325)">panne puis réintégration</text><rect x="50" y="585" width="1100" height="42" rx="12" fill="#ebe8fb"/><text x="600" y="612" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7451eb">Preuves : alternance, arrêt d’un backend, service maintenu, puis retour automatique du backend</text>
</svg>
