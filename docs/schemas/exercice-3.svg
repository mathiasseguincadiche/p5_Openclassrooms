<text x="482" y="250" class="t" text-anchor="middle">EC2 p5-haproxy</text>
<text x="482" y="276" class="s" text-anchor="middle">t3.micro · Ubuntu 24.04</text>
<text x="482" y="298" class="s" text-anchor="middle">SG : HTTP 80 public · SSH /32</text>
<rect x="320" y="335" width="325" height="90" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="1.7"/>
