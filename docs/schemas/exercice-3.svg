<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Exercice 3 — HAProxy, répartition et reprise</title>
<desc id="desc">Schéma pédagogique de l'exercice 3. Le client passe par HAProxy, qui répartit les requêtes entre deux backends. En cas de panne d'un backend, HAProxy le retire, continue avec l'autre, puis le réintègre après son retour.</desc>
<defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
  <style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.k{font-size:12px;font-weight:800;letter-spacing:1px;fill:#64748b}.h{font-size:25px;font-weight:760;fill:#0f172a}.t{font-size:18px;font-weight:760;fill:#0f172a}.s{font-size:14px;font-weight:560;fill:#334155}.ar{fill:none;stroke:#475569;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}</style>
</defs>
<rect width="1200" height="520" rx="24" fill="#f8fafc"/>
<text x="42" y="43" class="k">EXERCICE 3 · LOAD BALANCING ET RÉSILIENCE</text>
<text x="42" y="79" class="h">HAProxy répartit la charge et maintient le service pendant une panne</text>

<rect x="80" y="135" width="170" height="100" rx="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
<text x="165" y="178" class="t" text-anchor="middle">Client</text>
<text x="165" y="207" class="s" text-anchor="middle">HTTP :80</text>

<rect x="380" y="125" width="230" height="120" rx="20" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="495" y="164" class="t" text-anchor="middle">HAProxy</text>
<text x="495" y="194" class="s" text-anchor="middle">round-robin</text>
<text x="495" y="219" class="s" text-anchor="middle">health checks HTTP</text>

<rect x="760" y="105" width="220" height="100" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="870" y="146" class="t" text-anchor="middle">Backend 1</text>
<text x="870" y="176" class="s" text-anchor="middle">EC2 + Docker + hello</text>
<rect x="760" y="225" width="220" height="100" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="870" y="266" class="t" text-anchor="middle">Backend 2</text>
<text x="870" y="296" class="s" text-anchor="middle">EC2 + Docker + hello</text>

<path d="M250 185H370" class="ar"/><path d="M610 185H700V155H750" class="ar"/><path d="M610 185H700V275H750" class="ar"/>
<text x="310" y="170" class="s" text-anchor="middle">requêtes</text><text x="676" y="170" class="s" text-anchor="middle">répartit</text>

<text x="70" y="380" class="k">SCÉNARIO DE PANNE — À EXPLIQUER DE GAUCHE À DROITE</text>
<rect x="70" y="405" width="220" height="74" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="180" y="433" class="t" text-anchor="middle">1 · Normal</text><text x="180" y="459" class="s" text-anchor="middle">2 backends disponibles</text>
<rect x="340" y="405" width="220" height="74" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="450" y="433" class="t" text-anchor="middle">2 · Panne</text><text x="450" y="459" class="s" text-anchor="middle">backend 1 retiré</text>
<rect x="610" y="405" width="220" height="74" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="720" y="433" class="t" text-anchor="middle">3 · Continuité</text><text x="720" y="459" class="s" text-anchor="middle">backend 2 continue</text>
<rect x="880" y="405" width="250" height="74" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="1005" y="433" class="t" text-anchor="middle">4 · Réintégration</text><text x="1005" y="459" class="s" text-anchor="middle">backend 1 revient dans le pool</text>
<path d="M290 442H330" class="ar"/><path d="M560 442H600" class="ar"/><path d="M830 442H870" class="ar"/>

<text x="1015" y="160" class="s">fall 3 = retrait</text><text x="1015" y="190" class="s">rise 2 = retour</text>
<text x="42" y="505" class="s">À retenir : l'utilisateur parle à HAProxy ; HAProxy choisit un backend sain ; la panne d'un serveur ne coupe pas le service.</text>
</svg>
