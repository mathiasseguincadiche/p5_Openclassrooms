<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Exercice 3 — placement HAProxy et deux backends dans le VPC</title>
<desc id="desc">L'exercice 3 réutilise le VPC et les deux subnets publics de l'exercice 1. Dans le premier subnet se trouvent l'EC2 p5-haproxy et le backend p5-hello-1. Dans le second subnet se trouve p5-hello-2. Les trois EC2 sont t3.micro Ubuntu 24.04. Le client accède à HAProxy en HTTP public ; HAProxy communique avec les backends via leurs IP privées et applique round-robin et health checks.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
  <style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.ey{font-size:12px;font-weight:800;letter-spacing:1px;fill:#64748b}.h{font-size:24px;font-weight:760;fill:#0f172a}.t{font-size:17px;font-weight:760;fill:#0f172a}.s{font-size:13px;font-weight:560;fill:#334155}.ar{fill:none;stroke:#475569;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}</style>
</defs>
<rect width="1200" height="650" rx="24" fill="#f8fafc"/>
<text x="42" y="42" class="ey">EXERCICE 3 · ARCHITECTURE HAUTE DISPONIBILITÉ</text>
<text x="42" y="77" class="h">Où sont placées les trois EC2 et comment HAProxy distribue-t-il le trafic ?</text>

