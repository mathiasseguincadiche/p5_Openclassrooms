<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Finalisation — preuves, livrables, destruction ordonnée et audit AWS</title>
<desc id="desc">Le P5 valide d'abord les preuves et les livrables, puis détruit les ressources des exercices dans l'ordre 3, 2, 1 avant un audit AWS final. Le budget de surveillance peut être conservé pour signaler une ressource d'exercice oubliée.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.h{font-size:22px;font-weight:750;fill:#0f172a}.k{font-size:12px;font-weight:800;letter-spacing:1px;fill:#64748b}.t{font-size:16px;font-weight:750;fill:#0f172a}.s{font-size:13px;font-weight:550;fill:#334155}.ar{fill:none;stroke:#64748b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}</style>
<rect width="1200" height="320" rx="22" fill="#f8fafc"/>
<text x="42" y="45" class="k">FINALISATION · PREUVES ET FERMETURE DU LAB</text><text x="42" y="76" class="h">Prouver avant de détruire, puis vérifier qu'aucune ressource d'exercice ne reste active.</text>
<rect x="42" y="118" width="214" height="100" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="1.7"/>
<text x="64" y="148" class="k">1 · PREUVES</text><text x="64" y="178" class="t">diagnostics</text><text x="64" y="201" class="s">logs · captures · manifest</text>
<rect x="302" y="118" width="214" height="100" rx="16" fill="#fff7ed" stroke="#d97706" stroke-width="1.7"/>
<text x="324" y="148" class="k">2 · LIVRABLES</text><text x="324" y="178" class="t">finalize</text><text x="324" y="201" class="s">sélection · contexte · secrets masqués</text>
<rect x="562" y="106" width="276" height="124" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="1.7"/>
<text x="584" y="136" class="k">3 · DESTRUCTION ORDONNÉE</text><text x="700" y="170" class="t" text-anchor="middle">Exercice 3 → Exercice 2 → Exercice 1</text><text x="700" y="198" class="s" text-anchor="middle">Terraform destroy par module propriétaire</text><text x="700" y="218" class="s" text-anchor="middle">le state reste la source de propriété</text>
<rect x="884" y="106" width="274" height="124" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="1.7"/>
<text x="906" y="136" class="k">4 · AUDIT AWS</text><text x="906" y="168" class="t">NETTOYAGE AWS COMPLET</text><text x="906" y="195" class="s">0 ressource d'exercice active</text><text x="906" y="217" class="s">budget de surveillance conservable</text>
<path d="M256 168H292" class="ar"/><path d="M516 168H552" class="ar"/><path d="M838 168H874" class="ar"/>
<rect x="884" y="252" width="274" height="42" rx="21" fill="#059669"/><text x="1021" y="278" class="t" text-anchor="middle" fill="#fff">VERDICT · LAB PROPRE</text>
<text x="42" y="274" class="s">La distribution WSL2 Ubuntu est indépendante de cette fermeture : le cleanup P5 concerne les ressources AWS du lab.</text>
</svg>

