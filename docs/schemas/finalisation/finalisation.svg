<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
<title id="title">Finalisation du projet P5</title>
<desc id="desc">Collecter les preuves réelles, compléter les trois livrables, détruire les ressources AWS puis confirmer que le compte est propre.</desc>
