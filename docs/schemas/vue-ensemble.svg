<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Vue d’ensemble du projet P5</title>
<desc id="desc">Trois exercices officiels réalisés intégralement sur AWS et leurs livrables.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#5f5a73"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.14"/>
  </filter>
</defs>
<rect width="100%" height="100%" rx="24" fill="#f7f7fb"/>
<text x="60" y="65" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#242038">P5 : trois exercices, un seul parcours AWS</text>
<text x="60" y="96" font-family="Arial, sans-serif" font-size="17" fill="#5f5a73">Terraform, Ansible, OpenSearch et HAProxy sont mis en œuvre sur AWS.</text>
<g filter="url(#shadow)"><rect x="55" y="150" width="330" height="340" rx="18" fill="#ffffff" stroke="#7451eb" stroke-width="3"/></g>
<rect x="55" y="150" width="330" height="10" rx="5" fill="#7451eb"/>
<text x="79" y="195" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#242038">1 · AWS + Terraform + Ansible</text>
<text x="79" y="228" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">Infrastructure déclarative</text>
<text x="79" y="253" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">Inventaire et playbook</text>
<text x="79" y="278" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">NGINX + application Angular</text>
<text x="79" y="303" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73"></text>
<text x="79" y="328" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">Livrable : HCL + Ansible</text><g filter="url(#shadow)"><rect x="435" y="150" width="330" height="340" rx="18" fill="#ffffff" stroke="#2d7dd2" stroke-width="3"/></g>
<rect x="435" y="150" width="330" height="10" rx="5" fill="#2d7dd2"/>
<text x="459" y="195" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#242038">2 · Amazon OpenSearch</text>
<text x="459" y="228" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">Logs NGINX</text>
<text x="459" y="253" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">Index et exploration</text>
<text x="459" y="278" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">Trois visualisations</text>
<text x="459" y="303" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73"></text>
<text x="459" y="328" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">Livrable : dashboard</text>
<text x="459" y="353" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">et captures réelles</text><g filter="url(#shadow)"><rect x="815" y="150" width="330" height="340" rx="18" fill="#ffffff" stroke="#2f9e6f" stroke-width="3"/></g>
<rect x="815" y="150" width="330" height="10" rx="5" fill="#2f9e6f"/>
<text x="839" y="195" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#242038">3 · HAProxy sur AWS</text>
<text x="839" y="228" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">Deux backends identiques</text>
<text x="839" y="253" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">Répartition roundrobin</text>
<text x="839" y="278" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">Health checks</text>
<text x="839" y="303" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">Test de panne et reprise</text>
<text x="839" y="328" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73"></text>
<text x="839" y="353" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">Livrable : haproxy.cfg</text><line x1="385" y1="320" x2="435" y2="320" stroke="#5f5a73" stroke-width="3" marker-end="url(#arrow)"/>
<text x="410.0" y="310.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#5f5a73">puis</text><line x1="765" y1="320" x2="815" y2="320" stroke="#5f5a73" stroke-width="3" marker-end="url(#arrow)"/>
<text x="790.0" y="310.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#5f5a73">puis</text><rect x="50" y="585" width="1100" height="42" rx="12" fill="#ebe8fb"/><text x="600" y="612" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7451eb">À chaque étape : comprendre → déployer → vérifier → capturer les preuves → nettoyer</text>
</svg>
