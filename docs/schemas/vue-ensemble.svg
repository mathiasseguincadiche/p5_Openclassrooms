<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">P5 OpenClassrooms — architecture globale des trois exercices</title>
<desc id="desc">Le projet est présenté en trois exercices. L'exercice 1 crée le socle AWS et déploie Angular derrière NGINX. Son access.log alimente l'exercice 2 Amazon OpenSearch. Son VPC et ses deux subnets sont réutilisés par l'exercice 3 HAProxy avec deux backends.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
  <style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.ey{font-size:12px;font-weight:800;letter-spacing:1px;fill:#64748b}.h{font-size:25px;font-weight:760;fill:#0f172a}.t{font-size:18px;font-weight:760;fill:#0f172a}.s{font-size:14px;font-weight:560;fill:#334155}.ar{fill:none;stroke:#475569;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}</style>
</defs>
<rect width="1200" height="520" rx="24" fill="#f8fafc"/>
<text x="42" y="42" class="ey">P5 OPENCLASSROOMS · ARCHITECTURE DU PROJET</text>
<text x="42" y="78" class="h">Trois exercices à présenter, puis trois résultats à démontrer</text>

<rect x="50" y="125" width="330" height="250" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="78" y="160" class="ey">EXERCICE 1 · INFRASTRUCTURE + DÉPLOIEMENT</text>
<text x="78" y="196" class="t">Terraform + Ansible</text>
<text x="78" y="232" class="s">AWS : VPC + 2 subnets publics</text>
<text x="78" y="260" class="s">EC2 p5-web · t3.micro</text>
<text x="78" y="288" class="s">NGINX sert Angular</text>
<rect x="78" y="316" width="274" height="38" rx="12" fill="#fff" stroke="#bfdbfe"/>
<text x="215" y="341" class="s" text-anchor="middle">Résultat : application accessible</text>

<rect x="435" y="125" width="330" height="250" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
<text x="463" y="160" class="ey">EXERCICE 2 · LOGS + OBSERVABILITÉ</text>
<text x="463" y="196" class="t">Amazon OpenSearch</text>
<text x="463" y="232" class="s">access.log → documents structurés</text>
<text x="463" y="260" class="s">OpenSearch 2.19 · 1 nœud</text>
<text x="463" y="288" class="s">3 visualisations demandées</text>
<rect x="463" y="316" width="274" height="38" rx="12" fill="#fff" stroke="#fed7aa"/>
<text x="600" y="341" class="s" text-anchor="middle">Résultat : dashboard lisible</text>

<rect x="820" y="125" width="330" height="250" rx="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="848" y="160" class="ey">EXERCICE 3 · HAUTE DISPONIBILITÉ</text>
<text x="848" y="196" class="t">HAProxy + 2 backends</text>
<text x="848" y="232" class="s">réutilise VPC + 2 subnets Ex. 1</text>
<text x="848" y="260" class="s">round-robin + health checks</text>
<text x="848" y="288" class="s">panne puis réintégration</text>
<rect x="848" y="316" width="274" height="38" rx="12" fill="#fff" stroke="#ddd6fe"/>
<text x="985" y="341" class="s" text-anchor="middle">Résultat : service maintenu</text>

<path d="M380 220H425" class="ar"/>
<text x="402" y="204" class="s" text-anchor="middle">access.log</text>
<path d="M215 375C320 446 835 446 985 375" class="ar"/>
<text x="600" y="438" class="s" text-anchor="middle">VPC + 2 subnets réutilisés</text>

<rect x="50" y="464" width="1100" height="34" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="600" y="486" class="s" text-anchor="middle">Assessment : architecture d'abord → preuve technique ensuite → résultat réel dans le navigateur.</text>
</svg>