<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Vue d’ensemble du projet P5</title>
<desc id="desc">Carte du parcours reliant le poste DevOps local, les trois exercices AWS, les preuves et le nettoyage final.</desc>
<defs>
