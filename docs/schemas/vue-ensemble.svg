  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#059669"/></marker>
  
<style>
  .title{font:700 28px Inter,Arial,sans-serif;fill:#0f172a}
  .subtitle{font:15px Inter,Arial,sans-serif;fill:#475569}
