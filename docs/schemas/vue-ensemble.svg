<text x="42" y="304" class="k">SORTIE ATTENDUE</text><rect x="178" y="284" width="190" height="30" rx="15" fill="#eff6ff" stroke="#93c5fd"/><text x="273" y="304" class="s" text-anchor="middle" fill="#1d4ed8">application accessible</text><rect x="382" y="284" width="178" height="30" rx="15" fill="#fff7ed" stroke="#fdba74"/><text x="471" y="304" class="s" text-anchor="middle" fill="#b45309">dashboard exploitable</text><rect x="574" y="284" width="184" height="30" rx="15" fill="#ecfdf5" stroke="#6ee7b7"/><text x="666" y="304" class="s" text-anchor="middle" fill="#047857">service disponible</text><rect x="772" y="284" width="156" height="30" rx="15" fill="#f5f3ff" stroke="#c4b5fd"/><text x="850" y="304" class="s" text-anchor="middle" fill="#6d28d9">preuves prêtes</text><rect x="942" y="284" width="216" height="30" rx="15" fill="#0f172a"/><text x="1050" y="304" class="s" text-anchor="middle" fill="#fff">LAB PROPRE · 0 coût AWS</text>
