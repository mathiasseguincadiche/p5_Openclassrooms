<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Architecture de référence et dépendances du P5</title>
<desc id="desc">La VM ubuntu-devops porte le plan de contrôle P5. Depuis cette VM, l'exercice 1 crée le socle AWS et Angular avec Ansible. Les logs NGINX alimentent l'exercice 2 OpenSearch et le réseau de l'exercice 1 est réutilisé par l'exercice 3 HAProxy. Les preuves sont finalisées avant la destruction des exercices dans l'ordre 3, 2, 1.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.h{font-size:22px;font-weight:750;fill:#0f172a}.k{font-size:12px;font-weight:800;letter-spacing:1px;fill:#64748b}.t{font-size:16px;font-weight:750;fill:#0f172a}.s{font-size:13px;font-weight:550;fill:#334155}.w{fill:#fff}.ar{fill:none;stroke:#64748b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}</style>
<rect width="1200" height="500" rx="22" fill="#f8fafc"/>
<text x="42" y="45" class="k">P5 OPENCLASSROOMS · ARCHITECTURE DE RÉFÉRENCE · LAB AWS</text>
<text x="42" y="76" class="h">Un plan de contrôle Ubuntu, trois exercices AWS liés, une fermeture maîtrisée.</text>
<rect x="42" y="112" width="250" height="146" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="1.7"/>
<text x="64" y="142" class="k">PLAN DE CONTRÔLE</text><text x="64" y="174" class="t">VM ubuntu-devops</text><text x="64" y="200" class="s">Ubuntu Server 26.04 · CLI</text><text x="64" y="224" class="s">p5.sh · Terraform · Ansible</text><text x="64" y="246" class="s">AWS CLI · Node · Docker</text>
<rect x="326" y="100" width="832" height="276" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="350" y="130" class="k">AWS · RESSOURCES DES EXERCICES</text>
<rect x="350" y="154" width="340" height="118" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="372" y="184" class="k">EXERCICE 1 · SOCLE</text><text x="372" y="214" class="t">Terraform + Ansible + Angular/NGINX</text><text x="372" y="240" class="s">VPC · subnets · EC2 · application · access.log</text>
<rect x="742" y="154" width="386" height="118" rx="16" fill="#fff7ed" stroke="#d97706" stroke-width="1.8"/>
<text x="764" y="184" class="k">EXERCICE 2 · OBSERVABILITÉ</text><text x="764" y="214" class="t">Amazon OpenSearch + Dashboards</text><text x="764" y="240" class="s">logs → index → agrégations → checkpoint humain</text>
<rect x="350" y="300" width="340" height="56" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="372" y="324" class="k">EXERCICE 3 · RÉSILIENCE</text><text x="372" y="346" class="t">HAProxy + 2 backends · panne · reprise</text>
<path d="M292 185H340" class="ar"/><path d="M690 213H732" class="ar"/><path d="M520 272V290" class="ar"/>
<text x="700" y="197" class="s">access.log</text><text x="536" y="287" class="s">VPC / subnets</text>
<rect x="742" y="300" width="386" height="56" rx="16" fill="#0f172a"/>
<text x="764" y="324" class="k" fill="#cbd5e1">FINALISATION</text><text x="764" y="346" class="t w">preuves → livrables → destroy 3 → 2 → 1</text>
<path d="M690 328H732" class="ar"/><path d="M935 272V290" class="ar"/>
<text x="42" y="421" class="k">RESPONSABILITÉS</text>
<text x="42" y="449" class="s">Plateforme HOST/KVM/VM : Ubuntu-desktops-custom · Runtime et exercices : P5 · Infrastructure AWS : Terraform · Configuration serveur : Ansible.</text>
<text x="42" y="476" class="s">Cycle P5 : inspecter → calculer le delta → corriger → vérifier → prouver → nettoyer AWS.</text>
