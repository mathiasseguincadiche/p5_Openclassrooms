<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
<title id="title">Vue d’ensemble du projet P5</title>
<desc id="desc">La workstation Windows 11 et WSL2 déjà qualifiée alimente le P5, qui exécute les trois exercices AWS puis les preuves et le nettoyage.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8.8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.h{font-size:22px;font-weight:750;fill:#0f172a}.k{font-size:12px;font-weight:800;letter-spacing:1.3px;fill:#64748b}.t{font-size:16px;font-weight:750;fill:#0f172a}.b{font-size:14px;font-weight:600;fill:#334155}.s{font-size:12.5px;font-weight:500;fill:#475569}.arrow{fill:none;stroke:#64748b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}</style>
<rect width="1200" height="340" rx="22" fill="#f8fafc"/>
<text x="42" y="48" class="k">DE LA WORKSTATION QUALIFIÉE AU NETTOYAGE AWS</text><text x="42" y="78" class="h">Une plateforme amont, un projet P5, trois exercices AWS.</text>
<rect x="308" y="105" width="650" height="164" rx="20" fill="#fff" stroke="#ddd6fe" stroke-width="1.8"/><text x="332" y="133" class="k" fill="#7c3aed">PÉRIMÈTRE AWS</text>
<rect x="42" y="132" width="220" height="116" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/><circle cx="72" cy="162" r="17" fill="#64748b"/><text x="72" y="167" class="t" text-anchor="middle" fill="#fff">0</text><text x="98" y="161" class="t">PRÉPARER</text><text x="62" y="198" class="s">Workstation amont READY</text><text x="62" y="221" class="s">Ubuntu → contrat P5</text>
<rect x="332" y="151" width="176" height="90" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><circle cx="362" cy="181" r="17" fill="#2563eb"/><text x="362" y="186" class="t" text-anchor="middle" fill="#fff">1</text><text x="388" y="180" class="t">DÉPLOYER</text><text x="352" y="217" class="s">Terraform + Ansible</text><text x="352" y="240" class="s">Angular sur EC2</text>
<rect x="533" y="151" width="176" height="90" rx="16" fill="#fff7ed" stroke="#d97706" stroke-width="1.8"/><circle cx="563" cy="181" r="17" fill="#d97706"/><text x="563" y="186" class="t" text-anchor="middle" fill="#fff">2</text><text x="589" y="180" class="t">OBSERVER</text><text x="553" y="217" class="s">NGINX → OpenSearch</text><text x="553" y="240" class="s">3 visualisations</text>
<rect x="734" y="151" width="176" height="90" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/><circle cx="764" cy="181" r="17" fill="#059669"/><text x="764" y="186" class="t" text-anchor="middle" fill="#fff">3</text><text x="790" y="180" class="t">RÉSISTER</text><text x="754" y="217" class="s">HAProxy + 2 backends</text><text x="754" y="240" class="s">panne et reprise</text>
<rect x="984" y="132" width="174" height="116" rx="16" fill="#0f172a" stroke="#0f172a" stroke-width="1.8"/><circle cx="1014" cy="162" r="17" fill="#059669"/><text x="1014" y="167" class="t" text-anchor="middle" fill="#fff">✓</text><text x="1040" y="161" class="t" fill="#fff">FINALISER</text><text x="1004" y="198" class="s" fill="#cbd5e1">preuves · livrables</text><text x="1004" y="221" class="s" fill="#cbd5e1">destroy + audit</text>
