<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">P5 — Vue simple des trois exercices</title>
<desc id="desc">Vue pédagogique du projet. L'exercice 1 construit l'infrastructure AWS et déploie Angular derrière NGINX. Les logs NGINX alimentent l'exercice 2 OpenSearch. Le réseau AWS de l'exercice 1 est réutilisé par l'exercice 3 HAProxy.</desc>
<defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
  <style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.k{font-size:12px;font-weight:800;letter-spacing:1px;fill:#64748b}.h{font-size:25px;font-weight:760;fill:#0f172a}.t{font-size:19px;font-weight:760;fill:#0f172a}.s{font-size:14px;font-weight:560;fill:#334155}.ar{fill:none;stroke:#475569;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}</style>
</defs>
<rect width="1200" height="500" rx="24" fill="#f8fafc"/>
<text x="42" y="43" class="k">P5 OPENCLASSROOMS · VUE D'ENSEMBLE</text>
<text x="42" y="79" class="h">Trois exercices, une seule histoire</text>

<rect x="55" y="125" width="320" height="235" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="82" y="160" class="k">EXERCICE 1</text>
<text x="82" y="197" class="t">Construire et déployer</text>
<text x="82" y="236" class="s">Terraform crée l'infrastructure AWS</text>
<text x="82" y="266" class="s">Ansible configure le serveur</text>
<text x="82" y="296" class="s">NGINX sert Angular</text>
<rect x="82" y="321" width="266" height="28" rx="14" fill="#fff"/>
<text x="215" y="341" class="s" text-anchor="middle">Résultat : application accessible</text>

<rect x="440" y="125" width="320" height="235" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
<text x="467" y="160" class="k">EXERCICE 2</text>
<text x="467" y="197" class="t">Observer</text>
<text x="467" y="236" class="s">NGINX produit access.log</text>
<text x="467" y="266" class="s">OpenSearch indexe les logs</text>
<text x="467" y="296" class="s">Dashboards affiche les indicateurs</text>
<rect x="467" y="321" width="266" height="28" rx="14" fill="#fff"/>
<text x="600" y="341" class="s" text-anchor="middle">Résultat : observabilité</text>

<rect x="825" y="125" width="320" height="235" rx="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="852" y="160" class="k">EXERCICE 3</text>
<text x="852" y="197" class="t">Répartir et résister</text>
<text x="852" y="236" class="s">HAProxy reçoit les requêtes</text>
<text x="852" y="266" class="s">Deux backends partagent la charge</text>
<text x="852" y="296" class="s">Le service continue pendant une panne</text>
<rect x="852" y="321" width="266" height="28" rx="14" fill="#fff"/>
<text x="985" y="341" class="s" text-anchor="middle">Résultat : continuité de service</text>

<path d="M375 220H430" class="ar"/>
<text x="402" y="205" class="s" text-anchor="middle">logs</text>
<path d="M215 360C315 435 850 435 985 360" class="ar"/>
<text x="600" y="425" class="s" text-anchor="middle">réseau AWS réutilisé</text>

<text x="42" y="472" class="s">À retenir : Ex. 1 livre l'application · Ex. 2 observe son activité · Ex. 3 démontre la répartition de charge et la résilience.</text>
</svg>
