<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
<title id="title">Étape 0 : préparer la VM de lab</title>
<desc id="desc">Installation d’Ubuntu Server, ajout du socle DevOps, configuration des accès puis validation du lab.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
  <style>
    .title{font:700 22px Arial,sans-serif;fill:#0f172a}.card-title{font:700 16px Arial,sans-serif;fill:#0f172a}.label{font:13px Arial,sans-serif;fill:#475569}.ok-title{font:700 16px Arial,sans-serif;fill:#065f46}.ok-label{font:13px Arial,sans-serif;fill:#065f46}.line{fill:none;stroke:#475569;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="960" height="300" rx="12" fill="#f8fafc"/>
<text x="32" y="38" class="title">Étape 0 · construire un poste DevOps reproductible</text>

<g text-anchor="middle">
  <rect x="28" y="72" width="190" height="134" rx="10" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <g transform="translate(103 91)" class="line">
    <rect x="0" y="0" width="40" height="27" rx="3"/>
    <line x1="7" y1="8" x2="33" y2="8"/><line x1="7" y1="14" x2="33" y2="14"/><line x1="7" y1="20" x2="22" y2="20"/>
    <circle cx="32" cy="20" r="2" fill="#64748b" stroke="none"/>
  </g>
  <text x="123" y="139" class="card-title">Ubuntu Server 26.04</text>
  <text x="123" y="164" class="label">CLI · OpenSSH · mises à jour</text>
  <text x="123" y="185" class="label">VM nommée p5-devops</text>

  <rect x="266" y="72" width="190" height="134" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <g transform="translate(341 91)" class="line" stroke="#2563eb">
    <rect x="0" y="0" width="40" height="27" rx="3"/>
    <path d="M8 9l6 5-6 5M18 19h12"/>
  </g>
  <text x="361" y="139" class="card-title">Socle DevOps</text>
  <text x="361" y="164" class="label">Terraform · Ansible · AWS CLI</text>
  <text x="361" y="185" class="label">Docker · Node.js · Git</text>

  <rect x="504" y="72" width="190" height="134" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <g transform="translate(578 91)" class="line" stroke="#7c3aed">
    <circle cx="11" cy="12" r="8"/><line x1="18" y1="18" x2="34" y2="34"/><line x1="27" y1="27" x2="32" y2="22"/><line x1="31" y1="31" x2="36" y2="26"/>
    <path d="M1 31h17M4 31c0-7 4-10 9-10"/>
  </g>
  <text x="599" y="139" class="card-title">Accès du lab</text>
  <text x="599" y="164" class="label">profil AWS · identité vérifiée</text>
  <text x="599" y="185" class="label">clé SSH · dépôt cloné</text>

  <rect x="742" y="72" width="190" height="134" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <g transform="translate(816 91)" class="line" stroke="#059669">
    <rect x="0" y="0" width="40" height="30" rx="4"/>
    <path d="M8 9l4 4 7-8M8 21l4 4 7-8"/><line x1="24" y1="9" x2="33" y2="9"/><line x1="24" y1="21" x2="33" y2="21"/>
  </g>
  <text x="837" y="139" class="ok-title">Lab validé</text>
  <text x="837" y="164" class="ok-label">outils · Docker · AWS · SSH</text>
  <text x="837" y="185" class="ok-label">prêt pour terraform plan</text>
</g>

<g class="line" marker-end="url(#arrow)">
  <line x1="218" y1="139" x2="258" y2="139"/>
  <line x1="456" y1="139" x2="496" y2="139"/>
  <line x1="694" y1="139" x2="734" y2="139"/>
</g>

<rect x="28" y="230" width="904" height="42" rx="8" fill="#e2e8f0"/>
<text x="480" y="257" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#334155">Installer · configurer · contrôler — aucune ressource AWS n’est créée à cette étape</text>
</svg>
