<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
<title id="title">Étape 0 — Inspecter, préparer et valider Ubuntu WSL2 avant Terraform</title>
<desc id="desc">Windows 11 Pro fournit WSL2 et la distribution Ubuntu 26.04. Dans cette distribution, le P5 observe l'état avec inspect, converge ses dépendances et les prérequis AWS avec prepare, revalide avec status puis autorise la lecture du plan Terraform lorsque le verdict GO TERRAFORM est atteint.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8.8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.h{font-size:22px;font-weight:750;fill:#0f172a}.k{font-size:12px;font-weight:800;letter-spacing:1.2px;fill:#64748b}.t{font-size:16px;font-weight:750;fill:#0f172a}.s{font-size:13px;font-weight:550;fill:#475569}.m{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:12px;font-weight:650;fill:#334155}.arrow{fill:none;stroke:#64748b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}</style>
<rect width="1200" height="320" rx="22" fill="#f8fafc"/>
<text x="42" y="46" class="k">ÉTAPE 0 · PRÉPARATION DU PLAN DE CONTRÔLE</text>
<text x="42" y="76" class="h">Qualifier Ubuntu WSL2 avant la première ressource AWS.</text>
<rect x="42" y="100" width="1116" height="44" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="62" y="127" class="s">Plateforme : Windows 11 Pro + WSL2 → Ubuntu 26.04 · systemd · EXT4</text>
<rect x="42" y="172" width="220" height="92" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="1.7"/>
<text x="62" y="199" class="k">1 · OBSERVER</text><text x="62" y="224" class="t">p5.sh inspect</text><text x="62" y="247" class="s">état réel · states · preuves</text>
<rect x="310" y="172" width="260" height="92" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.7"/>
<text x="330" y="199" class="k">2 · CONVERGER</text><text x="330" y="224" class="t">p5.sh prepare</text><text x="330" y="247" class="s">runtime P5 · AWS readiness · tfvars</text>
<rect x="618" y="172" width="220" height="92" rx="16" fill="#fff7ed" stroke="#d97706" stroke-width="1.7"/>
<text x="638" y="199" class="k">3 · REVALIDER</text><text x="638" y="224" class="t">p5.sh status</text><text x="638" y="247" class="s">contrat WSL2 + prérequis AWS</text>
<rect x="886" y="166" width="272" height="104" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="906" y="195" class="k" fill="#047857">VERDICT</text><text x="1022" y="225" class="t" text-anchor="middle" fill="#047857">GO TERRAFORM</text><text x="1022" y="249" class="s" text-anchor="middle" fill="#047857">lire le plan avant toute mutation</text>
<path d="M262 218H300" class="arrow"/><path d="M570 218H608" class="arrow"/><path d="M838 218H876" class="arrow"/>
<text x="42" y="299" class="s">Principe P5 : observer → calculer le delta → corriger uniquement l'écart → vérifier → prouver.</text>
</svg>
