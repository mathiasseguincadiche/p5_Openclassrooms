<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
<title id="title">Étape 0 — Qualifier la VM DevOps puis préparer AWS</title>
<desc id="desc">Ubuntu-desktops-custom fournit le HOST, KVM et la VM ubuntu-devops. Le P5 qualifie Ubuntu Server 26.04, converge uniquement son runtime dans la VM puis prépare les contrôles AWS et Terraform.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8.8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.h{font-size:22px;font-weight:750;fill:#0f172a}.k{font-size:12px;font-weight:800;letter-spacing:1.3px;fill:#64748b}.t{font-size:16px;font-weight:750;fill:#0f172a}.b{font-size:14px;font-weight:600;fill:#334155}.s{font-size:12.5px;font-weight:500;fill:#475569}.m{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:12px;font-weight:650;fill:#334155}.arrow{fill:none;stroke:#64748b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}</style>
<rect width="1200" height="300" rx="22" fill="#f8fafc"/>
<text x="42" y="48" class="k">ÉTAPE 0 · FONDATIONS</text><text x="42" y="78" class="h">Qualifier le guest P5 avant la première ressource AWS.</text>
<rect x="42" y="115" width="210" height="106" rx="15" fill="#f1f5f9" stroke="#64748b" stroke-width="1.7"/><text x="60" y="143" class="k">PLATEFORME AMONT</text><text x="60" y="174" class="b">Ubuntu · KVM/libvirt</text><text x="60" y="198" class="s">possède la VM</text>
<rect x="278" y="115" width="200" height="106" rx="15" fill="#eff6ff" stroke="#2563eb" stroke-width="1.7"/><text x="296" y="143" class="k">VM D'EXÉCUTION</text><text x="296" y="174" class="b">ubuntu-devops</text><text x="296" y="198" class="s">Ubuntu Server 26.04 CLI</text>
<rect x="504" y="115" width="184" height="106" rx="15" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.7"/><text x="522" y="143" class="k">PRÉPARATION P5</text><text x="522" y="174" class="b">check / converge</text><text x="522" y="198" class="s">dépendances P5 seulement</text>
<rect x="714" y="115" width="184" height="106" rx="15" fill="#fff7ed" stroke="#d97706" stroke-width="1.7"/><text x="732" y="143" class="k">AWS READY</text><text x="732" y="174" class="b">profil · /32 · budget</text><text x="732" y="198" class="s">quotas · IAM · tfvars</text>
<path d="M252 168H268" class="arrow"/><path d="M478 168H494" class="arrow"/><path d="M688 168H704" class="arrow"/>
<rect x="924" y="105" width="234" height="126" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="1.8"/><text x="945" y="134" class="k">CONTRÔLE P5</text><text x="945" y="164" class="m">bootstrap --check-only</text><text x="945" y="188" class="m">p5.sh status</text><path d="M898 168H914" class="arrow"/>
<rect x="938" y="244" width="206" height="40" rx="20" fill="#059669"/><text x="1041" y="270" class="t" text-anchor="middle" fill="#fff">GO TERRAFORM</text><path d="M1041 231V238" class="arrow"/>
<text x="42" y="265" class="s">Ubuntu-desktops-custom possède la plateforme ; P5 prépare son runtime dans ubuntu-devops puis le lab AWS.</text>
