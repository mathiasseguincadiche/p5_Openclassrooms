<text x="882.5" y="292.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#5f5a73">compose</text><rect x="50" y="585" width="1100" height="42" rx="12" fill="#ebe8fb"/><text x="600" y="612" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7451eb">Livrable : dashboard complet + une capture lisible de chacune des trois visualisations</text>
