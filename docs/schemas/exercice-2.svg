<rect x="655" y="170" width="430" height="150" rx="17" fill="#fff7ed" stroke="#fdba74"/>
<text x="870" y="202" class="t" text-anchor="middle">p5-opensearch</text>
<text x="870" y="230" class="s" text-anchor="middle">OpenSearch 2.19 · 1 × t3.small.search</text>
<text x="870" y="256" class="s" text-anchor="middle">EBS gp3 · 10 Gio</text>
<text x="870" y="282" class="s" text-anchor="middle">HTTPS · TLS 1.2+ · chiffrement</text>
<text x="870" y="307" class="s" text-anchor="middle">endpoint autorisé uniquement depuis IP admin /32</text>
