<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Exercice 2 : Amazon OpenSearch</title>
<desc id="desc">Import des logs NGINX puis création de trois visualisations et d’un dashboard.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#5f5a73"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.14"/>
  </filter>
</defs>
<rect width="100%" height="100%" rx="24" fill="#f7f7fb"/>
<text x="60" y="65" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#242038">Exercice 2 · Transformer des logs en tableau de bord</text>
<text x="60" y="96" font-family="Arial, sans-serif" font-size="17" fill="#5f5a73">Choix retenu : Amazon OpenSearch et OpenSearch Dashboards sur AWS.</text>
<g filter="url(#shadow)"><rect x="55" y="180" width="220" height="250" rx="18" fill="#ffffff" stroke="#f39c3d" stroke-width="3"/></g>
