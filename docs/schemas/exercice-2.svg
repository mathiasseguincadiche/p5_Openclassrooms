<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Exercice 2 — Du log NGINX au dashboard</title>
<desc id="desc">Schéma pédagogique de l'exercice 2. Le vrai access.log NGINX, complété par un sample reproductible pour les tests, est parsé puis envoyé à Amazon OpenSearch avant d'être visualisé dans OpenSearch Dashboards.</desc>
<defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
  <style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.k{font-size:12px;font-weight:800;letter-spacing:1px;fill:#64748b}.h{font-size:25px;font-weight:760;fill:#0f172a}.t{font-size:18px;font-weight:760;fill:#0f172a}.s{font-size:14px;font-weight:560;fill:#334155}.ar{fill:none;stroke:#475569;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}</style>
</defs>
<rect width="1200" height="500" rx="24" fill="#f8fafc"/>
<text x="42" y="43" class="k">EXERCICE 2 · LOGS ET OBSERVABILITÉ</text>
<text x="42" y="79" class="h">Un log NGINX devient une donnée, puis un graphique</text>

<rect x="55" y="155" width="200" height="120" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="155" y="193" class="t" text-anchor="middle">access.log</text>
<text x="155" y="223" class="s" text-anchor="middle">vraies requêtes</text>
<text x="155" y="248" class="s" text-anchor="middle">du NGINX Ex. 1</text>

<rect x="315" y="155" width="200" height="120" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
<text x="415" y="193" class="t" text-anchor="middle">Parser</text>
<text x="415" y="223" class="s" text-anchor="middle">transforme les lignes</text>
<text x="415" y="248" class="s" text-anchor="middle">en documents typés</text>

<rect x="575" y="155" width="220" height="120" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
<text x="685" y="193" class="t" text-anchor="middle">OpenSearch</text>
<text x="685" y="223" class="s" text-anchor="middle">indexe les documents</text>
<text x="685" y="248" class="s" text-anchor="middle">et calcule les agrégations</text>

<rect x="855" y="135" width="290" height="160" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="1000" y="173" class="t" text-anchor="middle">OpenSearch Dashboards</text>
<text x="1000" y="207" class="s" text-anchor="middle">Méthodes HTTP</text>
<text x="1000" y="233" class="s" text-anchor="middle">Octets envoyés / 12 h</text>
<text x="1000" y="259" class="s" text-anchor="middle">Top 5 URL / 12 h</text>

<path d="M255 215H305" class="ar"/><path d="M515 215H565" class="ar"/><path d="M795 215H845" class="ar"/>
<text x="280" y="200" class="s" text-anchor="middle">lit</text><text x="540" y="200" class="s" text-anchor="middle">envoie</text><text x="820" y="200" class="s" text-anchor="middle">affiche</text>

<rect x="135" y="335" width="930" height="84" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="160" y="364" class="k">POURQUOI DEUX SOURCES ?</text>
<text x="160" y="395" class="s">Log réel = preuve du fonctionnement AWS · sample versionné = tests reproductibles et CI sans dépendre d'une EC2 active.</text>

<text x="42" y="468" class="s">À retenir : NGINX produit → le parser structure → OpenSearch analyse → Dashboards rend les résultats visibles.</text>
</svg>
