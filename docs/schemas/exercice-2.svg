<text x="305.0" y="295.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#5f5a73">importe</text><line x1="555" y1="305" x2="615" y2="205" stroke="#5f5a73" stroke-width="3" marker-end="url(#arrow)"/>
