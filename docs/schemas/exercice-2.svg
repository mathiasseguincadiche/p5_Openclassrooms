<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Exercice 2 — Du log NGINX au dashboard OpenSearch</title>
<desc id="desc">Flux de données de l'exercice 2. Le sample versionné et le vrai access.log NGINX sont transformés en documents NDJSON typés, importés via la Bulk API dans Amazon OpenSearch 2.19, vérifiés par mappings et agrégations, puis présentés dans OpenSearch Dashboards avec trois visualisations.</desc>
<defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
  <style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.ey{font-size:12px;font-weight:800;letter-spacing:1px;fill:#475569}.h{font-size:23px;font-weight:760;fill:#0f172a}.t{font-size:16px;font-weight:760;fill:#0f172a}.s{font-size:13px;font-weight:560;fill:#334155}.ar{fill:none;stroke:#475569;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}</style>
</defs>
<rect width="1200" height="560" rx="24" fill="#f8fafc"/>
<text x="42" y="42" class="ey">EXERCICE 2 · LOGS ET OBSERVABILITÉ</text>
<text x="42" y="76" class="h">Une requête HTTP devient un document structuré, puis un indicateur visuel.</text>

<rect x="42" y="120" width="220" height="92" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="62" y="149" class="ey">SOURCE RÉELLE</text><text x="62" y="178" class="t">access.log NGINX</text><text x="62" y="199" class="s">produit par l'exercice 1</text>
<rect x="42" y="238" width="220" height="72" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="62" y="267" class="ey">SOURCE REPRODUCTIBLE</text><text x="62" y="294" class="t">sample versionné</text>

<rect x="310" y="164" width="210" height="108" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="332" y="194" class="ey">TRANSFORMATION</text><text x="332" y="222" class="t">Parser NGINX</text><text x="332" y="247" class="s">texte → NDJSON typé</text>
<path d="M262 166H288V204H300" class="ar"/><path d="M262 274H288V232H300" class="ar"/>

<rect x="570" y="164" width="190" height="108" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="592" y="194" class="ey">IMPORT</text><text x="592" y="222" class="t">Bulk API</text><text x="592" y="247" class="s">mapping + index nginx-access-*</text>
<path d="M520 218H560" class="ar"/>

<rect x="810" y="132" width="320" height="172" rx="18" fill="#fff" stroke="#c2410c" stroke-width="1.7"/>
<text x="832" y="162" class="ey">AMAZON OPENSEARCH SERVICE</text>
<text x="832" y="193" class="t">OpenSearch 2.19 · 1 × t3.small.search</text>
<text x="832" y="220" class="s">EBS gp3 10 Gio · HTTPS · TLS 1.2+</text>
<text x="832" y="244" class="s">chiffrement au repos + inter-nœuds</text>
<text x="832" y="268" class="s">accès limité à l'IP d'administration /32</text>
<path d="M760 218H800" class="ar"/>

<rect x="140" y="360" width="920" height="132" rx="20" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="166" y="389" class="ey">OPENSEARCH DASHBOARDS · DASHBOARD AS CODE + CONTRÔLE VISUEL</text>
<rect x="176" y="410" width="245" height="58" rx="13" fill="#fff" stroke="#34d399"/>
<text x="298" y="435" class="t" text-anchor="middle">Donut méthodes HTTP</text><text x="298" y="457" class="s" text-anchor="middle">http_method</text>
<rect x="477" y="410" width="245" height="58" rx="13" fill="#fff" stroke="#34d399"/>
<text x="599" y="435" class="t" text-anchor="middle">Octets envoyés / 12 h</text><text x="599" y="457" class="s" text-anchor="middle">Sum(bytes_sent)</text>
<rect x="778" y="410" width="245" height="58" rx="13" fill="#fff" stroke="#34d399"/>
<text x="900" y="435" class="t" text-anchor="middle">Top 5 URL / 12 h</text><text x="900" y="457" class="s" text-anchor="middle">url_path</text>
<path d="M970 304V350" class="ar"/>

<text x="42" y="530" class="s">Lecture : données réelles pour la preuve · sample pour la reproductibilité · API pour l'automatisation · navigateur pour valider le rendu final.</text>
