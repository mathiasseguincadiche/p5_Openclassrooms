<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
<title id="title">Exercice 2 : analyser les logs avec Amazon OpenSearch</title>
<desc id="desc">Les logs NGINX sont importés dans OpenSearch puis utilisés dans trois visualisations.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
<rect width="960" height="280" rx="12" fill="#f8fafc"/>
<text x="32" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">Exercice 2 · des logs au dashboard</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="32" y="88" width="170" height="106" rx="10" fill="#fff" stroke="#d97706" stroke-width="2"/><text x="117" y="126" font-size="16" font-weight="700" fill="#0f172a">Logs NGINX</text><text x="117" y="153" font-size="13" fill="#475569">date · verbe · URL · octets</text>
<rect x="258" y="88" width="190" height="106" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="353" y="126" font-size="16" font-weight="700" fill="#0f172a">Amazon OpenSearch</text><text x="353" y="153" font-size="13" fill="#475569">index · champs · Discover</text>
<rect x="504" y="66" width="190" height="62" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="599" y="93" font-size="14" font-weight="700" fill="#0f172a">Donut</text><text x="599" y="113" font-size="12" fill="#475569">verbes HTTP</text>
<rect x="504" y="148" width="190" height="62" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="599" y="175" font-size="14" font-weight="700" fill="#0f172a">Histogramme</text><text x="599" y="195" font-size="12" fill="#475569">octets par 12 h</text>
<rect x="750" y="88" width="178" height="106" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="839" y="126" font-size="16" font-weight="700" fill="#065f46">Dashboard</text><text x="839" y="153" font-size="13" fill="#065f46">top 5 par 12 h</text><text x="839" y="174" font-size="13" fill="#065f46">+ 4 captures</text>
</g>
<g stroke="#475569" stroke-width="2" marker-end="url(#a)"><line x1="202" y1="141" x2="250" y2="141"/><line x1="448" y1="141" x2="496" y2="99"/><line x1="448" y1="141" x2="496" y2="179"/><line x1="694" y1="99" x2="742" y2="125"/><line x1="694" y1="179" x2="742" y2="157"/></g>
<text x="32" y="246" font-family="Arial,sans-serif" font-size="14" fill="#475569">Les visualisations sont construites manuellement pour comprendre les champs et agrégations.</text>
</svg>
