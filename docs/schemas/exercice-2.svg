<text x="157" y="326" class="t" text-anchor="middle">sample versionné</text>

<rect x="335" y="185" width="220" height="118" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="1.7"/>
<text x="445" y="217" class="t" text-anchor="middle">Pipeline d'import P5</text>
<text x="445" y="247" class="s" text-anchor="middle">parsing + typage</text>
