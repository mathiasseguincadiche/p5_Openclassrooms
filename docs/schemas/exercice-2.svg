<text x="639" y="213" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">Verbes HTTP</text><g filter="url(#shadow)"><rect x="615" y="305" width="250" height="140" rx="18" fill="#ffffff" stroke="#7451eb" stroke-width="3"/></g>
<rect x="615" y="305" width="250" height="10" rx="5" fill="#7451eb"/>
