<text x="79" y="225" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#242038">Logs NGINX</text>
<text x="79" y="258" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">nginx-access.log</text>
<text x="79" y="283" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">horodatage</text>
