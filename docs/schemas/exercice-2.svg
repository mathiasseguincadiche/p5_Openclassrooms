<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Exercice 2 — architecture de logging avec Amazon OpenSearch</title>
<desc id="desc">Le vrai access.log de NGINX et le sample reproductible sont transformés en documents structurés puis envoyés via la Bulk API vers Amazon OpenSearch Service. Le domaine managé p5-opensearch utilise OpenSearch 2.19, un nœud t3.small.search et EBS gp3 10 Gio. Il n'est pas placé dans le VPC de l'exercice 1. OpenSearch Dashboards affiche les trois visualisations demandées.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
  <style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.ey{font-size:12px;font-weight:800;letter-spacing:1px;fill:#64748b}.h{font-size:24px;font-weight:760;fill:#0f172a}.t{font-size:17px;font-weight:760;fill:#0f172a}.s{font-size:13px;font-weight:560;fill:#334155}.ar{fill:none;stroke:#475569;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}</style>
</defs>
<rect width="1200" height="600" rx="24" fill="#f8fafc"/>
