<rect x="335" y="180" width="220" height="10" rx="5" fill="#2d7dd2"/>
<text x="359" y="225" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#242038">OpenSearch</text>
<text x="359" y="258" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">nginx-access</text>
<text x="359" y="283" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">mapping des champs</text>
<text x="359" y="308" font-family="Arial, sans-serif" font-size="16" fill="#5f5a73">Discover</text><g filter="url(#shadow)"><rect x="615" y="135" width="250" height="140" rx="18" fill="#ffffff" stroke="#7451eb" stroke-width="3"/></g>
<rect x="615" y="135" width="250" height="10" rx="5" fill="#7451eb"/>
