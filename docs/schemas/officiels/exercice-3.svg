<svg xmlns="http://www.w3.org/2000/svg" width="348" height="359" viewBox="0 0 348 359" role="img" aria-labelledby="title desc"><title id="title">Exercice 3 — Répartir et résister</title><desc id="desc">HAProxy répartit la charge entre deux backends et maintient le service pendant la panne contrôlée d’un backend.</desc><defs><marker id="arrow-black" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111827"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e97817"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111827;text-rendering:geometricPrecision}</style></defs><rect x="2" y="2" width="344" height="355" rx="7" fill="#fff" stroke="#10365f" stroke-width="1.1"/><circle cx="28" cy="21" r="10" fill="#e97817"/><text x="28" y="25" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#fff">3</text><text x="47" y="25" style="font-size:11.8px;font-weight:800;fill:#e97817">EXERCICE 3 — RÉPARTIR ET RÉSISTER</text><rect x="43" y="38" width="120" height="37" rx="4" fill="#fbfdff" stroke="#5c8eb8"/><circle cx="61" cy="49.6" r="3.6" fill="#1e5aa8"/><path d="M54.6 61.6c0-5.4 3.2-8 6.4-8 4 0 6.4 3 6.4 8z" fill="#1e5aa8"/><text x="81" y="53" style="font-size:6.8px;font-weight:800">Utilisateur</text><text x="81" y="62" style="font-size:5.25px"><tspan x="81">Envoie des requêtes</tspan><tspan x="81" dy="6.19">HTTP/HTTPS</tspan></text><path d="M103 75v14" fill="none" stroke="#111" marker-end="url(#arrow-black)"/><rect x="43" y="91" width="120" height="39" rx="4" fill="#fbfdff" stroke="#5c8eb8"/><path d="M55 103l5.6 5.4 5.4-6.8M60.6 108.4l-6 4.8M60.6 108.4l6 5.2" fill="none" stroke="#0b78b6"/><g fill="#0b78b6"><circle cx="55" cy="103" r="2"/><circle cx="66" cy="101.6" r="2"/><circle cx="60.6" cy="108.4" r="2"/><circle cx="54.6" cy="113.2" r="2"/><circle cx="66.6" cy="113.6" r="2"/></g><text x="81" y="107" style="font-size:6.8px;font-weight:800">HAProxy</text><text x="81" y="116" style="font-size:5.2px"><tspan x="81">Répartiteur de charge</tspan><tspan x="81" dy="6.14">et de haute disponibilité</tspan></text><path d="M103 130v8L57 157" fill="none" stroke="#e97817" marker-end="url(#arrow-orange)"/><path d="M103 138l48 19" fill="none" stroke="#e97817" marker-end="url(#arrow-orange)"/><rect x="8" y="156" width="71" height="48" rx="4" fill="#fff" stroke="#7690a9"/><g fill="#eef2f7" stroke="#4b5563"><rect x="15" y="165" width="14.04" height="3.96" rx="1"/><rect x="15" y="170.04" width="14.04" height="3.96" rx="1"/><rect x="15" y="175.08" width="14.04" height="3.96" rx="1"/></g><text x="40" y="172" style="font-size:6.2px;font-weight:800">hello-1</text><text x="40" y="182" style="font-size:5.2px"><tspan x="40">Backend</tspan><tspan x="40" dy="6.14">application</tspan></text><rect x="119" y="156" width="71" height="48" rx="4" fill="#fff" stroke="#7690a9"/><g fill="#eef2f7" stroke="#4b5563"><rect x="126" y="165" width="14.04" height="3.96" rx="1"/><rect x="126" y="170.04" width="14.04" height="3.96" rx="1"/><rect x="126" y="175.08" width="14.04" height="3.96" rx="1"/></g><text x="151" y="172" style="font-size:6.2px;font-weight:800">hello-2</text><text x="151" y="182" style="font-size:5.2px"><tspan x="151">Backend</tspan><tspan x="151" dy="6.14">application</tspan></text><rect x="203" y="38" width="120" height="170" rx="5" fill="#fffaf6" stroke="#f0a357"/><text x="263" y="52" text-anchor="middle" style="font-size:7.1px;font-weight:800;fill:#e97817">CONFIGURATION HAPROXY</text><circle cx="219.5" cy="71.5" r="5.95" fill="none" stroke="#111"/><path d="M214.06 71.5h9.35l-2.04-2.04M224.94 71.5h-9.35l2.04 2.04" fill="none" stroke="#111"/><text x="235" y="68" style="font-size:5.95px;font-weight:800">roundrobin</text><text x="235" y="77" style="font-size:5px"><tspan x="235">Alterne les requêtes</tspan><tspan x="235" dy="5.5">entre les backends</tspan></text><circle cx="219.5" cy="104.5" r="6.46" fill="none" stroke="#27743f"/><path d="M215.76 104.84l2.55 2.55 4.93-5.78" fill="none" stroke="#27743f"/><text x="235" y="101" style="font-size:5.95px;font-weight:800">health check GET /</text><text x="235" y="110" style="font-size:5px"><tspan x="235">Vérifie la disponibilité</tspan><tspan x="235" dy="5.5">des serveurs</tspan></text><path d="M220.5 130.04v11.9M220.5 130.04l-3.06 3.4M220.5 130.04l3.06 3.4" fill="none" stroke="#333"/><text x="235" y="134" style="font-size:5.95px;font-weight:800">fall 3</text><text x="235" y="143" style="font-size:5px"><tspan x="235">Retire un serveur</tspan><tspan x="235" dy="5.5">après 3 échecs</tspan><tspan x="235" dy="5.5">consécutifs</tspan></text><path d="M220.5 167.04v11.9M220.5 167.04l-3.06 3.4M220.5 167.04l3.06 3.4" fill="none" stroke="#333"/><text x="235" y="171" style="font-size:5.95px;font-weight:800">rise 2</text><text x="235" y="180" style="font-size:5px"><tspan x="235">Réintègre un serveur</tspan><tspan x="235" dy="5.5">après 2 succès</tspan><tspan x="235" dy="5.5">consécutifs</tspan></text><rect x="8" y="218" width="316" height="121" rx="5" fill="#fff9f4" stroke="#f0a357"/><text x="166" y="232" text-anchor="middle" style="font-size:7.8px;font-weight:800;fill:#e97817">TEST DE PANNE : 2 → 1 → 2</text><rect x="12" y="241" width="96" height="88" rx="4" fill="#fff" stroke="#f1b675"/><text x="60" y="254" text-anchor="middle" style="font-size:5.6px;font-weight:800;fill:#2d7d4a">AVANT (2 backends)</text><circle cx="43" cy="275" r="9.46" fill="#2d7d4a"/><path d="M37.94 275.22l3.52 3.52 6.82-7.48" fill="none" stroke="#fff" stroke-width="1.54"/><circle cx="75" cy="275" r="9.46" fill="#2d7d4a"/><path d="M69.94 275.22l3.52 3.52 6.82-7.48" fill="none" stroke="#fff" stroke-width="1.54"/><text x="60" y="303" text-anchor="middle" style="font-size:5.1px"><tspan x="60">Les 2 backends</tspan><tspan x="60" dy="5.61">répondent et reçoivent</tspan><tspan x="60" dy="5.61">du trafic</tspan></text><rect x="116" y="241" width="96" height="88" rx="4" fill="#fff" stroke="#f1b675"/><text x="164" y="254" text-anchor="middle" style="font-size:5.6px;font-weight:800;fill:#b83527">PENDANT (1 backend)</text><circle cx="145" cy="275" r="9.46" fill="#2d7d4a"/><path d="M139.94 275.22l3.52 3.52 6.82-7.48" fill="none" stroke="#fff" stroke-width="1.54"/><circle cx="181" cy="275" r="9.46" fill="#d52424"/><path d="M177.48 271.48l7.04 7.04M184.52 271.48l-7.04 7.04" stroke="#fff" stroke-width="1.54"/><text x="164" y="303" text-anchor="middle" style="font-size:5.1px"><tspan x="164">Un backend est retiré</tspan><tspan x="164" dy="5.61">Le service continue</tspan><tspan x="164" dy="5.61">sur le backend sain</tspan></text><rect x="220" y="241" width="100" height="88" rx="4" fill="#fff" stroke="#f1b675"/><text x="270" y="254" text-anchor="middle" style="font-size:5.6px;font-weight:800;fill:#2d7d4a">APRÈS (2 backends)</text><circle cx="249" cy="275" r="9.46" fill="#2d7d4a"/><path d="M243.94 275.22l3.52 3.52 6.82-7.48" fill="none" stroke="#fff" stroke-width="1.54"/><circle cx="285" cy="275" r="9.46" fill="#2d7d4a"/><path d="M279.94 275.22l3.52 3.52 6.82-7.48" fill="none" stroke="#fff" stroke-width="1.54"/><text x="270" y="303" text-anchor="middle" style="font-size:5.1px"><tspan x="270">Le backend restauré</tspan><tspan x="270" dy="5.61">revient dans la rotation</tspan><tspan x="270" dy="5.61">Le service est complet</tspan></text><path d="M109 282h5M213 282h5" fill="none" stroke="#111" marker-end="url(#arrow-black)"/></svg>