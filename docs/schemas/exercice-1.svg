<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Exercice 1 — De Terraform à Angular</title>
<desc id="desc">Schéma pédagogique de l'exercice 1. Terraform crée l'infrastructure AWS, Ansible configure l'EC2, NGINX sert Angular et produit le log utilisé ensuite par l'exercice 2.</desc>
<defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
  <style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.k{font-size:12px;font-weight:800;letter-spacing:1px;fill:#64748b}.h{font-size:25px;font-weight:760;fill:#0f172a}.t{font-size:18px;font-weight:760;fill:#0f172a}.s{font-size:14px;font-weight:560;fill:#334155}.ar{fill:none;stroke:#475569;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}</style>
</defs>
<rect width="1200" height="500" rx="24" fill="#f8fafc"/>
<text x="42" y="43" class="k">EXERCICE 1 · INFRASTRUCTURE ET DÉPLOIEMENT</text>
<text x="42" y="79" class="h">Terraform crée → Ansible configure → NGINX sert Angular</text>

<rect x="55" y="145" width="185" height="120" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="147" y="184" class="t" text-anchor="middle">Terraform</text>
<text x="147" y="214" class="s" text-anchor="middle">décrit et crée</text>
<text x="147" y="239" class="s" text-anchor="middle">l'infrastructure</text>

<rect x="285" y="145" width="215" height="120" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="392" y="184" class="t" text-anchor="middle">AWS</text>
<text x="392" y="214" class="s" text-anchor="middle">VPC + EC2 t3.micro</text>
<text x="392" y="239" class="s" text-anchor="middle">Ubuntu 24.04</text>

<rect x="545" y="145" width="185" height="120" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
<text x="637" y="184" class="t" text-anchor="middle">Ansible</text>
<text x="637" y="214" class="s" text-anchor="middle">configure l'EC2</text>
<text x="637" y="239" class="s" text-anchor="middle">et déploie</text>

<rect x="775" y="145" width="185" height="120" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="867" y="184" class="t" text-anchor="middle">NGINX</text>
<text x="867" y="214" class="s" text-anchor="middle">sert l'application</text>
<text x="867" y="239" class="s" text-anchor="middle">et écrit access.log</text>

<rect x="1005" y="145" width="140" height="120" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="1075" y="184" class="t" text-anchor="middle">Angular</text>
<text x="1075" y="214" class="s" text-anchor="middle">application</text>
<text x="1075" y="239" class="s" text-anchor="middle">visible</text>

<path d="M240 205H275" class="ar"/><path d="M500 205H535" class="ar"/><path d="M730 205H765" class="ar"/><path d="M960 205H995" class="ar"/>
<text x="257" y="190" class="s" text-anchor="middle">crée</text><text x="517" y="190" class="s" text-anchor="middle">cible</text><text x="747" y="190" class="s" text-anchor="middle">installe</text><text x="977" y="190" class="s" text-anchor="middle">sert</text>

<rect x="110" y="320" width="980" height="92" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="135" y="350" class="k">DÉTAILS À CONNAÎTRE — SANS SURCHARGER LE SCHÉMA</text>
<text x="135" y="382" class="s">VPC 10.0.0.0/16 · 2 subnets publics · HTTP 80 public · SSH 22 limité à l'IP /32 · disque gp3 chiffré · IMDSv2</text>

<path d="M867 265V310" class="ar"/>
<text x="884" y="294" class="s">access.log → Exercice 2</text>
<text x="42" y="468" class="s">À retenir : Terraform gère l'infrastructure ; Ansible gère la configuration ; NGINX expose l'application Angular.</text>
</svg>
