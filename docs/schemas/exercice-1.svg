<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
<title id="title">Exercice 1 — Angular, Terraform, Ansible et NGINX</title>
<desc id="desc">Chaîne de livraison du build Angular jusqu’à sa validation sur une instance EC2 configurée par Ansible.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.8" refY="5" orient="auto">
    <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
  </marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8.8" refY="5" orient="auto">
    <path d="M0 0L10 5L0 10Z" fill="#059669"/>
  </marker>
</defs>

<style>
  text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .h{font-size:22px;font-weight:750;fill:#0f172a}
  .k{font-size:12px;font-weight:800;letter-spacing:1.3px;fill:#64748b}
  .t{font-size:16px;font-weight:750;fill:#0f172a}
  .b{font-size:14px;font-weight:600;fill:#334155}
  .s{font-size:12.5px;font-weight:500;fill:#475569}
  .m{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:12px;font-weight:650;fill:#334155}
  .arrow{fill:none;stroke:#64748b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
  .flow{fill:none;stroke:#94a3b8;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
  .chip{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}
</style>
<rect width="1200" height="350" rx="22" fill="#f8fafc"/>
<text x="42" y="48" class="k" text-anchor="start">EXERCICE 1 · DÉPLOIEMENT</text>
<text x="42" y="78" class="h" text-anchor="start">Construire, provisionner, configurer, vérifier.</text>
<rect x="42" y="110" width="1116" height="88" rx="15" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/><rect x="42" y="212" width="1116" height="88" rx="15" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/><text x="62" y="137" class="k" text-anchor="start" fill="#1d4ed8">LOCAL</text>
<text x="62" y="239" class="k" text-anchor="start" fill="#6d28d9">AWS</text>
<rect x="130" y="128" width="170" height="52" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.7"/><text x="215.0" y="151" class="t" text-anchor="middle">Sources Angular</text>
<text x="215.0" y="171" class="s" text-anchor="middle">package-lock + code</text>
<rect x="360" y="128" width="206" height="52" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.7"/><text x="463.0" y="151" class="t" text-anchor="middle">Build reproductible</text>
<text x="463.0" y="171" class="s" text-anchor="middle">npm ci · npm run build</text>
<rect x="626" y="230" width="184" height="52" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.7"/><text x="718.0" y="253" class="t" text-anchor="middle">Terraform</text>
<text x="718.0" y="273" class="s" text-anchor="middle">VPC · SG · EC2 · IP</text>
<rect x="870" y="230" width="218" height="52" rx="12" fill="#fff" stroke="#d97706" stroke-width="1.7"/><text x="979.0" y="253" class="t" text-anchor="middle">Ansible</text>
<text x="979.0" y="273" class="s" text-anchor="middle">NGINX · copie · idempotence</text>
<path d="M300 154H350" class="arrow"/><path d="M566 154H598V256H616" class="arrow"/><path d="M810 256H860" class="arrow"/><rect x="904" y="116" width="206" height="64" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/><text x="1007" y="142" class="t" text-anchor="middle" fill="#047857">APPLICATION ACCESSIBLE</text>
<text x="1007" y="165" class="s" text-anchor="middle" fill="#047857">HTTP :80 · bundle · SPA</text>
<path d="M979 230V190" class="arrow"/><text x="42" y="329" class="k" text-anchor="start">PREUVES</text>
<rect x="150" y="310" width="108" height="30" rx="15" fill="#fff" stroke="#cbd5e1"/><text x="204.0" y="330" class="s" text-anchor="middle" fill="#334155">HTTP 200</text>
<rect x="270" y="310" width="150" height="30" rx="15" fill="#fff" stroke="#cbd5e1"/><text x="345.0" y="330" class="s" text-anchor="middle" fill="#334155">bundle JavaScript</text>
<rect x="434" y="310" width="126" height="30" rx="15" fill="#fff" stroke="#cbd5e1"/><text x="497.0" y="330" class="s" text-anchor="middle" fill="#334155">fallback SPA</text>
<rect x="574" y="310" width="158" height="30" rx="15" fill="#fff" stroke="#cbd5e1"/><text x="653.0" y="330" class="s" text-anchor="middle" fill="#334155">Ansible idempotent</text>
<rect x="746" y="310" width="178" height="30" rx="15" fill="#fff" stroke="#cbd5e1"/><text x="835.0" y="330" class="s" text-anchor="middle" fill="#334155">logs NGINX collectés</text>
</svg>
