<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
<title id="title">Exercice 1 — Deux flux convergent vers Ansible puis NGINX et Angular</title>
<desc id="desc">Dans la distribution Ubuntu WSL2, les sources Angular sont construites en artefact tandis que Terraform provisionne séparément le VPC, le Security Group et l'instance EC2. L'artefact applicatif et les outputs Terraform convergent ensuite vers Ansible, qui configure NGINX et déploie Angular sur l'EC2. Les preuves finales montrent l'absence de delta Terraform, l'idempotence Ansible, l'accès HTTP et la collecte du log NGINX pour l'exercice 2.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8.8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8.8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#059669"/></marker></defs>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.h{font-size:22px;font-weight:750;fill:#0f172a}.k{font-size:12px;font-weight:800;letter-spacing:1.2px;fill:#64748b}.t{font-size:16px;font-weight:750;fill:#0f172a}.b{font-size:14px;font-weight:650;fill:#334155}.s{font-size:12.5px;font-weight:550;fill:#475569}.arrow{fill:none;stroke:#64748b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.green{fill:none;stroke:#059669;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}</style>
