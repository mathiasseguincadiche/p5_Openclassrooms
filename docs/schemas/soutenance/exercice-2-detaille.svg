  <rect x="55" y="135" width="250" height="105" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="170" text-anchor="middle" class="h">Log réel Exercice 1</text><text x="180" y="198" text-anchor="middle" class="x">/var/log/nginx/access.log</text>
  <rect x="55" y="285" width="250" height="95" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
