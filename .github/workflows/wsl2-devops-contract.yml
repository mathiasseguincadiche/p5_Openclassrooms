name: WSL2 DevOps integration contract

on:
  push:
    paths:
      - '.github/workflows/wsl2-devops-contract.yml'
      - 'README.md'
      - 'environment/**'
      - 'docs/**'
      - 'scripts/commands/bootstrap-wsl2.sh'
      - 'scripts/commands/inspect-state.sh'
      - 'scripts/commands/setup.sh'
      - 'scripts/lib/p5-platform.sh'
      - 'scripts/tests/test-wsl2-platform.sh'
  pull_request:
    paths:
      - '.github/workflows/wsl2-devops-contract.yml'
      - 'README.md'
      - 'environment/**'
      - 'docs/**'
      - 'scripts/commands/bootstrap-wsl2.sh'
      - 'scripts/commands/inspect-state.sh'
      - 'scripts/commands/setup.sh'
      - 'scripts/lib/p5-platform.sh'
      - 'scripts/tests/test-wsl2-platform.sh'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  boundary:
    name: P5 / Windows 11 WSL2 ownership boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate WSL2 ownership contract
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source environment/versions.env

          canonical_docs=(
            README.md
            environment/README.md
            environment/wsl2/README.md
            docs/README.md
            docs/00-preparation-environnement.md
            docs/01-parcours-debutant.md
            docs/RUNBOOK_EXECUTION_GUIDEE.md
            docs/architecture-et-flux.md
            docs/convergence-et-reexecution.md
            docs/troubleshooting.md
          )
          for path in "${canonical_docs[@]}"; do test -s "$path"; done

          grep -Fq "$P5_PLATFORM_REPOSITORY" README.md
          grep -Fq "$P5_PLATFORM_REPOSITORY" environment/wsl2/README.md
          test -n "$P5_EXPECTED_WSL_DISTRO"
          test -n "$P5_UBUNTU_VERSION_ID"
          test -n "$P5_UBUNTU_CODENAME"
          test -n "$P5_ALLOWED_WORK_ROOTS"
          test -n "$P5_FORBIDDEN_MOUNT_PREFIXES"
          test -n "$P5_EXPECTED_HOME_FILESYSTEM"
          test -n "$NVM_COMMIT"
          test ! -e environment/vm-devops

          if grep -RniE '(^|[[:space:]`])/(mnt/c|mnt/e)(/|[[:space:]`]|$)' \
            scripts/commands scripts/lib | grep -v 'p5-platform.sh'; then
            echo 'KO chemin de travail Windows détecté dans les scripts P5.' >&2
            exit 1
          fi

      - name: Validate WSL2 detector and bootstrap
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/lib/p5-platform.sh
          bash -n scripts/commands/bootstrap-wsl2.sh
          bash scripts/tests/test-wsl2-platform.sh
          grep -Fq 'microsoft-standard-WSL2' scripts/tests/test-wsl2-platform.sh
          grep -Fq 'vm.max_map_count' scripts/commands/bootstrap-wsl2.sh
          grep -Fq 'Windows_11_Pro_Custom possède WSL2, Docker, Terraform et AWS CLI' \
            scripts/commands/bootstrap-wsl2.sh
          grep -Fq 'fetch --depth 1 origin "$NVM_COMMIT"' scripts/commands/bootstrap-wsl2.sh
          if grep -Fq 'install.sh" | bash' scripts/commands/bootstrap-wsl2.sh; then
            echo 'KO installation NVM distante exécutée directement.' >&2
            exit 1
          fi

  upstream-platform:
    name: Windows_11_Pro_Custom / Ubuntu WSL2 contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Windows platform repository read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mathiasseguincadiche/Windows_11_Pro_Custom
          path: upstream-platform

      - name: Validate upstream WSL identity and tool compatibility
        shell: bash
        run: |
          set -euo pipefail
          contract='upstream-platform/config/wsl/runtime-contract.json'
          test -s "$contract"

          # shellcheck source=/dev/null
          source environment/versions.env

          working_roots_json="$({
            for root in $P5_ALLOWED_WORK_ROOTS; do
              printf '~/%s\n' "$root"
            done
          } | jq -R . | jq -s .)"
          forbidden_roots_json="$(printf '%s\n' $P5_FORBIDDEN_MOUNT_PREFIXES | jq -R . | jq -s .)"

          jq -e \
            --arg distribution "$P5_EXPECTED_WSL_DISTRO" \
            --arg source_distribution "$P5_WSL_SOURCE_DISTRIBUTION" \
            --arg version_id "$P5_UBUNTU_VERSION_ID" \
            --arg codename "$P5_UBUNTU_CODENAME" \
            --arg install_location "$P5_WINDOWS_WSL_INSTALL_LOCATION" \
            --arg filesystem "$P5_EXPECTED_HOME_FILESYSTEM" \
            --argjson working_roots "$working_roots_json" \
            --argjson forbidden_roots "$forbidden_roots_json" \
            '(.distribution == $distribution) and
             (.sourceDistribution == $source_distribution) and
             (.expectedVersionId == $version_id) and
             (.expectedCodename == $codename) and
             (.installLocation == $install_location) and
             (.homeFilesystem == $filesystem) and
             (.workingRoots == $working_roots) and
             (.forbiddenRoots == $forbidden_roots)' \
            "$contract" >/dev/null

          grep -Fq 'systemd=true' upstream-platform/config/wsl/wsl.conf
          grep -Fq 'networkingMode=mirrored' upstream-platform/config/wsl/standard.wslconfig

          p5_terraform_version="$TERRAFORM_VERSION"
          p5_aws_cli_min_version="$AWS_CLI_MIN_VERSION"
          # shellcheck source=/dev/null
          source upstream-platform/config/devops/tool-versions.env
          test "$TERRAFORM_VERSION" = "$p5_terraform_version"
          test "$(printf '%s\n%s\n' "$p5_aws_cli_min_version" "$AWS_CLI_VERSION" \
            | sort -V | head -n 1)" = "$p5_aws_cli_min_version"

  ubuntu-2604-runtime:
    name: Ubuntu 26.04 / P5 dependencies
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Resolute packages and Docker repository
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source environment/versions.env
          # shellcheck source=/dev/null
          source /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = "$P5_UBUNTU_VERSION_ID"
          test "$VERSION_CODENAME" = "$P5_UBUNTU_CODENAME"

          apt-get update
          xargs -r apt-get install -y --no-install-recommends < <(grep -vE '^($|#)' environment/apt-packages.txt)
          test ! -e /usr/sbin/qemu-ga

          install -m 0755 -d /etc/apt/keyrings
          curl --retry 5 --retry-all-errors -fsSL https://download.docker.com/linux/ubuntu/gpg \
            -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          cat >/etc/apt/sources.list.d/docker.sources <<EOF
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: ${P5_UBUNTU_CODENAME}
          Components: stable
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/docker.asc
          EOF
          apt-get update
          apt-cache policy docker-ce-cli | grep -F 'Candidate:' | grep -v '(none)'
          apt-get install -y --no-install-recommends docker-ce-cli docker-buildx-plugin docker-compose-plugin
          docker --version
          docker buildx version
          docker compose version

      - name: Validate pinned P5 portable tools
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source environment/versions.env
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          archive="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          base="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
          curl --retry 5 --retry-all-errors -fsSL "$base/$archive" -o "$tmpdir/$archive"
          curl --retry 5 --retry-all-errors -fsSL "$base/terraform_${TERRAFORM_VERSION}_SHA256SUMS" -o "$tmpdir/SHA256SUMS"
          (cd "$tmpdir"; grep " ${archive}$" SHA256SUMS | sha256sum -c -; unzip -qo "$archive")
          "$tmpdir/terraform" version -json | jq -e --arg expected "$TERRAFORM_VERSION" '.terraform_version == $expected' >/dev/null

          mkdir -p "$tmpdir/nvm"
          git -C "$tmpdir/nvm" init -q
          git -C "$tmpdir/nvm" remote add origin https://github.com/nvm-sh/nvm.git
          git -C "$tmpdir/nvm" fetch --depth 1 origin "$NVM_COMMIT"
          git -C "$tmpdir/nvm" checkout --detach --force FETCH_HEAD >/dev/null
          test "$(git -C "$tmpdir/nvm" rev-parse HEAD)" = "$NVM_COMMIT"
          test -s "$tmpdir/nvm/nvm.sh"

          curl --retry 5 --retry-all-errors -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o "$tmpdir/aws.zip"
          unzip -q "$tmpdir/aws.zip" -d "$tmpdir/aws-cli"
          "$tmpdir/aws-cli/aws/install" --install-dir "$tmpdir/aws-install" --bin-dir "$tmpdir/aws-bin"
          "$tmpdir/aws-bin/aws" --version
