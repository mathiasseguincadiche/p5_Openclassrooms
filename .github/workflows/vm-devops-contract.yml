name: VM DevOps integration contract

on:
  push:
    paths:
      - '.github/workflows/vm-devops-contract.yml'
      - 'README.md'
      - 'environment/**'
      - 'docs/README.md'
      - 'docs/00-preparation-environnement.md'
      - 'docs/01-parcours-debutant.md'
      - 'docs/RUNBOOK_EXECUTION_GUIDEE.md'
      - 'docs/architecture-et-flux.md'
      - 'docs/convergence-et-reexecution.md'
      - 'docs/troubleshooting.md'
      - 'docs/schemas/etape-0.svg'
      - 'docs/schemas/vue-ensemble.svg'
      - 'scripts/commands/bootstrap-ubuntu-server.sh'
      - 'scripts/commands/setup.sh'
      - 'scripts/commands/inspect-state.sh'
  pull_request:
    paths:
      - '.github/workflows/vm-devops-contract.yml'
      - 'README.md'
      - 'environment/**'
      - 'docs/README.md'
      - 'docs/00-preparation-environnement.md'
      - 'docs/01-parcours-debutant.md'
      - 'docs/RUNBOOK_EXECUTION_GUIDEE.md'
      - 'docs/architecture-et-flux.md'
      - 'docs/convergence-et-reexecution.md'
      - 'docs/troubleshooting.md'
      - 'docs/schemas/etape-0.svg'
      - 'docs/schemas/vue-ensemble.svg'
      - 'scripts/commands/bootstrap-ubuntu-server.sh'
      - 'scripts/commands/setup.sh'
      - 'scripts/commands/inspect-state.sh'

permissions:
  contents: read

jobs:
  boundary:
    name: P5 / Ubuntu VM ownership boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P5
        uses: actions/checkout@v7

      - name: Validate P5 ownership contract
        shell: bash
        run: |
          set -euo pipefail

          canonical_docs=(
            README.md
            environment/README.md
            environment/vm-devops/README.md
            docs/README.md
            docs/00-preparation-environnement.md
            docs/01-parcours-debutant.md
            docs/RUNBOOK_EXECUTION_GUIDEE.md
            docs/architecture-et-flux.md
            docs/convergence-et-reexecution.md
            docs/troubleshooting.md
          )

          for path in "${canonical_docs[@]}"; do
            test -s "$path" || {
              echo "KO document canonique absent ou vide: $path"
              exit 1
            }
          done

          grep -Fq 'mathiasseguincadiche/Ubuntu-desktops-custom' README.md
          grep -Fq 'mathiasseguincadiche/Ubuntu-desktops-custom' environment/README.md
          grep -Fq 'mathiasseguincadiche/Ubuntu-desktops-custom' environment/vm-devops/README.md
          grep -Fq 'ubuntu-devops' environment/vm-devops/README.md
          grep -Fq 'Ubuntu Server 26.04' environment/vm-devops/README.md

          test ! -e environment/wsl2
          test ! -e scripts/windows

          if grep -R -nE '\b(virsh|virt-install|qemu-img|libvirt)\b' scripts/commands scripts/lib 2>/dev/null; then
            echo 'KO responsabilité KVM/libvirt dupliquée dans le runtime P5.'
            exit 1
          fi

          if grep -R -nE 'Windows_11_Pro_Custom|wsl -d Ubuntu|/mnt/c|/mnt/d|runtime WSL2|Ubuntu WSL2' "${canonical_docs[@]}"; then
            echo 'KO anciennes instructions Windows/WSL2 détectées.'
            exit 1
          fi

          grep -Fq 'P5_EXPECTED_VM_NAME=ubuntu-devops' environment/versions.env
          grep -Fq 'P5_EXECUTION_MODEL=ubuntu-server-kvm-vm' environment/versions.env
          grep -Fq 'P5_PLATFORM_REPOSITORY=mathiasseguincadiche/Ubuntu-desktops-custom' environment/versions.env
          echo 'Frontière Ubuntu-desktops-custom / P5: OK'

      - name: Validate guest-only bootstrap contract
        shell: bash
        run: |
          set -euo pipefail
          bootstrap='scripts/commands/bootstrap-ubuntu-server.sh'
          bash -n "$bootstrap"
          grep -Fq 'systemd-detect-virt' "$bootstrap"
          grep -Fq 'kvm|qemu' "$bootstrap"
          grep -Fq 'Runtime WSL détecté' "$bootstrap"
          grep -Fq 'P5_EXPECTED_VM_NAME' "$bootstrap"
          grep -Fq 'P5_UBUNTU_VERSION_ID=26.04' environment/versions.env
          grep -Fq 'P5_UBUNTU_CODENAME=resolute' environment/versions.env
          echo 'Contrat guest Ubuntu Server P5: OK'

  upstream-platform:
    name: Ubuntu-desktops-custom / ubuntu-devops contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform repository read-only
        uses: actions/checkout@v7
        with:
          repository: mathiasseguincadiche/Ubuntu-desktops-custom
          path: upstream-platform

      - name: Validate upstream VM identity only
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'VM_DEVOPS_NAME=ubuntu-devops' upstream-platform/config/devops-vm.conf
          grep -Fq 'VM_DEVOPS_OS=ubuntu-server-26.04-lts' upstream-platform/config/devops-vm.conf
          grep -Fq 'VM_DEVOPS_NETWORK=devops-nat' upstream-platform/config/devops-vm.conf
          grep -Fq 'hostname: ubuntu-devops' upstream-platform/virtualization/cloud-init/user-data.tpl
          grep -Fq 'devops_tooling_on_host: forbidden' upstream-platform/manifests/devops-vm/tools.yml
          echo 'Contrat amont ubuntu-devops disponible: OK'

  ubuntu-2604-p5-runtime:
    name: Ubuntu 26.04 / P5 runtime compatibility
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Resolute and install P5 baseline
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source environment/versions.env
          # shellcheck disable=SC1091
          source /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = "$P5_UBUNTU_VERSION_ID"
          test "$VERSION_CODENAME" = "$P5_UBUNTU_CODENAME"
          apt-get update
          apt-get install -y --no-install-recommends \
            sudo bash-completion build-essential ca-certificates curl git gnupg jq make \
            openssh-client pipx python3 python3-pip python3-venv shellcheck tree unzip \
            vim wget yamllint zip
          python3 --version
          shellcheck --version
          yamllint --version

      - name: Validate Docker repository on Resolute
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source environment/versions.env
          install -m 0755 -d /etc/apt/keyrings
          curl --retry 5 --retry-all-errors -fsSL https://download.docker.com/linux/ubuntu/gpg \
            -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          cat >/etc/apt/sources.list.d/docker.sources <<EOF
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: ${P5_UBUNTU_CODENAME}
          Components: stable
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/docker.asc
          EOF
          apt-get update
          apt-cache policy docker-ce-cli | grep -F 'Candidate:' | grep -v '(none)'
          apt-get install -y --no-install-recommends docker-ce-cli docker-buildx-plugin docker-compose-plugin
          docker --version
          docker buildx version
          docker compose version

      - name: Validate Terraform and AWS CLI requirements
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source environment/versions.env
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          terraform_archive="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          terraform_base="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
          curl --retry 5 --retry-all-errors -fsSL "$terraform_base/$terraform_archive" -o "$tmpdir/$terraform_archive"
          curl --retry 5 --retry-all-errors -fsSL "$terraform_base/terraform_${TERRAFORM_VERSION}_SHA256SUMS" -o "$tmpdir/SHA256SUMS"
          (
            cd "$tmpdir"
            grep " ${terraform_archive}$" SHA256SUMS | sha256sum -c -
            unzip -qo "$terraform_archive"
          )
          "$tmpdir/terraform" version -json \
            | jq -e --arg expected "$TERRAFORM_VERSION" '.terraform_version == $expected' >/dev/null

          curl --retry 5 --retry-all-errors -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o "$tmpdir/aws.zip"
          unzip -q "$tmpdir/aws.zip" -d "$tmpdir/aws-cli"
          "$tmpdir/aws-cli/aws/install" --install-dir "$tmpdir/aws-install" --bin-dir "$tmpdir/aws-bin"
          aws_version="$($tmpdir/aws-bin/aws --version 2>&1 | sed -n 's/^aws-cli\/\([0-9][0-9.]*\).*/\1/p')"
          test -n "$aws_version"
          if [[ "$(printf '%s\n%s\n' "$AWS_CLI_MIN_VERSION" "$aws_version" | sort -V | head -n1)" != "$AWS_CLI_MIN_VERSION" ]]; then
            echo "AWS CLI trop ancienne: $aws_version < $AWS_CLI_MIN_VERSION" >&2
            exit 1
          fi
          "$tmpdir/aws-bin/aws" --version

      - name: Validate Ansible, NVM and Node requirements as P5 user
        shell: bash
        run: |
          set -euo pipefail
          useradd --create-home --shell /bin/bash p5-ci
          echo 'p5-ci ALL=(ALL) NOPASSWD:ALL' >/etc/sudoers.d/p5-ci
          chmod 0440 /etc/sudoers.d/p5-ci
          chown -R p5-ci:p5-ci "$GITHUB_WORKSPACE"
          sudo -u p5-ci -H bash -lc "
            set -euo pipefail
            cd '$GITHUB_WORKSPACE'
            source environment/versions.env
            export PATH=\"\$HOME/.local/bin:\$PATH\"
            pipx install --force \"ansible-core==\$ANSIBLE_CORE_VERSION\"
            ansible_version=\"\$(ansible-playbook --version | sed -n '1s/.*core \\([^]]*\\).*/\\1/p')\"
            test \"\$ansible_version\" = \"\$ANSIBLE_CORE_VERSION\"

            export NVM_DIR=\"\$HOME/.nvm\"
            curl --retry 5 --retry-all-errors -fsSL \
              \"https://raw.githubusercontent.com/nvm-sh/nvm/\$NVM_VERSION/install.sh\" | bash
            source \"\$NVM_DIR/nvm.sh\"
            test \"\$(nvm --version)\" = \"\${NVM_VERSION#v}\"
            nvm install \"\$NODE_VERSION\"
            nvm use \"\$NODE_VERSION\"
            test \"\$(node --version)\" = \"v\$NODE_VERSION\"
            npm --version
            npm install --global markdownlint-cli2
            markdownlint-cli2 --version
          "
