name: WSL2 contract

on:
  push:
    paths:
      - '.github/workflows/wsl2-contract.yml'
      - '.gitignore'
      - 'environment/wsl2/**'
      - 'environment/README.md'
      - 'docs/00-preparation-environnement.md'
      - 'docs/architecture-et-flux.md'
      - 'scripts/windows/**'
  pull_request:
    paths:
      - '.github/workflows/wsl2-contract.yml'
      - '.gitignore'
      - 'environment/wsl2/**'
      - 'environment/README.md'
      - 'docs/00-preparation-environnement.md'
      - 'docs/architecture-et-flux.md'
      - 'scripts/windows/**'

permissions:
  contents: read

jobs:
  contract:
    name: Windows 11 / WSL2 contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate WSL2 static contract
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            environment/wsl2/.wslconfig.example
            environment/wsl2/wsl.conf.example
            environment/wsl2/README.md
            scripts/windows/lib-wsl2-p5.ps1
            scripts/windows/install-wsl2-p5.ps1
            scripts/windows/configure-wsl2-p5.ps1
            scripts/windows/check-wsl2-p5.ps1
            scripts/windows/start-p5.ps1
            scripts/windows/stop-p5.ps1
            scripts/windows/status-p5.ps1
            scripts/windows/backup-p5.ps1
            scripts/windows/restore-p5.ps1
          )

          for path in "${required_files[@]}"; do
            test -s "$path" || { echo "KO fichier absent ou vide: $path"; exit 1; }
          done

          config=environment/wsl2/.wslconfig.example
          grep -Fxq 'memory=16GB' "$config"
          grep -Fxq 'processors=6' "$config"
          grep -Fxq 'swap=8GB' "$config"
          grep -Fxq 'networkingMode=nat' "$config"
          grep -Fxq 'localhostForwarding=true' "$config"
          grep -Fxq 'dnsTunneling=true' "$config"
          grep -Fxq 'firewall=true' "$config"
          grep -Fxq 'autoProxy=true' "$config"

          grep -Fq 'systemd=true' environment/wsl2/wsl.conf.example
          grep -Fq 'hostname=p5-devops' environment/wsl2/wsl.conf.example
          grep -Fq 'Windows 11 Pro' docs/00-preparation-environnement.md
          grep -Fq '6 processeurs' docs/00-preparation-environnement.md
          grep -Fq '16 Go' docs/00-preparation-environnement.md
          grep -Fq 'Windows 11 Pro' docs/architecture-et-flux.md
          grep -Fq 'WSL2' environment/README.md

          if grep -nE 'Fedora 44|virt-manager|virsh list|qemu-kvm|libvirt' \
            environment/README.md \
            docs/00-preparation-environnement.md \
            docs/architecture-et-flux.md; then
            echo 'KO anciennes instructions hyperviseur detectees dans le parcours canonique.'
            exit 1
          fi

          grep -Fxq '*.vhdx' .gitignore
          grep -Fxq '*.vhdx.sha256' .gitignore

          echo 'Contrat WSL2 statique: OK'

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              Write-Host "KO syntaxe PowerShell: $($_.Name)"
              $errors | ForEach-Object { Write-Host "  $($_.Message)" }
              $failed = $true
            } else {
              Write-Host "OK $($_.Name)"
            }
          }

          if ($failed) { exit 1 }
