name: Workstation integration contract

on:
  push:
    paths:
      - '.github/workflows/wsl2-contract.yml'
      - 'README.md'
      - 'environment/**'
      - 'docs/README.md'
      - 'docs/00-preparation-environnement.md'
      - 'docs/01-parcours-debutant.md'
      - 'docs/RUNBOOK_EXECUTION_GUIDEE.md'
      - 'docs/architecture-et-flux.md'
      - 'docs/convergence-et-reexecution.md'
      - 'docs/troubleshooting.md'
      - 'docs/schemas/etape-0.svg'
      - 'docs/schemas/vue-ensemble.svg'
      - 'scripts/windows/**'
      - 'scripts/commands/bootstrap-ubuntu-server.sh'
  pull_request:
    paths:
      - '.github/workflows/wsl2-contract.yml'
      - 'README.md'
      - 'environment/**'
      - 'docs/README.md'
      - 'docs/00-preparation-environnement.md'
      - 'docs/01-parcours-debutant.md'
      - 'docs/RUNBOOK_EXECUTION_GUIDEE.md'
      - 'docs/architecture-et-flux.md'
      - 'docs/convergence-et-reexecution.md'
      - 'docs/troubleshooting.md'
      - 'docs/schemas/etape-0.svg'
      - 'docs/schemas/vue-ensemble.svg'
      - 'scripts/windows/**'
      - 'scripts/commands/bootstrap-ubuntu-server.sh'

permissions:
  contents: read

jobs:
  contract:
    name: Windows 11 / upstream WSL2 contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate workstation ownership contract
        shell: bash
        run: |
          set -euo pipefail

          canonical_docs=(
            README.md
            environment/README.md
            environment/wsl2/README.md
            docs/README.md
            docs/00-preparation-environnement.md
            docs/01-parcours-debutant.md
            docs/RUNBOOK_EXECUTION_GUIDEE.md
            docs/architecture-et-flux.md
            docs/convergence-et-reexecution.md
            docs/troubleshooting.md
          )

          for path in "${canonical_docs[@]}"; do
            test -s "$path" || {
              echo "KO document canonique absent ou vide: $path"
              exit 1
            }
          done

          grep -Fq 'mathiasseguincadiche/Windows_11_Pro_Custom' README.md
          grep -Fq 'mathiasseguincadiche/Windows_11_Pro_Custom' environment/README.md
          grep -Fq 'mathiasseguincadiche/Windows_11_Pro_Custom' environment/wsl2/README.md
          grep -Fq 'mathiasseguincadiche/Windows_11_Pro_Custom' docs/00-preparation-environnement.md

          grep -Fq 'wsl -d Ubuntu' README.md
          grep -Fq 'wsl -d Ubuntu' docs/00-preparation-environnement.md
          grep -Fq 'wsl -d Ubuntu' docs/01-parcours-debutant.md
          grep -Fq 'wsl -d Ubuntu' docs/RUNBOOK_EXECUTION_GUIDEE.md

          grep -Fq 'Ubuntu 26.04' environment/wsl2/README.md
          grep -Fq '20 Go' environment/wsl2/README.md
          grep -Fq 'mirrored' environment/wsl2/README.md
          grep -Fq 'lab-heavy' environment/wsl2/README.md
          grep -Fq 'nat-fallback' environment/wsl2/README.md
          grep -Fq '~/labs/p5_Openclassrooms' environment/wsl2/README.md
          grep -Fq '/mnt/c' environment/wsl2/README.md
          grep -Fq '/mnt/d' environment/wsl2/README.md

          forbidden_files=(
            environment/wsl2/.wslconfig.example
            environment/wsl2/wsl.conf.example
            scripts/windows/lib-wsl2-p5.ps1
            scripts/windows/install-wsl2-p5.ps1
            scripts/windows/configure-wsl2-p5.ps1
            scripts/windows/check-wsl2-p5.ps1
            scripts/windows/start-p5.ps1
            scripts/windows/stop-p5.ps1
            scripts/windows/status-p5.ps1
            scripts/windows/backup-p5.ps1
            scripts/windows/restore-p5.ps1
          )

          for path in "${forbidden_files[@]}"; do
            if test -e "$path"; then
              echo "KO responsabilité WSL2 dupliquée dans P5: $path"
              exit 1
            fi
          done

          if grep -nE \
            'p5-devops|install-wsl2-p5\.ps1|configure-wsl2-p5\.ps1|check-wsl2-p5\.ps1|backup-p5\.ps1|restore-p5\.ps1|start-p5\.ps1|stop-p5\.ps1|status-p5\.ps1' \
            "${canonical_docs[@]}"; then
            echo 'KO anciennes instructions WSL2 P5 détectées.'
            exit 1
          fi

          if grep -nE 'Fedora 44|virt-manager|virsh list|qemu-kvm|libvirt|VM Ubuntu Server' \
            "${canonical_docs[@]}"; then
            echo 'KO anciennes instructions hyperviseur détectées.'
            exit 1
          fi

          grep -Fq 'mirrored' README.md
          grep -Fq 'nat-fallback' README.md

          echo 'Contrat workstation amont / P5: OK'

      - name: Validate Linux checkout boundary
        shell: bash
        run: |
          set -euo pipefail
          bootstrap='scripts/commands/bootstrap-ubuntu-server.sh'
          bash -n "$bootstrap"
          grep -Fq '/mnt/c' "$bootstrap"
          grep -Fq '/mnt/d' "$bootstrap"
          grep -Fq 'findmnt -T "$PROJECT_ROOT" -n -o FSTYPE' "$bootstrap"
          grep -Fq 'ext4' "$bootstrap"
          grep -Fq 'P5_UBUNTU_VERSION_ID=26.04' environment/versions.env
          grep -Fq 'P5_UBUNTU_CODENAME=resolute' environment/versions.env
          echo 'Frontière checkout Linux P5: OK'
