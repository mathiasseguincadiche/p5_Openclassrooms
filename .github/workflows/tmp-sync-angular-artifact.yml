name: TEMP - Synchroniser artefact Angular

on:
  push:
    branches:
      - fix/final-readiness-hardening
    paths:
      - '.github/workflows/tmp-sync-angular-artifact.yml'
      - 'application/angular/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-sync-angular-artifact.yml'
      - 'application/angular/**'
      - 'scripts/lib/p5-runtime.sh'

permissions:
  contents: write

concurrency:
  group: temp-angular-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/final-readiness-hardening
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: application/angular/package-lock.json
      - name: Appliquer le dernier durcissement de redaction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/lib/p5-runtime.sh")
          lines = path.read_text(encoding="utf-8").splitlines()
          marker = "(AKIA|ASIA)[0-9A-Z]{16}"
          if not any(marker in line for line in lines):
              for index, line in enumerate(lines):
                  if "AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN|OPENROUTER_API_KEY" in line:
                      lines.insert(
                          index + 1,
                          "        -e 's/(AKIA|ASIA)[0-9A-Z]{16}/<REDACTED>/g' \\",
                      )
                      break
              else:
                  raise SystemExit("ancre p5_redact_stream introuvable")
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Construire et synchroniser
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --prefix application/angular --no-audit --no-fund
          npm ci --prefix application/angular --no-audit --no-fund
          npm run lint --prefix application/angular
          npm test --prefix application/angular
          npm run build --prefix application/angular
          mapfile -t indexes < <(find application/angular/dist -type f -name index.html | sort)
          test "${#indexes[@]}" -eq 1
          build_dir="$(dirname "${indexes[0]}")"
          rm -rf ansible/files/angular-app
          mkdir -p ansible/files/angular-app
          cp -a "$build_dir/." ansible/files/angular-app/
          git add scripts/lib/p5-runtime.sh application/angular/package-lock.json ansible/files/angular-app
          if git diff --cached --quiet; then
            echo 'Runtime, lockfile et artefact déjà synchronisés.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: synchroniser les artefacts de la version finale'
          git push origin HEAD:fix/final-readiness-hardening
