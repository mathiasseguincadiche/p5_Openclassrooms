      - name: Vérifier les chemins et la syntaxe Bash
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          find . -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          if grep -RInE \
            'RAPPORT_VALIDATION\.md|TEST_PRE_DEPLOIEMENT\.sh|setup-and-run\.sh|scripts/AUTOMATION_README\.md|scripts/(cleanup-all|clean|deploy|validate|phase-[0-5]|utils/|generer-haproxy-config)|ansible/files/angular-app|nginx-angular\.conf' \
            . --exclude-dir=.git; then
            echo 'Des références vers les anciens chemins subsistent.' >&2
            exit 1
          fi

      - name: Vérifier ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 | \
            xargs -0 -r shellcheck --severity=error --external-sources --source-path=SCRIPTDIR

      - name: Vérifier Terraform
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          for module in \
            terraform/exercice-1 \
            terraform/exercice-2 \
            terraform/exercice-3 \
            TEMPLATES/terraform; do
            terraform -chdir="$module" init -backend=false -input=false -no-color
            terraform -chdir="$module" validate -no-color
          done

      - name: Vérifier YAML et Ansible
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check yamllint==1.37.1 'ansible-core>=2.18,<2.20'
          yamllint --config-file .yamllint.yml .
          ansible-playbook --syntax-check \
            --inventory ansible/inventories/hosts_aws.example \
            ansible/playbooks/deploy.yml

      - name: Vérifier Markdown
        shell: bash
        run: npx --yes markdownlint-cli2@0.18.1 '**/*.md'

