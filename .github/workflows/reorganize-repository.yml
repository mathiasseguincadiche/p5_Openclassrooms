name: Réorganiser le dépôt

on:
  push:
    branches:
      - chore/reorganiser-arborescence-20260804

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Réorganiser les fichiers et corriger les chemins
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            docs/reports \
            scripts/commands \
            scripts/phases \
            scripts/tools \
            scripts/lib

          git mv RAPPORT_VALIDATION.md docs/reports/validation.md
          git mv TEST_PRE_DEPLOIEMENT.sh scripts/commands/pre-deployment-check.sh
          git mv setup-and-run.sh scripts/commands/setup.sh

          git mv scripts/deploy.sh scripts/commands/deploy.sh
          git mv scripts/validate.sh scripts/commands/validate.sh
          git mv scripts/clean.sh scripts/commands/clean-local.sh
          git mv scripts/cleanup-all.sh scripts/commands/destroy-aws.sh

          for phase in scripts/phase-*.sh; do
            git mv "$phase" scripts/phases/
          done

          git mv scripts/generer-haproxy-config.sh scripts/tools/generer-haproxy-config.sh
          git mv scripts/utils/capture-screenshots.sh scripts/tools/capture-screenshots.sh
          git mv scripts/utils/health-checks.sh scripts/tools/health-checks.sh
          git mv scripts/utils/kibana-api.sh scripts/tools/kibana-api.sh

          git mv scripts/utils/checks.sh scripts/lib/checks.sh
          git mv scripts/utils/colors.sh scripts/lib/colors.sh
          git mv scripts/utils/logging.sh scripts/lib/logging.sh
          git mv scripts/utils/prompts.sh scripts/lib/prompts.sh
          rmdir scripts/utils

          git mv scripts/AUTOMATION_README.md scripts/README.md

          git mv ansible/files/angular-app ansible/files/web-app
          git mv ansible/files/nginx-angular.conf ansible/files/nginx-web-app.conf
          git rm ansible/inventory

          python3 <<'PY'
          from pathlib import Path
          import re

          text_suffixes = {
              ".md", ".sh", ".yml", ".yaml", ".tf", ".conf", ".ini",
              ".html", ".jsonc", ".example", ".txt", ".hcl"
          }
          text_names = {".gitignore", ".yamllint.yml"}

          replacements = {
              "./TEST_PRE_DEPLOIEMENT.sh": "./scripts/commands/pre-deployment-check.sh",
              "TEST_PRE_DEPLOIEMENT.sh": "scripts/commands/pre-deployment-check.sh",
              "./setup-and-run.sh": "./scripts/commands/setup.sh",
              "setup-and-run.sh": "scripts/commands/setup.sh",
              "RAPPORT_VALIDATION.md": "docs/reports/validation.md",
              "scripts/AUTOMATION_README.md": "scripts/README.md",
              "./scripts/cleanup-all.sh": "./scripts/commands/destroy-aws.sh",
              "scripts/cleanup-all.sh": "scripts/commands/destroy-aws.sh",
              "./scripts/clean.sh": "./scripts/commands/clean-local.sh",
              "scripts/clean.sh": "scripts/commands/clean-local.sh",
              "./scripts/deploy.sh": "./scripts/commands/deploy.sh",
              "scripts/deploy.sh": "scripts/commands/deploy.sh",
              "./scripts/validate.sh": "./scripts/commands/validate.sh",
              "scripts/validate.sh": "scripts/commands/validate.sh",
              "./scripts/phase-": "./scripts/phases/phase-",
              "scripts/phase-": "scripts/phases/phase-",
              "./scripts/utils/capture-screenshots.sh": "./scripts/tools/capture-screenshots.sh",
              "scripts/utils/capture-screenshots.sh": "scripts/tools/capture-screenshots.sh",
              "./scripts/utils/health-checks.sh": "./scripts/tools/health-checks.sh",
              "scripts/utils/health-checks.sh": "scripts/tools/health-checks.sh",
              "./scripts/utils/kibana-api.sh": "./scripts/tools/kibana-api.sh",
              "scripts/utils/kibana-api.sh": "scripts/tools/kibana-api.sh",
              "./scripts/utils/checks.sh": "./scripts/lib/checks.sh",
              "scripts/utils/checks.sh": "scripts/lib/checks.sh",
              "./scripts/utils/colors.sh": "./scripts/lib/colors.sh",
              "scripts/utils/colors.sh": "scripts/lib/colors.sh",
              "./scripts/utils/logging.sh": "./scripts/lib/logging.sh",
              "scripts/utils/logging.sh": "scripts/lib/logging.sh",
              "./scripts/utils/prompts.sh": "./scripts/lib/prompts.sh",
              "scripts/utils/prompts.sh": "scripts/lib/prompts.sh",
              "./scripts/generer-haproxy-config.sh": "./scripts/tools/generer-haproxy-config.sh",
              "scripts/generer-haproxy-config.sh": "scripts/tools/generer-haproxy-config.sh",
              "ansible/files/angular-app": "ansible/files/web-app",
              "ansible/files/nginx-angular.conf": "ansible/files/nginx-web-app.conf",
              "nginx-angular.conf": "nginx-web-app.conf",
              "ansible/inventory": "ansible/inventories/hosts_aws.example",
          }
          pattern = re.compile("|".join(re.escape(key) for key in sorted(replacements, key=len, reverse=True)))

          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.suffix not in text_suffixes and path.name not in text_names:
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = pattern.sub(lambda match: replacements[match.group(0)], content)
              if updated != content:
                  path.write_text(updated, encoding="utf-8")

          def replace(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              content = path.read_text(encoding="utf-8")
              if old not in content:
                  return
              path.write_text(content.replace(old, new), encoding="utf-8")

          for filename in ("scripts/run-all.sh", "scripts/runbook.sh"):
              replace(filename, '/utils/colors.sh', '/lib/colors.sh')
              replace(filename, '/utils/checks.sh', '/lib/checks.sh')
              replace(filename, '/utils/prompts.sh', '/lib/prompts.sh')
              replace(filename, '/utils/logging.sh', '/lib/logging.sh')

          replace("scripts/runbook.sh", '$(dirname "$0")/$script', '$(dirname "$0")/phases/$script')

          replace("scripts/run-all.sh", '$SCRIPTS_DIR/$script', '$SCRIPTS_DIR/phases/$script')
          replace("scripts/run-all.sh", '$SCRIPTS_DIR/$phase_script', '$SCRIPTS_DIR/phases/$phase_script')
          replace("scripts/run-all.sh", '$SCRIPTS_DIR/utils/health-checks.sh', '$SCRIPTS_DIR/tools/health-checks.sh')

          run_all = Path("scripts/run-all.sh")
          content = run_all.read_text(encoding="utf-8")
          old_block = ''' # Vérifier les utilitaires
 for util in "colors.sh" "prompts.sh" "checks.sh" "logging.sh" "kibana-api.sh" "capture-screenshots.sh" "health-checks.sh"; do
 if [ -f "$SCRIPTS_DIR/utils/$util" ]; then
 check "Utilitaire $util existe"
 log_info "Utilitaire $util existe"
 else
 error "Utilitaire $util introuvable"
 log_error "Utilitaire $util introuvable"
 all_ok=false
 fi
 done'''
          new_block = ''' # Vérifier les bibliothèques partagées
 for util in "colors.sh" "prompts.sh" "checks.sh" "logging.sh"; do
 if [ -f "$SCRIPTS_DIR/lib/$util" ]; then
 check "Bibliothèque $util existe"
 log_info "Bibliothèque $util existe"
 else
 error "Bibliothèque $util introuvable"
 log_error "Bibliothèque $util introuvable"
 all_ok=false
 fi
 done

 # Vérifier les outils autonomes
 for util in "kibana-api.sh" "capture-screenshots.sh" "health-checks.sh" "generer-haproxy-config.sh"; do
 if [ -f "$SCRIPTS_DIR/tools/$util" ]; then
 check "Outil $util existe"
 log_info "Outil $util existe"
 else
 error "Outil $util introuvable"
 log_error "Outil $util introuvable"
 all_ok=false
 fi
 done'''
          if old_block not in content:
              raise SystemExit("Bloc de contrôle des utilitaires introuvable dans scripts/run-all.sh")
          run_all.write_text(content.replace(old_block, new_block), encoding="utf-8")

          for path in Path("scripts/phases").glob("*.sh"):
              content = path.read_text(encoding="utf-8")
              content = content.replace('$(dirname "$0")/utils/', '$(dirname "$0")/../lib/')
              content = content.replace('$(dirname "${BASH_SOURCE[0]}")/utils/', '$(dirname "${BASH_SOURCE[0]}")/../lib/')
              content = content.replace('$SCRIPT_DIR/utils/kibana-api.sh', '$SCRIPT_DIR/../tools/kibana-api.sh')
              content = content.replace('$SCRIPT_DIR/utils/capture-screenshots.sh', '$SCRIPT_DIR/../tools/capture-screenshots.sh')
              content = content.replace('$SCRIPTS_DIR/utils/kibana-api.sh', '$SCRIPTS_DIR/tools/kibana-api.sh')
              content = content.replace('$SCRIPTS_DIR/utils/capture-screenshots.sh', '$SCRIPTS_DIR/tools/capture-screenshots.sh')
              content = content.replace('$SCRIPT_DIR/generer-haproxy-config.sh', '$SCRIPT_DIR/../tools/generer-haproxy-config.sh')
              content = content.replace('./runbook.sh', './scripts/runbook.sh')
              path.write_text(content, encoding="utf-8")

          for path in Path("scripts/tools").glob("*.sh"):
              content = path.read_text(encoding="utf-8")
              for library in ("colors.sh", "checks.sh", "prompts.sh", "logging.sh"):
                  content = content.replace(f'$(dirname "$0")/{library}', f'$(dirname "$0")/../lib/{library}')
                  content = content.replace(f'$(dirname "${{BASH_SOURCE[0]}}")/{library}', f'$(dirname "${{BASH_SOURCE[0]}}")/../lib/{library}')
              path.write_text(content, encoding="utf-8")
          PY

          cat > scripts/commands/setup.sh <<'EOF'
          #!/usr/bin/env bash
          # Assistant d'entrée du projet P5.

          set -euo pipefail

          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          PROJECT_ROOT="$(cd -- "$SCRIPT_DIR/../.." && pwd)"
          cd "$PROJECT_ROOT"

          show_help() {
              cat <<'HELP'
          Usage: ./scripts/commands/setup.sh [--check-only] [--auto]

            --check-only  Vérifie l'environnement et le dépôt sans déployer.
            --auto        Transmet le mode automatique à la phase de préparation.
            --help        Affiche cette aide.

          Ce script ne crée aucune ressource AWS. Le déploiement reste une action
          explicite depuis le runbook afin que le coût et le plan soient relus.
          HELP
          }

          phase_args=()
          check_only=false

          while [[ $# -gt 0 ]]; do
              case "$1" in
                  --check-only)
                      check_only=true
                      phase_args+=(--check-only)
                      ;;
                  --auto)
                      phase_args+=(--auto)
                      ;;
                  --help|-h)
                      show_help
                      exit 0
                      ;;
                  *)
                      printf 'Option inconnue : %s\n' "$1" >&2
                      show_help >&2
                      exit 1
                      ;;
              esac
              shift
          done

          if [ "$(id -u)" -eq 0 ]; then
              printf 'Exécutez ce script avec un utilisateur normal ; sudo sera demandé au besoin.\n' >&2
              exit 1
          fi

          ./scripts/phases/phase-0-preparation.sh "${phase_args[@]}"
          ./scripts/commands/validate.sh

          if [ "$check_only" = true ]; then
              printf '\n✅ Environnement et dépôt vérifiés.\n'
              exit 0
          fi

          printf '\n✅ Préparation terminée. Ouverture du runbook interactif.\n'
          exec ./scripts/runbook.sh
          EOF

          cat > scripts/commands/pre-deployment-check.sh <<'EOF'
          #!/usr/bin/env bash
          # Contrôle non destructif à exécuter avant un déploiement AWS.

          set -euo pipefail

          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          PROJECT_ROOT="$(cd -- "$SCRIPT_DIR/../.." && pwd)"
          cd "$PROJECT_ROOT"

          printf '==========================================\n'
          printf '  TEST PRÉ-DÉPLOIEMENT - P5\n'
          printf '==========================================\n\n'

          required_files=(
              terraform/exercice-1/main.tf
              terraform/exercice-2/main.tf
              terraform/exercice-3/main.tf
              ansible/playbooks/deploy.yml
              scripts/commands/validate.sh
              scripts/runbook.sh
              scripts/phases/phase-5-nettoyage.sh
          )

          for required_file in "${required_files[@]}"; do
              if [ ! -f "$required_file" ]; then
                  printf '❌ Fichier requis absent : %s\n' "$required_file" >&2
                  exit 1
              fi
          done

          if [ ! -f "$HOME/.ssh/p5-key" ] || [ ! -f "$HOME/.ssh/p5-key.pub" ]; then
              printf '❌ La paire de clés ~/.ssh/p5-key est absente.\n' >&2
              printf '   Créez-la avec : ssh-keygen -t ed25519 -f ~/.ssh/p5-key\n' >&2
              exit 1
          fi

          if [ "$(stat -c %a "$HOME/.ssh/p5-key")" != "600" ]; then
              printf '❌ La clé privée doit avoir le mode 600.\n' >&2
              exit 1
          fi

          ./scripts/phases/phase-0-preparation.sh --check-only
          ./scripts/commands/validate.sh

          if ! aws sts get-caller-identity >/dev/null 2>&1; then
              printf '❌ AWS CLI ne peut pas vérifier l’identité active.\n' >&2
              exit 1
          fi

          for module in exercice-1 exercice-2 exercice-3; do
              if [ ! -f "terraform/$module/terraform.tfvars" ]; then
                  printf '⚠️  terraform/%s/terraform.tfvars reste à créer depuis le fichier .example.\n' "$module"
              fi
          done

          if [ -z "${HAPROXY_STATS_PASSWORD:-}" ]; then
              printf '⚠️  Définissez HAPROXY_STATS_PASSWORD avant la Phase 3.\n'
          fi

          printf '\n✅ Les contrôles préalables non destructifs ont réussi.\n'
          printf 'Relisez chaque terraform plan et les coûts AWS avant apply.\n'
          EOF

          cat > scripts/commands/deploy.sh <<'EOF'
          #!/usr/bin/env bash
          # Point d'entrée du déploiement complet P5.

          set -euo pipefail

          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          exec "$SCRIPT_DIR/../run-all.sh" "$@"
          EOF

          cat > scripts/commands/clean-local.sh <<'EOF'
          #!/usr/bin/env bash
          # Supprime uniquement les artefacts locaux régénérables du dépôt.

          set -euo pipefail

          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          PROJECT_ROOT="$(cd -- "$SCRIPT_DIR/../.." && pwd)"
          cd "$PROJECT_ROOT"

          find terraform TEMPLATES/terraform -type d -name .terraform -prune -exec rm -rf {} +
          find terraform TEMPLATES/terraform -type f \
              \( -name '*.tfstate' -o -name '*.tfstate.*' -o -name '*.tfplan' -o -name 'tfplan' \) \
              -delete
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -f scripts/haproxy.cfg

          printf '✅ Artefacts locaux supprimés. Aucune ressource AWS n’a été modifiée.\n'
          EOF

          cat > scripts/commands/validate.sh <<'EOF'
          #!/usr/bin/env bash
          # Validation locale complète du dépôt P5.

          set -uo pipefail

          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          PROJECT_ROOT="$(cd -- "$SCRIPT_DIR/../.." && pwd)"
          ERRORS=0

          run_check() {
              local label="$1"
              shift
              printf '\n▶ %s\n' "$label"
              if "$@"; then
                  printf '✅ %s\n' "$label"
              else
                  printf '❌ %s\n' "$label"
                  ERRORS=$((ERRORS + 1))
              fi
          }

          validate_bash() {
              local script_file
              while IFS= read -r -d '' script_file; do
                  bash -n "$script_file" || return 1
              done < <(find "$PROJECT_ROOT" -type f -name '*.sh' -print0)
          }

          validate_terraform() {
              local module_dir
              for module_dir in \
                  "$PROJECT_ROOT/terraform/exercice-1" \
                  "$PROJECT_ROOT/terraform/exercice-2" \
                  "$PROJECT_ROOT/terraform/exercice-3" \
                  "$PROJECT_ROOT/TEMPLATES/terraform"; do
                  terraform -chdir="$module_dir" init -backend=false -input=false -no-color >/dev/null || return 1
                  terraform -chdir="$module_dir" validate -no-color || return 1
              done
          }

          validate_terraform_format() {
              terraform fmt -check -recursive "$PROJECT_ROOT/terraform" || return 1
              terraform fmt -check -recursive "$PROJECT_ROOT/TEMPLATES/terraform"
          }

          cd "$PROJECT_ROOT" || exit 1
          run_check "Syntaxe Bash" validate_bash

          if command -v shellcheck >/dev/null 2>&1; then
              run_check "ShellCheck" bash -c \
                  'find scripts -type f -name "*.sh" -print0 | xargs -0 shellcheck --severity=error --external-sources --source-path=SCRIPTDIR'
          fi

          if command -v terraform >/dev/null 2>&1; then
              run_check "Format Terraform" validate_terraform_format
              run_check "Validation Terraform" validate_terraform
          fi

          if command -v yamllint >/dev/null 2>&1; then
              run_check "YAML" yamllint -c "$PROJECT_ROOT/.yamllint.yml" "$PROJECT_ROOT"
          fi

          if command -v ansible-playbook >/dev/null 2>&1; then
              run_check "Syntaxe Ansible" ansible-playbook --syntax-check \
                  -i "$PROJECT_ROOT/ansible/inventories/hosts_aws.example" \
                  "$PROJECT_ROOT/ansible/playbooks/deploy.yml"
          fi

          if command -v markdownlint-cli2 >/dev/null 2>&1; then
              run_check "Markdown" markdownlint-cli2 "$PROJECT_ROOT/**/*.md"
          fi

          printf '\n'
          if [ "$ERRORS" -eq 0 ]; then
              printf '✅ Tous les contrôles disponibles ont réussi.\n'
              exit 0
          fi

          printf '❌ %s contrôle(s) en échec.\n' "$ERRORS"
          exit 1
          EOF

          python3 <<'PY'
          from pathlib import Path

          path = Path("scripts/commands/destroy-aws.sh")
          content = path.read_text(encoding="utf-8")
          content = content.replace("#!/bin/bash", "#!/usr/bin/env bash", 1)
          content = content.replace('PROJECT_ROOT="$(cd -- "$SCRIPT_DIR/.." && pwd)"', 'PROJECT_ROOT="$(cd -- "$SCRIPT_DIR/../.." && pwd)"')
          path.write_text(content, encoding="utf-8")
          PY

          cat > README.md <<'EOF'
          # 🚀 P5 OpenClassrooms — Infrastructure as Code et automatisation

          [![CI](https://github.com/mathiasseguincadiche/p5_Openclassrooms/actions/workflows/ci.yml/badge.svg)](https://github.com/mathiasseguincadiche/p5_Openclassrooms/actions/workflows/ci.yml)

          Ce dépôt regroupe les trois exercices du projet P5 : provisionnement AWS
          avec Terraform, configuration avec Ansible, observabilité OpenSearch et
          répartition de charge avec HAProxy. Les scripts accompagnent chaque étape
          sans masquer les actions susceptibles de créer des coûts.

          ## 🧭 Navigation rapide

          - [Documentation générale](docs/README.md)
          - [Scripts et commandes](scripts/README.md)
          - [Infrastructure Terraform](terraform/README.md)
          - [Déploiement Ansible](ansible/README.md)
          - [Livrables](docs/livrables/README.md)
          - [Rapport de validation](docs/reports/validation.md)
          - [Templates réutilisables](TEMPLATES/README.md)

          ## 🏗️ Parcours du projet

          | Exercice | Infrastructure | Automatisation | Livrable |
          | --- | --- | --- | --- |
          | 1 — Terraform, Ansible et NGINX | [`terraform/exercice-1`](terraform/exercice-1/) | [`phase-1-terraform-ansible.sh`](scripts/phases/phase-1-terraform-ansible.sh) | [Preuves Exercice 1](docs/livrables/SEGUIN-CADICHE_Mathias_1_terraform_ansible_nginx_02082026.md) |
          | 2 — OpenSearch et Dashboards | [`terraform/exercice-2`](terraform/exercice-2/) | [`phase-2-opensearch-kibana.sh`](scripts/phases/phase-2-opensearch-kibana.sh) | [Preuves Exercice 2](docs/livrables/SEGUIN-CADICHE_Mathias_2_dashboard_kibana_02082026.md) |
          | 3 — HAProxy et nginxdemos/hello | [`terraform/exercice-3`](terraform/exercice-3/) | [`phase-3-haproxy.sh`](scripts/phases/phase-3-haproxy.sh) | [Preuves Exercice 3](docs/livrables/SEGUIN-CADICHE_Mathias_3_haproxy_nginxdemos_02082026.md) |

          ## 🚀 Démarrage sécurisé

          ```bash
          ./scripts/commands/setup.sh --check-only
          ./scripts/commands/pre-deployment-check.sh
          ./scripts/runbook.sh
          ```

          Le premier contrôle vérifie la machine et le dépôt. Le second vérifie les
          prérequis AWS sans créer de ressource. Le runbook conserve une confirmation
          explicite avant chaque déploiement ou destruction.

          ## 🗂️ Arborescence

          ```text
          p5_Openclassrooms/
          ├── .github/
          │   ├── ISSUE_TEMPLATE/
          │   └── workflows/ci.yml
          ├── ansible/
          │   ├── files/web-app/
          │   ├── inventories/hosts_aws.example
          │   └── playbooks/deploy.yml
          ├── docs/
          │   ├── architecture/
          │   ├── cheatsheets/
          │   ├── exercises/
          │   ├── guides/
          │   ├── livrables/
          │   └── reports/validation.md
          ├── scripts/
          │   ├── commands/
          │   ├── phases/
          │   ├── tools/
          │   ├── lib/
          │   ├── run-all.sh
          │   └── runbook.sh
          ├── terraform/
          │   ├── exercice-1/
          │   ├── exercice-2/
          │   └── exercice-3/
          ├── TEMPLATES/
          ├── LICENSE
          └── README.md
          ```

          ## 🛠️ Commandes principales

          | Action | Commande |
          | --- | --- |
          | Préparer et contrôler l'environnement | `./scripts/commands/setup.sh --check-only` |
          | Valider le dépôt | `./scripts/commands/validate.sh` |
          | Ouvrir le runbook interactif | `./scripts/runbook.sh` |
          | Exécuter une plage de phases | `./scripts/run-all.sh --from 1 --to 3 --validate` |
          | Nettoyer les artefacts locaux | `./scripts/commands/clean-local.sh` |
          | Détruire les ressources AWS | `./scripts/commands/destroy-aws.sh` |

          ## 📚 Documentation

          Les guides pédagogiques et aides-mémoire sont indexés dans
          [`docs/README.md`](docs/README.md). Les exemples génériques sont séparés du
          projet dans [`TEMPLATES/`](TEMPLATES/README.md), afin de ne pas les confondre
          avec les fichiers réellement utilisés pour les livrables.

          ## ⚠️ AWS, coûts et secrets

          - Exécutez toujours `terraform plan` avant `terraform apply`.
          - OpenSearch peut générer des coûts importants hors offre gratuite.
          - Ne versionnez jamais les états Terraform, variables locales, inventaires
            réels, clés SSH ou mots de passe.
          - Les zones « preuve à insérer » doivent être remplacées uniquement par des
            captures et sorties produites pendant un déploiement réel.
          - La destruction AWS est volontairement séparée du nettoyage local.

          ## 🤝 Contribution et licence

          Les améliorations passent par une branche et une pull request afin que la CI
          valide Bash, Terraform, YAML, Ansible, Docker, NGINX et Markdown. Le projet
          est distribué sous licence [MIT](LICENSE).
          EOF

          cat > scripts/README.md <<'EOF'
          # 🤖 Scripts d'automatisation du projet P5

          Ce dossier sépare les points d'entrée, les phases de déploiement, les outils
          autonomes et les bibliothèques partagées. Les scripts calculent leurs chemins
          depuis la racine du dépôt et peuvent être lancés depuis n'importe quel dossier.

          ## 🗂️ Organisation

          ```text
          scripts/
          ├── commands/   # Points d'entrée : préparation, validation et nettoyage
          ├── phases/     # Phases 0 à 5 du parcours P5
          ├── tools/      # Commandes autonomes pour Kibana, HAProxy et les captures
          ├── lib/        # Fonctions partagées : contrôles, couleurs, logs et prompts
          ├── run-all.sh  # Orchestrateur non interactif
          └── runbook.sh  # Menu interactif pédagogique
          ```

          ## 🚀 Points d'entrée

          | Besoin | Commande |
          | --- | --- |
          | Vérifier la machine sans déployer | `./scripts/commands/setup.sh --check-only` |
          | Contrôler les prérequis AWS | `./scripts/commands/pre-deployment-check.sh` |
          | Valider les fichiers du dépôt | `./scripts/commands/validate.sh` |
          | Utiliser le menu interactif | `./scripts/runbook.sh` |
          | Exécuter plusieurs phases | `./scripts/run-all.sh --from 1 --to 4 --validate` |
          | Supprimer les caches locaux | `./scripts/commands/clean-local.sh` |
          | Détruire les ressources AWS | `./scripts/commands/destroy-aws.sh` |

          ## 🧩 Phases

          1. `phase-0-preparation.sh` vérifie l'environnement.
          2. `phase-1-terraform-ansible.sh` déploie et configure les serveurs web.
          3. `phase-2-opensearch-kibana.sh` déploie OpenSearch et le dashboard.
          4. `phase-3-haproxy.sh` déploie HAProxy et les backends.
          5. `phase-4-livrables.sh` prépare les fichiers de remise.
          6. `phase-5-nettoyage.sh` détruit les ressources après confirmation stricte.

          ## ⚠️ Sécurité

          `clean-local.sh` ne touche jamais à AWS. À l'inverse,
          `destroy-aws.sh` et la phase 5 sont destructifs : ils affichent les ressources
          concernées et demandent une confirmation avant `terraform destroy`.
          EOF

