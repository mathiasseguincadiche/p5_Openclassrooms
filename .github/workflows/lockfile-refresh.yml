name: Temp - Régénérer package-lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lockfile:
    name: Régénérer le verrou npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: application/angular/package-lock.json
      - name: Régénérer le package-lock
        run: >-
          npm install --prefix application/angular --package-lock-only
          --ignore-scripts --no-audit --no-fund
      - name: Vérifier la résolution sécurisée
        run: |
          node -e "const lock=require('./application/angular/package-lock.json'); const pkg=lock.packages['node_modules/undici']; if (!pkg || pkg.version !== '7.29.0') process.exit(1);"
      - name: Committer le verrou régénéré
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- application/angular/package-lock.json; then
            echo 'Le package-lock est déjà synchronisé.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add application/angular/package-lock.json
          git commit -m 'fix: synchroniser le package-lock sécurisé'
          git push origin "HEAD:${{ github.head_ref }}"
