name: P5 V10 patcher

on:
  push:
    branches:
      - 'hardening/fact-driven-idempotence-v10'
    paths:
      - '.github/workflows/p5-v10-patch.yml'
      - 'tools/p5_v10_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 'hardening/fact-driven-idempotence-v10'
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/p5_v10_patch.py
      - name: Validate patched Bash
        run: |
          set -euo pipefail
          bash -n scripts/lib/p5-runtime.sh
          bash -n scripts/commands/inspect-state.sh
          bash -n scripts/tests/test-convergence-contract.sh
          shellcheck --severity=error scripts/lib/p5-runtime.sh scripts/commands/inspect-state.sh scripts/tests/test-convergence-contract.sh
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/lib/p5-runtime.sh scripts/commands/inspect-state.sh scripts/tests/test-convergence-contract.sh
          git commit -m 'feat: harden P5 fact-driven logs and reruns'
          git push origin HEAD:hardening/fact-driven-idempotence-v10
