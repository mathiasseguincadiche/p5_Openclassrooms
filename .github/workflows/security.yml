name: CI - Secrets et hygiène

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets, fichiers sensibles et supply-chain CI
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Auditer les fichiers suivis par Git
        run: python3 scripts/tools/audit_secrets.py

      - name: Auditer le SHA-pinning des GitHub Actions
        run: python3 scripts/tools/audit_github_actions_pins.py
