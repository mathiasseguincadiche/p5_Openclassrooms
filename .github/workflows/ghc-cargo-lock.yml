name: ghc-cargo-lock-bootstrap

on:
  push:
    branches: ["tmp/ghc-cargo-lock"]
    paths:
      - ".ghc-lock/**"
      - ".github/workflows/ghc-cargo-lock.yml"

permissions:
  contents: write

jobs:
  generate:
    name: Generate GHC Cargo.lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version

      - name: Generate and validate lock
        shell: bash
        run: |
          set -euo pipefail
          cd .ghc-lock
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 >/dev/null
          sha256sum Cargo.lock

      - name: Commit generated lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .ghc-lock/Cargo.lock && git ls-files --error-unmatch .ghc-lock/Cargo.lock >/dev/null 2>&1; then
            echo "Cargo.lock already committed and unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ghc-lock/Cargo.lock
          git commit -m "build: generate validated GHC Cargo.lock"
          git push origin HEAD:tmp/ghc-cargo-lock
