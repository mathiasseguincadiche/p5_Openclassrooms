name: Temporary P5 wording cleanup

on:
  push:
    branches:
      - docs/final-polish-p5
    paths:
      - '.github/workflows/_tmp-polish-p5-labels.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: docs/final-polish-p5

      - name: Replace obsolete CLI wording
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/commands/p5.sh')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'afficher le Control Center interactif (défaut)': 'afficher le centre de commande interactif (défaut)',
              'inspecter puis converger VM, AWS, tfvars et garde-fous': 'inspecter puis converger Ubuntu/WSL2, AWS, tfvars et garde-fous',
              "Un `terraform plan` vide n'est jamais appliqué. Une VM déjà conforme n'est pas\nréinstallée.": "Un `terraform plan` vide n'est jamais appliqué. Un environnement Ubuntu WSL2 déjà\nconforme n'est pas modifié inutilement.",
              "p5_ok 'VM déjà convergée : aucune installation nécessaire.'": "p5_ok 'Environnement Ubuntu WSL2 déjà convergé : aucune installation nécessaire.'",
              "p5_action 'Déconnectez-vous de la VM, reconnectez-vous, puis relancez exactement la même commande P5.'": "p5_action 'Fermez puis rouvrez le shell Ubuntu WSL2, puis relancez exactement la même commande P5.'",
              "p5_warn 'La VM présente un ou plusieurs écarts par rapport à l’état cible P5.'": "p5_warn 'L’environnement Ubuntu WSL2 présente un ou plusieurs écarts par rapport à l’état cible P5.'",
              "p5_error 'La VM doit être convergée avant de poursuivre.'": "p5_error 'L’environnement Ubuntu WSL2 doit être convergé avant de poursuivre.'",
              "'Converger le socle DevOps de la VM'": "'Converger le socle DevOps Ubuntu WSL2'",
              "p5_ok 'VM convergée et utilisable dans ce shell.'": "p5_ok 'Environnement Ubuntu WSL2 convergé et utilisable dans ce shell.'",
              "p5_warn 'VM installée mais reconnexion requise pour Docker.'": "p5_warn 'Environnement Ubuntu WSL2 installé mais reconnexion requise pour Docker.'",
              "p5_warn 'VM non convergée ; `prepare` pourra corriger uniquement les écarts.'": "p5_warn 'Environnement Ubuntu WSL2 non convergé ; `prepare` pourra corriger uniquement les écarts.'",
              '  0  Retour au Control Center': '  0  Retour au centre de commande',
              "p5_header 'P5 OPENCLASSROOMS — CONTROL CENTER V11'": "p5_header 'P5 OPENCLASSROOMS — CENTRE DE COMMANDE'",
              "printf '\\nAppuyez sur Entrée pour revenir au Control Center...'": "printf '\\nAppuyez sur Entrée pour revenir au centre de commande...'",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Marqueur attendu absent: {old!r}')
              text = text.replace(old, new)

          if 'Control Center' in text or 'CONTROL CENTER' in text or 'V11' in text:
              raise SystemExit('Ancien libellé Control Center/V11 encore présent')

          import re
          if re.search(r'\bVM\b', text):
              raise SystemExit('Ancien libellé VM encore présent dans p5.sh')

          path.write_text(text, encoding='utf-8')

      - name: Validate shell syntax
        run: bash -n scripts/commands/p5.sh

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_tmp-polish-p5-labels.yml
          git add scripts/commands/p5.sh
          git commit -m 'docs: nettoyer les libellés du centre de commande'
          git push origin HEAD:docs/final-polish-p5
