name: CI - Non-régression P5

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: non-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Contrat fonctionnel et documentaire
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Vérifier le contrat de non-régression
        run: python3 scripts/tools/audit_non_regression.py

      - name: Vérifier l'isolation des artefacts locaux non suivis
        run: bash scripts/tests/test-untracked-artifacts-ignored.sh

      - name: Vérifier le centre de commande P5
        run: bash scripts/tests/test-p5-orchestrator.sh

      - name: Vérifier l'authentification AWS automatisée
        run: bash scripts/tests/test-aws-auth.sh

      - name: Vérifier le précontrôle AWS réel
        run: bash scripts/tests/test-aws-readiness-regressions.sh

      - name: Vérifier le streaming interactif du runtime
        run: bash scripts/tests/test-interactive-streaming.sh

      - name: Vérifier Node via NVM hors shell interactif
        run: bash scripts/tests/test-nvm-noninteractive.sh

      - name: Vérifier la convergence et la réexécution
        run: bash scripts/tests/test-convergence-contract.sh

      - name: Vérifier le contrat de plateforme WSL2
        run: bash scripts/tests/test-wsl2-platform.sh

      - name: Vérifier les fichiers sensibles locaux
        run: bash scripts/tests/test-local-sensitive-files.sh

      - name: Vérifier le diagnostic adaptatif
        run: bash scripts/tests/test-diagnostics-contract.sh

      - name: Vérifier le contrat des informations requises
        run: bash scripts/tests/test-operator-input-contract.sh

      - name: Vérifier le contrat des preuves automatiques
        run: bash scripts/tests/test-proof-contract.sh
