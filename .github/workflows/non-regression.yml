name: CI - Non-régression P5

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: non-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Contrat fonctionnel et documentaire
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Vérifier le contrat de non-régression
        run: python3 scripts/tools/audit_non_regression.py

      - name: Vérifier le centre de commande P5
        run: bash scripts/tests/test-p5-orchestrator.sh

      - name: Vérifier l'authentification AWS automatisée
        run: bash scripts/tests/test-aws-auth.sh

      - name: Vérifier la convergence et la réexécution
        run: bash scripts/tests/test-convergence-contract.sh
