name: TEMP - Finaliser la qualité Angular

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.actor == 'mathiasseguincadiche' &&
      github.head_ref == 'chore/angular-quality-gates' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Câbler la CI puis retirer le tooling temporaire
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer strictement la branche de travail
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/angular-quality-gates

      - name: Appliquer la finalisation déterministe
        run: python3 .github/scripts/finalize-angular_quality.py

      - name: Retirer les deux fichiers temporaires
        run: |
          rm .github/scripts/finalize-angular_quality.py
          rm .github/workflows/temp-angular-quality-generator.yml

      - name: Vérifier et commiter uniquement la finalisation
        run: |
          set -euo pipefail
          grep -q 'npm run typecheck --prefix application/angular' .github/workflows/ci.yml
          grep -q 'application/angular/eslint.config.js' .github/workflows/ci.yml
          grep -q 'npm run test:unit --prefix application/angular' application/angular/README.md
          test ! -e .github/scripts/finalize-angular_quality.py
          test ! -e .github/workflows/temp-angular-quality-generator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            application/angular/README.md \
            .github/scripts/finalize-angular_quality.py \
            .github/workflows/temp-angular-quality-generator.yml
          git diff --cached --check
          git commit -m "ci: enforce Angular quality gates"
          git push origin HEAD:chore/angular-quality-gates
