name: Mise à jour ponctuelle du contrat des schémas

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'docs/readme-parcours-visuel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Passer le contrat de cinq à six schémas
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('.github/workflows/ci.yml'): (
                  "if len(files) != 5:",
                  "if len(files) != 6:",
                  "5 schémas attendus",
                  "6 schémas attendus",
              ),
              Path('scripts/commands/validate.sh'): (
                  "if len(files) != 5:",
                  "if len(files) != 6:",
                  "5 schémas SVG attendus",
                  "6 schémas SVG attendus",
              ),
          }

          for path, values in replacements.items():
              old_test, new_test, old_message, new_message = values
              content = path.read_text()
              if old_test not in content or old_message not in content:
                  raise SystemExit(f'Contrat attendu introuvable dans {path}')
              content = content.replace(old_test, new_test, 1)
              content = content.replace(old_message, new_message, 1)
              path.write_text(content)
          PY

          rm .github/workflows/update-schema-count.yml

      - name: Publier la mise à jour et retirer ce workflow ponctuel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml scripts/commands/validate.sh \
            .github/workflows/update-schema-count.yml
          git commit -m 'ci: valider les six schémas du parcours'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
