name: Corriger le dernier lien interne

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'chore/reorganiser-arborescence-20260804'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Corriger, contrôler et pousser
        shell: bash
        run: |
          set -euo pipefail
          sed -i \
            's#../../TEMPLATES/ansible/inventories/hosts_aws.example.ini#../../TEMPLATES/ansible/inventory.ini#g' \
            docs/architecture/tools.md

          grep -Fq '../../TEMPLATES/ansible/inventory.ini' docs/architecture/tools.md
          test -f TEMPLATES/ansible/inventory.ini

          rm -f \
            .github/final-ci-trigger \
            .github/workflows/final-link-fix.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: corriger le lien vers l’inventaire Ansible"
          git push origin HEAD:chore/reorganiser-arborescence-20260804
