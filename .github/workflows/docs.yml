# =============================================
# Workflow pour générer et déployer la documentation
# =============================================
# Ce workflow s'exécute à chaque push sur la branche main.
# Il permet de :
# 1. Générer la documentation (si nécessaire).
# 2. Déployer la documentation sur GitHub Pages (optionnel).
#
# Pour activer GitHub Pages :
# 1. Allez dans Settings > Pages.
# 2. Sélectionnez la branche "gh-pages" et le dossier "/ (root)".
#
# Pour désactiver ce workflow, supprimez ce fichier ou commentez son contenu.

name: Docs - Génération et déploiement

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - 'TEMPLATES/**'
      - 'README.md'

jobs:
  # Job 1 : Générer la documentation (optionnel)
  generate-docs:
    name: Générer la documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Exemple : Générer un site statique avec MkDocs (si vous utilisez MkDocs)
