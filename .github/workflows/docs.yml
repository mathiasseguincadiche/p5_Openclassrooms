# =============================================
# BONNES PRATIQUES :
# =============================================
# 1. Ce workflow est optionnel et peut être désactivé si vous n'avez pas besoin de GitHub Pages.
# 2. Pour utiliser GitHub Pages, activez-le dans les paramètres du dépôt.
# 3. Pour générer de la documentation, utilisez des outils comme MkDocs, Docusaurus, ou Sphinx.
# 4. Pour déployer sur un autre service (ex: Netlify, Vercel), utilisez l'API du service.
