# =============================================================================
# CI : validation reproductible de l'ensemble du dépôt P5
# =============================================================================
name: CI - Qualité du dépôt

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bash:
    name: Bash
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Vérifier la syntaxe Bash
        run: find . -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Analyser les scripts avec ShellCheck
        run: find . -type f -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=error

  yaml:
    name: YAML
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer yamllint
        run: python -m pip install --disable-pip-version-check yamllint==1.37.1

      - name: Vérifier les fichiers YAML
        run: yamllint --config-file .yamllint.yml .

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Vérifier le format Terraform
        run: terraform fmt -check -recursive

      - name: Initialiser et valider chaque module racine
        shell: bash
        run: |
          set -euo pipefail
          modules=(
            terraform/exercice-1
            terraform/exercice-2
            terraform/exercice-3
            TEMPLATES/terraform
          )
          for module in "${modules[@]}"; do
            echo "Validation de ${module}"
            terraform -chdir="${module}" init -backend=false -input=false
            terraform -chdir="${module}" validate
          done

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Vérifier la présentation Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            #node_modules

      - name: Vérifier les liens et ancres internes
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress './**/*.md'
          fail: true

  configurations:
    name: Ansible, NGINX et Docker
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Vérifier les Dockerfiles avec Hadolint
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' dockerfile; do
            echo "Validation de ${dockerfile}"
            docker run --rm -i hadolint/hadolint:v2.14.0-alpine \
              hadolint --failure-threshold error - < "${dockerfile}"
          done < <(find . -type f -name 'Dockerfile*' -print0)

      - name: Vérifier Docker Compose
        env:
          DB_PASSWORD: ci-placeholder-not-a-secret
        run: docker compose --file TEMPLATES/docker/docker-compose.yml config --quiet

      - name: Installer Ansible
        run: python -m pip install --disable-pip-version-check 'ansible-core>=2.18,<2.20'

      - name: Vérifier le playbook Ansible
        run: ansible-playbook --syntax-check --inventory ansible/inventories/hosts_aws.example ansible/playbooks/deploy.yml

      - name: Vérifier la configuration NGINX
        run: |
          docker run --rm \
            --volume "$PWD/ansible/files/nginx-web-app.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.28-alpine nginx -t

  export-audit:
    name: Archive d’audit
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Créer l’archive
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=repository.tgz -czf "$RUNNER_TEMP/repository.tgz" .

      - name: Publier l’archive
        uses: actions/upload-artifact@v4
        with:
          name: p5-repository-audit
          path: ${{ runner.temp }}/repository.tgz
          if-no-files-found: error
          retention-days: 1
