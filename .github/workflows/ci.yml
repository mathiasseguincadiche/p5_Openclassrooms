name: Appliquer la reconstruction P5 AWS

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: p5-rewrite-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'apply/final-p5-aws'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche d’application
        uses: actions/checkout@v7
        with:
          ref: apply/final-p5-aws
          fetch-depth: 0

      - name: Reconstruire le dépôt P5 AWS
        shell: bash
        run: |
          set -euo pipefail

          cp .github/workflows/ci.yml "$RUNNER_TEMP/reconstruction-ci.yml"
          cat .p5-rewrite/* | base64 --decode > "$RUNNER_TEMP/p5-final.tgz"
          tar -tzf "$RUNNER_TEMP/p5-final.tgz" >/dev/null

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf "$RUNNER_TEMP/p5-final.tgz" -C .
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/reconstruction-ci.yml" .github/workflows/ci.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: publier le wiki P5 sur le parcours AWS"
          git push origin HEAD:apply/final-p5-aws
