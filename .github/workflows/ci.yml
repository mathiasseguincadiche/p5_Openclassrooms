# =============================================================================
# CI : validation reproductible du dépôt P5
# =============================================================================
name: CI - Qualité du dépôt

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coherence:
    name: Périmètre, parcours complet et Bash
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Vérifier le périmètre officiel
        shell: bash
        run: |
          set -euo pipefail
          test ! -d TEMPLATES
          test ! -d docs/exercises
          test "$(find docs/exercices -maxdepth 1 -type f -name '*.md' | wc -l)" -eq 3
          if grep -RIl --include='*.md' '```mermaid' . | grep -q .; then
            echo 'Des blocs Mermaid subsistent.' >&2
            exit 1
          fi

      - name: Vérifier les capacités indispensables
        shell: bash
        run: |
          set -euo pipefail
          required=(
            docs/00-preparation-environnement.md
            docs/00b-preparation-compte-aws.md
            docs/04-audit-non-regression.md
            docs/livrables/README.md
            environment/versions.env
            environment/aws-readiness.env.example
            aws/README.md
            aws/iam/p5-lab-policy.json
            aws/budgets/p5-monthly-budget.json.example
            application/angular/angular.json
            application/angular/package.json
            application/angular/package-lock.json
            application/angular/src/main.ts
            ansible/files/angular-app/index.html
            ansible/files/nginx-angular.conf
            ansible/playbooks/deploy.yml
            terraform/exercice-2/opensearch/index-template.json
            terraform/exercice-2/samples/nginx-access.log.sample
            proofs/README.md
            scripts/tools/convert-nginx-logs.py
            scripts/tools/generer-haproxy-config.sh
            scripts/commands/prepare-angular-artifact.sh
            scripts/commands/verify-angular-deployment.sh
            scripts/commands/generate-nginx-traffic.sh
            scripts/commands/collect-nginx-access-log.sh
            scripts/commands/import-opensearch-data.sh
            scripts/commands/verify-opensearch-data.sh
            scripts/commands/test-haproxy-roundrobin.sh
            scripts/commands/test-haproxy-failover.sh
            scripts/commands/prepare-livrables.sh
          )
          for path in "${required[@]}"; do test -e "$path"; done
          test ! -e environment/aws-readiness.env
          grep -q '../files/angular-app/' ansible/playbooks/deploy.yml
          grep -q '../files/nginx-angular.conf' ansible/playbooks/deploy.yml
          grep -q '<app-root' ansible/files/angular-app/index.html
          grep -q 'NODE_VERSION=22.22.0' environment/versions.env
          if grep -q 'Interface web pour l.Exercice 1' \
            ansible/files/angular-app/index.html; then
            echo 'La page HTML témoin a été réintroduite.' >&2
            exit 1
          fi

      - name: Vérifier les permissions exécutables
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            scripts/commands/bootstrap-ubuntu-server.sh
            scripts/commands/setup.sh
            scripts/commands/validate.sh
            scripts/commands/pre-deployment-check.sh
            scripts/commands/prepare-angular-artifact.sh
            scripts/commands/verify-angular-deployment.sh
            scripts/commands/generate-nginx-traffic.sh
            scripts/commands/collect-nginx-access-log.sh
            scripts/commands/import-opensearch-data.sh
            scripts/commands/verify-opensearch-data.sh
            scripts/commands/test-haproxy-roundrobin.sh
            scripts/commands/test-haproxy-failover.sh
            scripts/commands/prepare-livrables.sh
            scripts/tools/generer-haproxy-config.sh
          )
          for script in "${scripts[@]}"; do test -x "$script"; done

      - name: Vérifier les garde-fous AWS
        shell: bash
        run: |
          set -euo pipefail
          for module in exercice-1 exercice-2 exercice-3; do
            grep -q 'allowed_account_ids' "terraform/${module}/main.tf"
            grep -q 'default_tags' "terraform/${module}/main.tf"
            grep -q 'expected_aws_account_id' "terraform/${module}/variables.tf"
            grep -q '203.0.113.10/32' "terraform/${module}/variables.tf"
            grep -q 'expected_aws_account_id' \
              "terraform/${module}/terraform.tfvars.example"
          done
          grep -q 'P5_ROOT_MFA_CONFIRMED=no' \
            environment/aws-readiness.env.example
          grep -q 'P5_REQUIRED_STANDARD_VCPUS=8' \
            environment/aws-readiness.env.example
          if grep -Eq '^[[:space:]]*terraform[[:space:]]+(apply|destroy)([[:space:]]|$)' \
            scripts/commands/check-aws-readiness.sh \
            scripts/commands/check-aws-cleanup.sh; then
            echo 'Un contrôle AWS non destructif lance Terraform.' >&2
            exit 1
          fi

      - name: Vérifier la syntaxe et la qualité Bash
        shell: bash
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 \
            | xargs -0 -r -n1 bash -n
          find scripts -type f -name '*.sh' -print0 \
            | xargs -0 -r shellcheck --severity=error

      - name: Valider JSON et livrables
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool aws/iam/p5-lab-policy.json >/dev/null
          python3 -m json.tool \
            aws/budgets/p5-monthly-budget.json.example >/dev/null
          python3 -m json.tool \
            terraform/exercice-2/opensearch/index-template.json >/dev/null
          python3 -m json.tool application/angular/package.json >/dev/null
          python3 -m json.tool application/angular/package-lock.json >/dev/null
          ./scripts/commands/prepare-livrables.sh --structure-only

      - name: Vérifier les schémas compacts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          files = sorted(Path('docs/schemas').glob('*.svg'))
          if len(files) != 5:
              raise SystemExit(f'5 schémas attendus, {len(files)} trouvés')
          for file in files:
              ET.parse(file)
              if file.stat().st_size > 12000:
                  raise SystemExit(f'{file.name} est trop lourd')
          PY

  angular:
    name: Application Angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: application/angular/package-lock.json
      - name: Installer et construire
        run: |
          npm ci --prefix application/angular --no-audit --no-fund
          npm run build --prefix application/angular
      - name: Vérifier la synchronisation avec Ansible
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t build_indexes < <(
            find application/angular/dist -type f -name index.html | sort
          )
          test "${#build_indexes[@]}" -eq 1
          build_dir="$(dirname "${build_indexes[0]}")"
          diff -qr "$build_dir" ansible/files/angular-app

  opensearch_data:
    name: Données OpenSearch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Convertir et contrôler l’échantillon
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/tools/convert-nginx-logs.py
          python3 scripts/tools/convert-nginx-logs.py \
            terraform/exercice-2/samples/nginx-access.log.sample \
            --output /tmp/nginx-access.bulk.ndjson
          test "$(wc -l < /tmp/nginx-access.bulk.ndjson)" -eq 128
          python3 - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          lines = Path('/tmp/nginx-access.bulk.ndjson').read_text().splitlines()
          documents = [json.loads(line) for line in lines[1::2]]
          methods = {doc['http_method'] for doc in documents}
          paths = {doc['url_path'] for doc in documents}
          buckets = {
              (stamp.date().isoformat(), 0 if stamp.hour < 12 else 12)
              for stamp in (
                  datetime.fromisoformat(doc['@timestamp']) for doc in documents
              )
          }
          if len(documents) != 64:
              raise SystemExit('64 documents attendus')
          if len(methods) < 3 or len(paths) < 5 or len(buckets) < 4:
              raise SystemExit('Échantillon insuffisant pour les visualisations')
          PY

  haproxy:
    name: Configuration HAProxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Générer et valider la configuration
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/tools/generer-haproxy-config.sh \
            10.0.1.10 10.0.2.10 /tmp/haproxy.cfg
          docker run --rm \
            --volume /tmp/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro \
            haproxy:3.2-alpine \
            haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg

  yaml:
    name: YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python -m pip install --disable-pip-version-check yamllint==1.37.1
      - run: yamllint --config-file .yamllint.yml .

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
      - run: terraform fmt -check -recursive terraform
      - name: Initialiser et valider les trois modules
        shell: bash
        run: |
          set -euo pipefail
          for module in exercice-1 exercice-2 exercice-3; do
            terraform -chdir="terraform/${module}" \
              init -backend=false -input=false -no-color
            terraform -chdir="terraform/${module}" validate -no-color
          done

  documentation:
    name: Markdown et liens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            #node_modules
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress './**/*.md'
          fail: true

  configurations:
    name: Ansible et NGINX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Vérifier les Dockerfiles présents
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' dockerfile; do
            docker run --rm -i hadolint/hadolint:v2.14.0-alpine \
              hadolint --failure-threshold error - < "${dockerfile}"
          done < <(find . -type f -name 'Dockerfile*' -print0)
      - run: >-
          python -m pip install --disable-pip-version-check
          'ansible-core>=2.18,<2.20'
      - run: >-
          ansible-playbook --syntax-check
          --inventory ansible/inventories/hosts_aws.example
          ansible/playbooks/deploy.yml
      - run: |
          docker run --rm \
            --volume "$PWD/ansible/files/nginx-angular.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.28-alpine nginx -t
