# =============================================================================
# CI : validation reproductible du dépôt P5
# =============================================================================
name: CI - Qualité du dépôt

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coherence:
    name: Périmètre, variables, sécurité et Bash
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Vérifier le périmètre officiel
        shell: bash
        run: |
          set -euo pipefail
          test ! -d TEMPLATES
          test ! -d docs/exercises
          test "$(find docs/exercices -maxdepth 1 -type f -name '*.md' | wc -l)" -eq 3
          if grep -RIl --include='*.md' '```mermaid' . | grep -q .; then
            echo 'Des blocs Mermaid subsistent.' >&2
            exit 1
          fi

      - name: Vérifier les capacités indispensables
        shell: bash
        run: |
          set -euo pipefail
          required=(
            docs/00-preparation-environnement.md
            docs/00b-preparation-compte-aws.md
            docs/01-parcours-debutant.md
            docs/04-audit-non-regression.md
            docs/livrables/README.md
            environment/versions.env
            environment/wsl2/README.md
            environment/aws-readiness.env.example
            aws/README.md
            aws/iam/p5-lab-policy.json
            aws/budgets/p5-monthly-budget.json.example
            application/angular/angular.json
            application/angular/package.json
            application/angular/package-lock.json
            application/angular/src/main.ts
            application/angular/tests/app-contract.test.mjs
            ansible/files/angular-app/index.html
            ansible/files/nginx-angular.conf
            ansible/playbooks/deploy.yml
            terraform/exercice-2/opensearch/index-template.json
            terraform/exercice-2/samples/nginx-access.log.sample
            terraform/exercice-3/haproxy.cfg.tpl
            proofs/README.md
            scripts/lib/p5-runtime.sh
            scripts/lib/p5-platform.sh
            scripts/tools/convert-nginx-logs.py
            scripts/tools/generer-haproxy-config.sh
            scripts/commands/p5.sh
            scripts/commands/snapshot-terraform-state.sh
            scripts/commands/bootstrap-wsl2.sh
            scripts/commands/configure-lab.sh
            scripts/commands/generate-ansible-inventory.sh
            scripts/commands/sync-terraform-tfvars.sh
            scripts/commands/prepare-angular-artifact.sh
            scripts/commands/verify-angular-deployment.sh
            scripts/commands/generate-nginx-traffic.sh
            scripts/commands/collect-nginx-access-log.sh
            scripts/commands/import-opensearch-data.sh
            scripts/commands/verify-opensearch-data.sh
            scripts/commands/test-haproxy-roundrobin.sh
            scripts/commands/test-haproxy-failover.sh
            scripts/commands/prepare-livrables.sh
            scripts/tests/test-p5-orchestrator.sh
            scripts/tests/test-wsl2-platform.sh
            scripts/tests/test-local-sensitive-files.sh
            scripts/tests/test-diagnostics-contract.sh
            scripts/tests/test-nginx-angular.sh
            scripts/tests/test-haproxy-containers.sh
            scripts/tests/test-opensearch-local.sh
          )
          for path in "${required[@]}"; do test -e "$path"; done
          test ! -e environment/aws-readiness.env
          grep -q '../files/angular-app/' ansible/playbooks/deploy.yml
          grep -q '../files/nginx-angular.conf' ansible/playbooks/deploy.yml
          grep -q '<app-root' ansible/files/angular-app/index.html
          grep -q 'NODE_VERSION=22.22.0' environment/versions.env
          grep -q 'ANSIBLE_CORE_VERSION=2.20.1' environment/versions.env
          grep -q 'TERRAFORM_VERSION=1.15.8' environment/versions.env
          grep -q '^NVM_COMMIT=62387b8f92aa012d48202747fd75c40850e5e261$' environment/versions.env
          grep -Fq 'git -C "$NVM_DIR" fetch --depth 1 origin "$NVM_COMMIT"' scripts/commands/bootstrap-wsl2.sh
          if grep -Fq 'install.sh" | bash' scripts/commands/bootstrap-wsl2.sh; then
            echo 'Le bootstrap NVM utilise encore curl | bash.' >&2
            exit 1
          fi
          grep -q 'verify_ansible_idempotence' scripts/commands/p5.sh
          grep -q 'opensearch-real-import' scripts/commands/p5.sh
          grep -q 'p5_manual_checkpoint' scripts/commands/p5.sh
          grep -Fq 'haproxy.cfg.tpl' terraform/exercice-3/main.tf
          grep -Fq 'nginxdemos/hello:0.4-plain-text' terraform/exercice-3/main.tf
          if grep -q 'Interface web pour l.Exercice 1' \
            ansible/files/angular-app/index.html; then
            echo 'La page HTML témoin a été réintroduite.' >&2
            exit 1
          fi

      - name: Vérifier les permissions exécutables historiques
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            scripts/commands/snapshot-terraform-state.sh
            scripts/commands/bootstrap-wsl2.sh
            scripts/commands/bootstrap-ubuntu-server.sh
            scripts/commands/setup.sh
            scripts/commands/validate.sh
            scripts/commands/pre-deployment-check.sh
            scripts/commands/prepare-angular-artifact.sh
            scripts/commands/verify-angular-deployment.sh
            scripts/commands/generate-nginx-traffic.sh
            scripts/commands/collect-nginx-access-log.sh
            scripts/commands/import-opensearch-data.sh
            scripts/commands/verify-opensearch-data.sh
            scripts/commands/test-haproxy-roundrobin.sh
            scripts/commands/test-haproxy-failover.sh
            scripts/commands/prepare-livrables.sh
            scripts/tools/generer-haproxy-config.sh
          )
          for script in "${scripts[@]}"; do test -x "$script"; done

      - name: Vérifier les garde-fous AWS et EC2
        shell: bash
        run: |
          set -euo pipefail
          for module in exercice-1 exercice-2 exercice-3; do
            grep -q 'allowed_account_ids' "terraform/${module}/main.tf"
            grep -q 'default_tags' "terraform/${module}/main.tf"
            grep -q 'expected_aws_account_id' "terraform/${module}/variables.tf"
            grep -q '203.0.113.10/32' "terraform/${module}/variables.tf"
            grep -q 'expected_aws_account_id' \
              "terraform/${module}/terraform.tfvars.example"
          done
          for module in exercice-1 exercice-3; do
            grep -q 'http_tokens.*=.*"required"' "terraform/${module}/main.tf"
            grep -q 'encrypted.*=.*true' "terraform/${module}/main.tf"
          done
          grep -q 'opensearch_domain_name' terraform/exercice-2/variables.tf
          grep -q 'opensearch_engine_version' terraform/exercice-2/variables.tf
          grep -q 'opensearch_instance_type' terraform/exercice-2/variables.tf
          grep -q 'opensearch_volume_size_gb' terraform/exercice-2/variables.tf
          grep -q 'P5_SSH_PUBLIC_KEY_PATH=' environment/aws-readiness.env.example
          grep -q 'P5_OPENSEARCH_VOLUME_SIZE_GB=10' environment/aws-readiness.env.example
          grep -q 'P5_ROOT_MFA_CONFIRMED=no' environment/aws-readiness.env.example
          grep -q 'P5_REQUIRED_STANDARD_VCPUS=8' environment/aws-readiness.env.example
          if grep -Eq '^[[:space:]]*terraform[[:space:]]+(apply|destroy)([[:space:]]|$)' \
            scripts/commands/check-aws-readiness.sh \
            scripts/commands/check-aws-cleanup.sh; then
            echo 'Un contrôle AWS non destructif lance Terraform.' >&2
            exit 1
          fi

      - name: Tester la génération et la cohérence des tfvars
        shell: bash
        run: |
          set -euo pipefail
          cp environment/aws-readiness.env.example /tmp/aws-readiness.env
          sed -i \
            -e 's/P5_EXPECTED_ACCOUNT_ID=000000000000/P5_EXPECTED_ACCOUNT_ID=123456789012/' \
            -e 's#P5_PUBLIC_IP_CIDR=203.0.113.10/32#P5_PUBLIC_IP_CIDR=198.51.100.42/32#' \
            /tmp/aws-readiness.env
          bash scripts/commands/sync-terraform-tfvars.sh \
            --config /tmp/aws-readiness.env --apply
          bash scripts/commands/sync-terraform-tfvars.sh \
            --config /tmp/aws-readiness.env --check
          for module in exercice-1 exercice-2 exercice-3; do
            test "$(stat -c '%a' "terraform/${module}/terraform.tfvars")" = 600
          done

      - name: Vérifier la syntaxe et la qualité Bash
        shell: bash
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 \
            | xargs -0 -r -n1 bash -n

          find scripts -type f -name '*.sh' -print0 \
            | xargs -0 -r shellcheck --severity=error

      - name: Tester le contrat de l'orchestrateur P5
        shell: bash
        run: bash scripts/tests/test-p5-orchestrator.sh

      - name: Tester la sauvegarde locale des states Terraform
        shell: bash
        run: bash scripts/tests/test-terraform-state-snapshot.sh

      - name: Tester la séparation fichiers locaux / fichiers suivis
        shell: bash
        run: bash scripts/tests/test-local-sensitive-files.sh

      - name: Tester le diagnostic adaptatif
        shell: bash
        run: bash scripts/tests/test-diagnostics-contract.sh

      - name: Valider JSON et livrables
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool aws/iam/p5-lab-policy.json >/dev/null
          python3 -m json.tool \
            aws/budgets/p5-monthly-budget.json.example >/dev/null
          python3 -m json.tool \
            terraform/exercice-2/opensearch/index-template.json >/dev/null
          python3 -m json.tool application/angular/package.json >/dev/null
          python3 -m json.tool application/angular/package-lock.json >/dev/null
          ./scripts/commands/prepare-livrables.sh --structure-only

      - name: Vérifier les six schémas du parcours
        run: python3 scripts/tools/audit_non_regression.py --schemas-only

  angular:
    name: Angular, TypeScript et NGINX réel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: application/angular/package-lock.json
      - name: Installer les dépendances verrouillées
        run: npm ci --prefix application/angular --no-audit --no-fund
      - name: Vérifier TypeScript et le contrat applicatif
        run: |
          npm run lint --prefix application/angular
          npm test --prefix application/angular
      - name: Auditer les dépendances de production
        run: npm run security:dependencies --prefix application/angular
      - name: Construire l'application
        run: npm run build --prefix application/angular
      - name: Vérifier la synchronisation avec Ansible
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t build_indexes < <(
            find application/angular/dist -type f -name index.html | sort
          )
          test "${#build_indexes[@]}" -eq 1
          build_dir="$(dirname "${build_indexes[0]}")"
          diff -qr "$build_dir" ansible/files/angular-app
      - name: Servir le build avec la vraie configuration NGINX
        run: bash scripts/tests/test-nginx-angular.sh

  opensearch:
    name: OpenSearch local, Bulk et agrégations
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
      - name: Préparer le noyau pour OpenSearch
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Tester OpenSearch en conteneur éphémère
        run: bash scripts/tests/test-opensearch-local.sh

  haproxy:
    name: HAProxy round-robin, panne et reprise
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tester la haute disponibilité en conteneurs
        run: bash scripts/tests/test-haproxy-containers.sh

  yaml:
    name: YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m pip install --disable-pip-version-check yamllint==1.37.1
      - run: yamllint --config-file .yamllint.yml .

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
      - run: terraform fmt -check -recursive terraform
      - name: Initialiser et valider les trois modules
        shell: bash
        run: |
          set -euo pipefail
          for module in exercice-1 exercice-2 exercice-3; do
            terraform -chdir="terraform/${module}" \
              init -backend=false -input=false -no-color
            terraform -chdir="terraform/${module}" validate -no-color
          done

  documentation:
    name: Markdown et liens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            #node_modules
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --no-progress './**/*.md'
          fail: true

  configurations:
    name: Ansible 2.20.1 et NGINX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Vérifier les Dockerfiles présents
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' dockerfile; do
            docker run --rm -i hadolint/hadolint:v2.14.0-alpine \
              hadolint --failure-threshold error - < "${dockerfile}"
          done < <(find . -type f -name 'Dockerfile*' -print0)
      - name: Installer la version Ansible du lab
        shell: bash
        run: |
          set -euo pipefail
          source environment/versions.env
          python -m pip install --disable-pip-version-check "$ANSIBLE_CORE_SPEC"
          ansible-playbook --version | head -n 1 | grep -F "core ${ANSIBLE_CORE_VERSION}"
      - name: Installer les collections Ansible requises
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - run: >-
          ansible-playbook --syntax-check
          --inventory ansible/inventories/hosts_aws.example
          ansible/playbooks/deploy.yml
      - run: |
          docker run --rm \
            --volume "$PWD/ansible/files/nginx-angular.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.28-alpine nginx -t
