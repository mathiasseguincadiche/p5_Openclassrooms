name: Génération temporaire Angular

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
      - name: Générer le verrouillage et le build
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix application/angular --no-audit --no-fund
          npm run build --prefix application/angular
          build_index="$(find application/angular/dist -type f -name index.html | head -n 1)"
          test -n "$build_index"
          build_dir="$(dirname "$build_index")"
          rm -rf ansible/files/angular-app
          mkdir -p ansible/files/angular-app
          cp -a "$build_dir/." ansible/files/angular-app/
      - name: Publier les fichiers générés sur la branche
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add application/angular/package-lock.json ansible/files/angular-app
          if git diff --cached --quiet; then
            echo 'Aucun fichier généré à publier.'
            exit 0
          fi
          git commit -m 'build: synchroniser l’application Angular'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
